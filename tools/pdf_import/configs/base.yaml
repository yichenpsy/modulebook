module_start_patterns:
  - "^\\s*Modulnummer\\s+((?:B\\d{2}[a-z]?|WP\\d{2})(?:\\.\\d+)?)\\b"
  - "^\\s*Module\\s+ID\\s+((?:B\\d{2}[a-z]?|WP\\d{2})(?:\\.\\d+)?)\\b"
  - "^\\s*Module\\s+ID\\s*\\n\\s*Modulkürzel\\s*\\n\\s*([A-Z]{2,3}\\d?|ES\\d|EX\\d)\\b"
  - "^\\s*Modul\\s*ID\\s+((?:B\\d{2}[a-z]?|WP\\d{2})(?:\\.\\d+)?)\\b"

