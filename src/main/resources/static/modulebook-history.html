<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Study Program Change Log</title>
    <link rel="stylesheet" href="/app.css">
</head>
<body>
    <nav>
        <a href="/index.html">Modulebooks</a>
    </nav>

    <h1>Study Program Change Log</h1>

    <section>
        <div id="status" class="status">Loading history...</div>
        <div class="form-actions">
            <a id="backLink" href="/index.html">Back to study program</a>
            <a id="compareVersionLink" href="/index.html">Compare Version</a>
        </div>
    </section>

    <section>
        <h2 id="studyProgramTitle">History</h2>
        <div id="history">Loading...</div>
    </section>

    <script src="/api.js?v=modulebook-versions"></script>
    <script>
        const params = new URLSearchParams(window.location.search);
        const modulebookId = params.get("id");
        const selectedChangeSetId = params.get("changeSetId");
        const selectedChangeId = params.get("changeId");
        const sourceModuleLogId = params.get("moduleLogId");
        const sourcePage = params.get("source");
        const fromVersionControl = sourcePage === "versionControl";
        const selectedModulebookVersionId = params.get("modulebookVersionId") || params.get("modulebookTagId");
        let studyProgram = null;
        let modules = [];
        let teachingForms = [];
        let changeSets = [];
        let modulebookVersions = [];
        let changesByChangeSetId = new Map();
        let versionsByChangeSetId = new Map();
        let versionsByModulebookVersionId = new Map();

        async function init() {
            if (!modulebookId) {
                setStatus("Missing modulebook id in URL. Example: /modulebook-history.html?id=3");
                return;
            }

            document.getElementById("backLink").href = `/index.html?modulebookId=${modulebookId}`;
            document.getElementById("compareVersionLink").href =
                `/modulebook-version-compare.html?id=${encodeURIComponent(modulebookId)}`;
            if (sourceModuleLogId || fromVersionControl) {
                document.getElementById("backLink").hidden = true;
                document.getElementById("compareVersionLink").hidden = true;
            }

            try {
                const modulebooks = await loadModulebooks();
                studyProgram = modulebooks.find(program => String(program.id) === String(modulebookId));
                [modules, changeSets, modulebookVersions, teachingForms] = await Promise.all([
                    loadModulesForModulebook(modulebookId),
                    loadModulebookChangeSets(modulebookId),
                    loadModulebookVersions(modulebookId),
                    loadTeachingForms()
                ]);
                await loadVisibleFieldChanges();
                calculateHistoryVersions();
                renderTitle();
                await renderHistory();
                setStatus(`Loaded ${changeSets.length} change sets and ${modulebookVersions.length} modulebook versions.`);
            } catch (error) {
                setStatus("Could not load study program change log: " + error.message);
            }
        }

        async function loadVisibleFieldChanges() {
            const visibleChangeSets = selectedChangeSetId
                ? changeSets.filter(changeSet => String(changeSet.id) === String(selectedChangeSetId))
                : changeSets;

            const entries = await Promise.all(visibleChangeSets.map(async changeSet => [
                Number(changeSet.id),
                await loadChangeSetFieldChanges(changeSet.id)
            ]));

            changesByChangeSetId = new Map(entries);
        }

        function renderTitle() {
            if (!studyProgram) {
                document.getElementById("studyProgramTitle").textContent =
                    `Study program ${modulebookId}`;
                return;
            }

            document.getElementById("studyProgramTitle").textContent =
                modulebookLabel(studyProgram);
        }

        async function renderHistory() {
            const container = document.getElementById("history");

            if (changeSets.length === 0 && modulebookVersions.length === 0) {
                container.textContent = "No change log exists for this study program yet.";
                return;
            }

            if (selectedChangeSetId && selectedChangeId) {
                await renderFieldChangeDetail(container);
                return;
            }

            if (selectedChangeSetId) {
                renderChangeSetDetail(container);
                return;
            }

            if (selectedModulebookVersionId) {
                renderModulebookVersionDetail(container);
                return;
            }

            renderChangeSetList(container);
        }

        function renderChangeSetList(container) {
            container.innerHTML = `
                ${renderModulebookVersionList()}
                <h3>Complete change log</h3>
                <table>
                    <thead>
                        <tr>
                            <th>Version</th>
                            <th>Created</th>
                            <th>Change set</th>
                            <th>Source</th>
                            <th>Reason</th>
                            <th>Changed modules</th>
                            <th>Changed fields</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${historyRowsDescending().map(renderHistoryRow).join("")}
                    </tbody>
                </table>
            `;
        }

        function renderModulebookVersionList() {
            if (modulebookVersions.length === 0) {
                return `
                    <section>
                        <h3>Modulebook versions</h3>
                        <p>No modulebook versions saved yet.</p>
                    </section>
                `;
            }

            return `
                <section>
                    <h3>Modulebook versions</h3>
                    <table>
                        <thead>
                            <tr>
                                <th>Version</th>
                                <th>Created</th>
                                <th>Version message</th>
                                <th>Modulebook release date</th>
                                <th>Study and Examination Regulations</th>
                                <th>Active modules</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${modulebookVersions.map(version => `
                                <tr class="modulebook-version-row">
                                    <td class="version-cell">${escapeHtml(versionForModulebookVersion(version))}</td>
                                    <td>${escapeHtml(formatDate(version.createdAt))}</td>
                                    <td>${escapeHtml(version.versionMessage || "")}</td>
                                    <td>${escapeHtml(formatDateOnly(version.modulebookReleaseDate))}</td>
                                    <td>${escapeHtml(formatDateOnly(version.studyExaminationRegulationsDate))}</td>
                                    <td>${escapeHtml(String(modulebookVersionActiveModuleCount(version)))}</td>
                                    <td class="row-actions">
                                        <a href="/modulebook-view.html?versionId=${escapeHtml(String(version.id))}">View / Print</a>
                                        <a href="/modulebook-history.html?id=${escapeHtml(String(modulebookId))}&modulebookVersionId=${escapeHtml(String(version.id))}">Details</a>
                                        ${modulebookVersionActionHtml(version)}
                                    </td>
                                </tr>
                            `).join("")}
                        </tbody>
                    </table>
                </section>
            `;
        }

        function renderHistoryRow(row) {
            if (row.type === "modulebookVersion") {
                return renderModulebookVersionRow(row.value);
            }

            return renderChangeSetRow(row.value);
        }

        function renderChangeSetRow(changeSet) {
            const changes = changesByChangeSetId.get(Number(changeSet.id)) || [];
            return `
                <tr class="${changeSet.discardedAt ? "discarded-change-set-row" : ""}">
                    <td class="version-cell">${escapeHtml(versionForChangeSet(changeSet))}</td>
                    <td>${escapeHtml(formatDate(changeSet.createdAt))}</td>
                    <td>${escapeHtml(String(changeSet.id))}</td>
                    <td>${escapeHtml(changeSetSourceLabel(changeSet))}</td>
                    <td>${escapeHtml(changeSet.reason || "")}</td>
                    <td>${escapeHtml(changeSetModuleSummary(changeSet, changes))}</td>
                    <td>${escapeHtml(changeSetChangedFieldsSummary(changeSet, changes))}</td>
                    <td class="row-actions">
                        <a href="/modulebook-history.html?id=${escapeHtml(String(modulebookId))}&changeSetId=${escapeHtml(String(changeSet.id))}">Details</a>
                        ${restoreActionHtml(changeSet)}
                    </td>
                </tr>
            `;
        }

        function renderModulebookVersionRow(version) {
            return `
                <tr class="modulebook-version-row">
                    <td class="version-cell">
                        ${escapeHtml(versionForModulebookVersion(version))}
                        ${renderModulebookVersionMeta(version)}
                    </td>
                    <td>${escapeHtml(formatDate(version.createdAt))}</td>
                    <td>Version ${escapeHtml(String(version.id))}</td>
                    <td>MODULEBOOK_VERSION</td>
                    <td>${escapeHtml(version.versionMessage || "")}</td>
                    <td>${escapeHtml(String(modulebookVersionActiveModuleCount(version)))}</td>
                    <td>--</td>
                    <td class="row-actions">
                        <a href="/modulebook-view.html?versionId=${escapeHtml(String(version.id))}">View / Print</a>
                        <a href="/modulebook-history.html?id=${escapeHtml(String(modulebookId))}&modulebookVersionId=${escapeHtml(String(version.id))}">Details</a>
                    </td>
                </tr>
            `;
        }

        function renderModulebookVersionMeta(version) {
            const releaseDate = formatDateOnly(version.modulebookReleaseDate);
            const regulationsDate = formatDateOnly(version.studyExaminationRegulationsDate);
            const rows = [];

            if (releaseDate) {
                rows.push(`Release: ${releaseDate}`);
            }
            if (regulationsDate) {
                rows.push(`Regulations: ${regulationsDate}`);
            }
            if (rows.length === 0) {
                return "";
            }

            return `
                <div class="version-meta">
                    ${rows.map(row => `<div>${escapeHtml(row)}</div>`).join("")}
                </div>
            `;
        }

        function renderModulebookVersionDetail(container) {
            const version = modulebookVersions.find(item => String(item.id) === String(selectedModulebookVersionId));
            if (!version) {
                container.textContent = "Modulebook version not found.";
                return;
            }

            const snapshot = parseSnapshot(version);
            const backUrl = `/modulebook-history.html?id=${encodeURIComponent(modulebookId)}`;

            container.innerHTML = `
                <div class="form-actions">
                    <a href="${backUrl}">Back to program history</a>
                    <a href="/modulebook-view.html?versionId=${escapeHtml(String(version.id))}">View / Print modulebook</a>
                </div>
                <h3>Modulebook version ${escapeHtml(String(version.id))}</h3>
                <p class="muted">
                    Version ${escapeHtml(versionForModulebookVersion(version))}
                    ${escapeHtml(formatDate(version.createdAt))}
                    ${version.versionMessage ? `- ${escapeHtml(version.versionMessage)}` : ""}
                </p>
                <p class="muted">
                    ${version.modulebookReleaseDate ? `Modulebook release date: ${escapeHtml(formatDateOnly(version.modulebookReleaseDate))}` : ""}
                    ${version.studyExaminationRegulationsDate ? ` Study and Examination Regulations: ${escapeHtml(formatDateOnly(version.studyExaminationRegulationsDate))}` : ""}
                </p>
                <table>
                    <thead>
                        <tr>
                            <th>Module number</th>
                            <th>Name</th>
                            <th>Credits</th>
                            <th>Status</th>
	                            <th>Module comments</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${(snapshot?.modules || []).map(module => `
                            <tr>
                                <td>${escapeHtml(module.moduleNumber || "")}</td>
                                <td>${escapeHtml(module.name || "")}</td>
                                <td>${escapeHtml(String(module.credits ?? ""))}</td>
                                <td>${escapeHtml(module.moduleStatus || "")}</td>
                                <td>${escapeHtml(module.moduleComments || "")}</td>
                            </tr>
                        `).join("")}
                    </tbody>
                </table>
            `;
        }

        function renderChangeSetDetail(container) {
            const changeSet = changeSets.find(item => String(item.id) === String(selectedChangeSetId));
            if (!changeSet) {
                container.textContent = "Change set not found.";
                return;
            }

            const changes = changesByChangeSetId.get(Number(changeSet.id)) || [];
            const backUrl = `/modulebook-history.html?id=${encodeURIComponent(modulebookId)}`;

            container.innerHTML = `
                <div class="form-actions">
                    <a href="${backUrl}">Back to program history</a>
                    ${restoreActionHtml(changeSet)}
                </div>
                <h3>Change set ${escapeHtml(String(changeSet.id))}</h3>
                <p class="muted">
                    Version ${escapeHtml(versionForChangeSet(changeSet))}
                    ${escapeHtml(changeSetSourceLabel(changeSet))}
                    ${escapeHtml(formatDate(changeSet.createdAt))}
                    ${changeSet.reason ? `- ${escapeHtml(changeSet.reason)}` : ""}
                </p>
                ${changes.length === 0 ? `
                    <p>${escapeHtml(emptyChangeSetMessage(changeSet))}</p>
                ` : `
                    <table>
                        <thead>
                            <tr>
                                <th>Created</th>
                                <th>Change set</th>
                                <th>Source</th>
                                <th>Reason</th>
                                <th>Module</th>
                                <th>Field</th>
                                <th>Old value</th>
                                <th>New value</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${changes.map(change => {
                                const module = moduleById(change.moduleId);
                                return `
                                    <tr>
                                        <td>${escapeHtml(formatDate(changeSet.createdAt))}</td>
                                        <td>${escapeHtml(String(changeSet.id))}</td>
                                        <td>${escapeHtml(changeSetSourceLabel(changeSet))}</td>
                                        <td>${escapeHtml(changeSet.reason || "")}</td>
                                        <td>${escapeHtml(changeModuleLabel(change, module))}</td>
                                        <td>${escapeHtml(readablePath(change.fieldPath))}</td>
                                        <td class="diff-old">${escapeHtml(formatFieldChangeValue(change.fieldPath, change.oldValue))}</td>
                                        <td class="diff-new">${escapeHtml(formatFieldChangeValue(change.fieldPath, change.newValue))}</td>
                                        <td class="row-actions">
                                            <a href="${fieldChangeDetailUrl(changeSet.id, change.id)}">Change details</a>
                                            ${change.moduleId ? `
                                                <a href="/module-versions.html?id=${escapeHtml(String(change.moduleId))}">Module log</a>
                                                <a href="/module-edit.html?id=${escapeHtml(String(change.moduleId))}">Edit</a>
                                            ` : ""}
                                        </td>
                                    </tr>
                                `;
                            }).join("")}
                        </tbody>
                    </table>
                `}
            `;
        }

        async function renderFieldChangeDetail(container) {
            const changeSet = changeSets.find(item => String(item.id) === String(selectedChangeSetId));
            if (!changeSet) {
                container.textContent = "Change set not found.";
                return;
            }

            const changes = changesByChangeSetId.get(Number(changeSet.id)) || [];
            const change = changes.find(item => String(item.id) === String(selectedChangeId));
            if (!change) {
                container.textContent = "Change not found.";
                return;
            }

            const module = moduleById(change.moduleId);
            const changeSetUrl = `/modulebook-history.html?id=${encodeURIComponent(modulebookId)}&changeSetId=${encodeURIComponent(changeSet.id)}`;
            const programHistoryUrl = `/modulebook-history.html?id=${encodeURIComponent(modulebookId)}`;
            const moduleLogUrl = sourceModuleLogId
                ? `/module-versions.html?id=${encodeURIComponent(sourceModuleLogId)}`
                : "";
            const versionControlUrl = `/modulebook-version-compare.html?id=${encodeURIComponent(modulebookId)}`;
            const lifecycleSnapshot = await lifecycleSnapshotForDetail(change);

            container.innerHTML = `
                <div class="form-actions">
                    ${sourceModuleLogId ? `
                        <a href="${moduleLogUrl}">Back to Module Change Log</a>
                    ` : fromVersionControl ? `
                        <a href="${versionControlUrl}">Back to version control</a>
                    ` : `
                        <a href="${changeSetUrl}">Back to change set</a>
                        <a href="${programHistoryUrl}">Back to program history</a>
                    `}
                </div>
                <h3>Change details ${escapeHtml(String(change.id))}</h3>
                <dl class="detail-list">
                    <dt>Source</dt>
                    <dd>${escapeHtml(changeSetSourceLabel(changeSet))}</dd>
                    <dt>Reason</dt>
                    <dd>${escapeHtml(changeSet.reason || "")}</dd>
                    <dt>Changed at</dt>
                    <dd>${escapeHtml(formatDate(change.createdAt || changeSet.createdAt))}</dd>
                    ${lifecycleSnapshot ? renderModuleSnapshotMetadataRows(lifecycleSnapshot) : ""}
                </dl>
                ${lifecycleSnapshot ? renderModuleSnapshotDetail(lifecycleSnapshot, change.fieldPath) : renderFieldValueDetail(change)}
            `;
        }

        function renderFieldValueDetail(change) {
            return `
                <table class="change-detail-value-table">
                    <thead>
                        <tr>
                            <th>Old value</th>
                            <th>New value</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td class="diff-old">${escapeHtml(formatJsonValue(change.oldValue))}</td>
                            <td class="diff-new">${escapeHtml(formatJsonValue(change.newValue))}</td>
                        </tr>
                    </tbody>
                </table>
            `;
        }

        function renderModuleSnapshotDetail(snapshot, fieldPath) {
            const module = snapshot.module || snapshot;
            const workload = snapshot.workload || null;
            const teachingFormIds = snapshot.teachingFormIds || [];
            const heading = fieldPath === "module.created" ? "Created module snapshot" : "Deleted module snapshot";

            return `
                <h4>${escapeHtml(heading)}</h4>
                <div class="module-view-details">
                    <table class="modulebook-module-table">
                        <thead>
                            <tr>
                                <th>Datenfeld</th>
                                <th>Erklärung</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${moduleSnapshotRows(module, workload, teachingFormIds)}
                        </tbody>
                    </table>
                </div>
            `;
        }

        function renderModuleSnapshotMetadataRows(snapshot) {
            const module = snapshot.module || snapshot;
            const rows = [
                ["Module created at", formatDate(module.createdAt)],
                ["Module updated at", formatDate(module.updatedAt)]
            ];

            return rows.map(([label, value]) => `
                <dt>${escapeHtml(label)}</dt>
                <dd>${escapeHtml(String(value ?? ""))}</dd>
            `).join("");
        }

        function moduleSnapshotRows(module, workload, teachingFormIds) {
            const rows = [
                ["Modulnummer", module.moduleNumber],
                ["Titel", module.name],
                ["Koordinator/in", module.coordinator],
                ["Leistungspunkte", creditsText(module.credits)],
                ["Workload", workloadText(workload)],
                ["Verwendbarkeit", module.applicability],
                ["Lerngebiet", module.learningArea],
                ["Lernziele / Kompetenzen", module.learningObjectives],
                ["Voraussetzungen", module.prerequisites],
                ["Niveaustufe", module.level],
                ["Lernform", teachingFormLabelsForIds(teachingFormIds)],
                ["Status", module.moduleStatus],
                ["Häufigkeit des Angebotes", module.frequency],
                ["Prüfungsform", module.examinationForm],
                ["Inhalte", module.contents],
                ["Literatur", module.literature],
                ["Weitere Hinweise", module.additionalNotes],
                ["Modulgewicht", module.moduleWeight]
            ];

            return rows
                .map(([label, value]) => `
                    <tr>
                        <td>${escapeHtml(label)}</td>
                        <td>${formatModuleSnapshotFieldHtml(label, value)}</td>
                    </tr>
                `).join("");
        }

        function moduleSummary(changes) {
            const labels = Array.from(new Set(
                changes.map(change => changeModuleLabel(change, moduleById(change.moduleId)))
            ));

            return labels.length > 0 ? labels.join(", ") : "No field changes";
        }

        function changeSetModuleSummary(changeSet, changes) {
            if (changeSet.sourceType === "RESTORE_BEFORE") {
                return "Study program reset";
            }

            if (changeSet.sourceType === "PDF_IMPORT") {
                return "--";
            }

            if (changeSet.sourceType === "DELETE" && changes.length === 0) {
                return changeSet.reason || "Deleted module";
            }

            return moduleSummary(changes);
        }

        function changeSetChangedFieldsSummary(changeSet, changes) {
            if (changeSet.sourceType === "RESTORE_BEFORE" && changes.length === 0) {
                return "Reset only";
            }

            if (changeSet.sourceType === "PDF_IMPORT") {
                return "--";
            }

            return String(changes.length);
        }

        function emptyChangeSetMessage(changeSet) {
            if (changeSet.sourceType === "RESTORE_BEFORE") {
                return changeSet.reason || "Study program was restored to an earlier point.";
            }

            if (changeSet.sourceType === "DELETE") {
                return changeSet.reason || "Deleted module";
            }

            return "No field changes were saved for this change set.";
        }

        function changeSetSourceLabel(changeSet) {
            const sourceType = changeSet.sourceType || "";
            if (!changeSet.discardedAt) {
                return sourceType;
            }

            return `${sourceType} (discarded by ${changeSet.discardedByChangeSetId || "restore"})`;
        }

        function restoreActionHtml(changeSet) {
            if (!canRestoreBefore(changeSet)) {
                return "";
            }

            return `
                <button type="button" data-restore-before="${escapeHtml(String(changeSet.id))}">
                    Restore before
                </button>
            `;
        }

        function resetToInitialImportActionHtml(changeSet) {
            if (!canResetToInitialImport(changeSet)) {
                return "";
            }

            return `
                <button type="button" data-reset-to-initial-import="${escapeHtml(String(changeSet.id))}">
                    Back to initial import
                </button>
            `;
        }

        function modulebookVersionActionHtml(version) {
            return `
                <button type="button" data-restore-modulebook-version="${escapeHtml(String(version.id))}">
                    Back to this Version
                </button>
                ${modulebookVersionDeleteActionHtml(version)}
            `;
        }

        function modulebookVersionDeleteActionHtml(version) {
            if (version.sourceType === "INITIAL_IMPORT") {
                return "";
            }

            return `
                <button type="button" data-delete-modulebook-version="${escapeHtml(String(version.id))}">
                    Delete this version
                </button>
            `;
        }

        function canRestoreBefore(changeSet) {
            return !changeSet.discardedAt
                && changeSet.sourceType !== "DELETE"
                && changeSet.sourceType !== "PDF_IMPORT"
                && changeSet.sourceType !== "RESTORE_BEFORE"
                && changeSet.sourceType !== "RESTORE_TAG";
        }

        function canResetToInitialImport(changeSet) {
            return changeSet.sourceType === "PDF_IMPORT"
                && String(changeSet.id) === String(initialPdfImportChangeSetId());
        }

        function initialPdfImportChangeSetId() {
            const initialImport = changeSets
                .filter(changeSet => changeSet.sourceType === "PDF_IMPORT")
                .slice()
                .sort((left, right) =>
                    eventTime(left) - eventTime(right) || Number(left.id) - Number(right.id)
                )[0];

            return initialImport?.id ?? null;
        }

        function historyRowsDescending() {
            return historyEvents()
                .slice()
                .sort((left, right) => compareHistoryEvents(right, left));
        }

        function historyEvents() {
            return [
                ...changeSets.map(changeSet => ({
                    type: "changeSet",
                    createdAt: changeSet.createdAt,
                    id: Number(changeSet.id),
                    value: changeSet
                })),
                ...modulebookVersions.map(version => ({
                    type: "modulebookVersion",
                    createdAt: version.createdAt,
                    id: Number(version.id),
                    value: version
                }))
            ];
        }

        function calculateHistoryVersions() {
            versionsByChangeSetId = new Map();
            versionsByModulebookVersionId = new Map();

            const versionBeforeChangeSetId = new Map();
            const events = historyEvents().sort(compareHistoryEvents);

            let major = 1;
            let minor = 0;
            let hasVersion = false;

            for (const event of events) {
                if (event.type === "modulebookVersion") {
                    if (isInitialImportVersion(event.value)) {
                        hasVersion = true;
                    } else if (hasVersion) {
                        major += 1;
                        minor = 0;
                    } else {
                        hasVersion = true;
                    }
                    versionsByModulebookVersionId.set(Number(event.value.id), formatVersion(major, minor));
                    continue;
                }

                const changeSet = event.value;
                const changeSetId = Number(changeSet.id);
                versionBeforeChangeSetId.set(changeSetId, hasVersion ? formatVersion(major, minor) : formatVersion(1, 0));

                if (changeSet.sourceType === "RESTORE_BEFORE") {
                    const targetChangeSetId = restoreTargetChangeSetId(changeSet);
                    const restoredVersion = versionBeforeChangeSetId.get(targetChangeSetId)
                        || (hasVersion ? formatVersion(major, minor) : formatVersion(1, 0));
                    const parsedVersion = parseVersion(restoredVersion);
                    major = parsedVersion.major;
                    minor = parsedVersion.minor;
                    hasVersion = true;
                    versionsByChangeSetId.set(changeSetId, restoredVersion);
                    continue;
                }

                if (changeSet.sourceType === "RESTORE_TAG") {
                    const targetVersionId = restoreTargetModulebookVersionId(changeSet);
                    const restoredVersion = versionsByModulebookVersionId.get(targetVersionId)
                        || (hasVersion ? formatVersion(major, minor) : formatVersion(1, 0));
                    const parsedVersion = parseVersion(restoredVersion);
                    major = parsedVersion.major;
                    minor = parsedVersion.minor;
                    hasVersion = true;
                    versionsByChangeSetId.set(changeSetId, restoredVersion);
                    continue;
                }

                if (!hasVersion) {
                    hasVersion = true;
                } else {
                    minor += 1;
                }

                versionsByChangeSetId.set(changeSetId, formatVersion(major, minor));
            }
        }

        function compareHistoryEvents(left, right) {
            const timeComparison = eventTime(left) - eventTime(right);
            if (timeComparison !== 0) {
                return timeComparison;
            }

            if (left.type !== right.type) {
                return left.type === "changeSet" ? -1 : 1;
            }

            return left.id - right.id;
        }

        function eventTime(event) {
            const timestamp = new Date(event.createdAt).getTime();
            return Number.isFinite(timestamp) ? timestamp : 0;
        }

        function versionForChangeSet(changeSet) {
            return versionsByChangeSetId.get(Number(changeSet.id)) || "";
        }

        function versionForModulebookVersion(version) {
            return versionsByModulebookVersionId.get(Number(version.id)) || "";
        }

        function isInitialImportVersion(version) {
            return version.sourceType === "INITIAL_IMPORT";
        }

        function modulebookVersionActiveModuleCount(version) {
            const snapshot = parseSnapshot(version);
            return snapshot?.modules?.length ?? "";
        }

        function restoreTargetChangeSetId(changeSet) {
            const match = String(changeSet.reason || "").match(/change set\s+(\d+)/i);
            return match ? Number(match[1]) : null;
        }

        function restoreTargetModulebookVersionId(changeSet) {
            const match = String(changeSet.reason || "").match(/modulebook (?:tag|version)\s+(\d+)/i);
            return match ? Number(match[1]) : null;
        }

        function formatVersion(major, minor) {
            return `${major}.${minor}`;
        }

        function parseVersion(version) {
            const [major, minor] = String(version || "1.0").split(".").map(Number);
            return {
                major: Number.isFinite(major) ? major : 1,
                minor: Number.isFinite(minor) ? minor : 0
            };
        }

        function moduleById(moduleId) {
            return modules.find(module => Number(module.id) === Number(moduleId));
        }

        function moduleLabel(module, moduleId) {
            if (!module) {
                return moduleId ? `Module ${moduleId}` : "Deleted module";
            }

            return `${module.moduleNumber || module.id} ${module.name || ""}`.trim();
        }

        function fieldChangeDetailUrl(changeSetId, changeId) {
            return `/modulebook-history.html?id=${encodeURIComponent(modulebookId)}&changeSetId=${encodeURIComponent(changeSetId)}&changeId=${encodeURIComponent(changeId)}`;
        }

        function changeModuleLabel(change, module) {
            const snapshotLabel = lifecycleSnapshotLabel(change);
            if (snapshotLabel) {
                return snapshotLabel;
            }

            return moduleLabel(module, change.moduleId);
        }

        function formatJsonValue(value) {
            if (value === null || value === undefined) {
                return "";
            }

            try {
                const parsed = JSON.parse(value);
                if (parsed === null) {
                    return "";
                }
                if (typeof parsed === "string" || typeof parsed === "number" || typeof parsed === "boolean") {
                    return String(parsed);
                }
                return JSON.stringify(parsed, null, 2);
            } catch (error) {
                return String(value);
            }
        }

        function formatFieldChangeValue(fieldPath, value) {
            if (fieldPath === "teachingFormIds") {
                return teachingFormLabelsForJsonValue(value);
            }
            if (fieldPath === "module.created") {
                if (isJsonNull(value)) {
                    return "--";
                }
                return `created module "${lifecycleSnapshotLabelFromValue(value)}"`;
            }
            if (fieldPath === "module.deleted") {
                return lifecycleSnapshotLabelFromValue(value);
            }

            return formatJsonValue(value);
        }

        function lifecycleSnapshotLabel(change) {
            if (change.fieldPath !== "module.created" && change.fieldPath !== "module.deleted") {
                return "";
            }

            return lifecycleSnapshotLabelFromValue(change.newValue)
                || lifecycleSnapshotLabelFromValue(change.oldValue);
        }

        function lifecycleSnapshotLabelFromValue(value) {
            const parsed = parseJsonValue(value);
            if (!parsed || typeof parsed !== "object") {
                return "";
            }

            const module = parsed.module || parsed;
            return moduleSnapshotLabel(module);
        }

        function lifecycleSnapshotForChange(change) {
            if (change.fieldPath === "module.created") {
                return parseLifecycleSnapshot(change.newValue);
            }
            if (change.fieldPath === "module.deleted") {
                return parseLifecycleSnapshot(change.oldValue);
            }

            return null;
        }

        async function lifecycleSnapshotForDetail(change) {
            if (change.fieldPath === "module.created") {
                return reconstructCreatedModuleSnapshot(change);
            }

            return lifecycleSnapshotForChange(change);
        }

        async function reconstructCreatedModuleSnapshot(change) {
            const createdSnapshot = parseLifecycleSnapshot(change.newValue);
            const moduleId = change.moduleId || createdSnapshot?.id;
            if (!moduleId) {
                return createdSnapshot;
            }

            try {
                const [currentModule, moduleChanges] = await Promise.all([
                    loadModule(moduleId),
                    loadModuleFieldChanges(moduleId)
                ]);
                const snapshot = moduleResponseSnapshot(currentModule);
                const laterChanges = moduleChanges
                    .filter(item => isChangeAfter(item, change))
                    .sort(compareFieldChangesDescending);

                laterChanges.forEach(item => rollBackFieldChange(snapshot, item));
                snapshot.module.updatedAt = snapshot.module.createdAt;
                return snapshot;
            } catch (error) {
                return await reconstructCreatedModuleSnapshotFromDeleteSnapshot(change, moduleId)
                    || createdSnapshot;
            }
        }

        async function reconstructCreatedModuleSnapshotFromDeleteSnapshot(createChange, moduleId) {
            await ensureAllFieldChangesLoaded();
            const deleteChange = findDeletedModuleChange(moduleId, createChange);
            if (!deleteChange) {
                return null;
            }

            const snapshot = parseLifecycleSnapshot(deleteChange.oldValue);
            if (!snapshot) {
                return null;
            }

            allLoadedFieldChanges()
                .filter(item => belongsToModule(item, moduleId))
                .filter(item => isChangeAfter(item, createChange))
                .filter(item => isChangeBefore(item, deleteChange))
                .sort(compareFieldChangesDescending)
                .forEach(item => rollBackFieldChange(snapshot, item));

            if (snapshot.module) {
                snapshot.module.updatedAt = snapshot.module.createdAt;
            }
            return snapshot;
        }

        async function ensureAllFieldChangesLoaded() {
            const missingChangeSets = changeSets.filter(changeSet =>
                !changesByChangeSetId.has(Number(changeSet.id))
            );
            if (missingChangeSets.length === 0) {
                return;
            }

            const entries = await Promise.all(missingChangeSets.map(async changeSet => [
                Number(changeSet.id),
                await loadChangeSetFieldChanges(changeSet.id)
            ]));
            entries.forEach(([changeSetId, changes]) => {
                changesByChangeSetId.set(changeSetId, changes);
            });
        }

        function findDeletedModuleChange(moduleId, createChange) {
            return allLoadedFieldChanges()
                .filter(change => change.fieldPath === "module.deleted")
                .filter(change => isChangeAfter(change, createChange))
                .find(change => {
                    const snapshot = parseLifecycleSnapshot(change.oldValue);
                    const module = snapshot?.module || snapshot;
                    return String(module?.id) === String(moduleId);
                }) || null;
        }

        function allLoadedFieldChanges() {
            return Array.from(changesByChangeSetId.values()).flat();
        }

        function belongsToModule(change, moduleId) {
            return String(change.moduleId) === String(moduleId);
        }

        function moduleResponseSnapshot(module) {
            return {
                module: {
                    id: module.id,
                    modulebookId: module.modulebookId,
                    moduleNumber: module.moduleNumber,
                    name: module.name,
                    credits: module.credits,
                    description: module.description,
                    moduleType: module.moduleType,
                    titleDe: module.titleDe,
                    titleEn: module.titleEn,
                    coordinator: module.coordinator,
                    applicability: module.applicability,
                    learningArea: module.learningArea,
                    learningObjectives: module.learningObjectives,
                    prerequisites: module.prerequisites,
                    level: module.level,
                    moduleStatus: module.moduleStatus,
                    moduleComments: module.moduleComments,
                    frequency: module.frequency,
                    examinationForm: module.examinationForm,
                    contents: module.contents,
                    literature: module.literature,
                    additionalNotes: module.additionalNotes,
                    moduleWeight: module.moduleWeight,
                    createdAt: module.createdAt,
                    updatedAt: module.updatedAt
                },
                workload: module.workload || null,
                teachingFormIds: (module.teachingForms || []).map(teachingForm => teachingForm.id)
            };
        }

        function isChangeAfter(candidate, baseChange) {
            const candidateTime = new Date(candidate.createdAt).getTime();
            const baseTime = new Date(baseChange.createdAt).getTime();
            if (Number.isFinite(candidateTime) && Number.isFinite(baseTime) && candidateTime !== baseTime) {
                return candidateTime > baseTime;
            }

            return Number(candidate.id) > Number(baseChange.id);
        }

        function isChangeBefore(candidate, baseChange) {
            const candidateTime = new Date(candidate.createdAt).getTime();
            const baseTime = new Date(baseChange.createdAt).getTime();
            if (Number.isFinite(candidateTime) && Number.isFinite(baseTime) && candidateTime !== baseTime) {
                return candidateTime < baseTime;
            }

            return Number(candidate.id) < Number(baseChange.id);
        }

        function compareFieldChangesDescending(left, right) {
            const timeComparison = new Date(right.createdAt).getTime() - new Date(left.createdAt).getTime();
            if (timeComparison !== 0 && Number.isFinite(timeComparison)) {
                return timeComparison;
            }

            return Number(right.id) - Number(left.id);
        }

        function rollBackFieldChange(snapshot, change) {
            if (change.fieldPath === "workload") {
                snapshot.workload = parseJsonValue(change.oldValue);
                return;
            }
            if (change.fieldPath === "teachingFormIds") {
                const ids = parseJsonValue(change.oldValue);
                snapshot.teachingFormIds = Array.isArray(ids) ? ids : [];
                return;
            }
            if (!change.fieldPath || !change.fieldPath.startsWith("module.")) {
                return;
            }
            if (change.fieldPath === "module.created" || change.fieldPath === "module.deleted") {
                return;
            }

            const fieldName = change.fieldPath.replace(/^module\./, "");
            snapshot.module[fieldName] = parseJsonValue(change.oldValue);
        }

        function parseLifecycleSnapshot(value) {
            const parsed = parseJsonValue(value);
            if (!parsed || typeof parsed !== "object") {
                return null;
            }

            return parsed;
        }

        function moduleSnapshotLabel(module) {
            if (!module || typeof module !== "object") {
                return "Module";
            }

            const moduleNumber = module.moduleNumber || "";
            const title = module.name || module.titleDe || module.titleEn || "";
            const label = `${moduleNumber} ${title}`.trim();
            return label || (module.id ? `Module ${module.id}` : "Module");
        }

        function creditsText(credits) {
            return credits === null || credits === undefined || credits === "" ? "" : `${credits} Cr`;
        }

        function workloadText(workload) {
            if (!workload) {
                return "";
            }

            const components = workload.components && workload.components.length > 0
                ? workload.components
                    .map(component => {
                        const teachingForm = teachingFormLabelForId(component.teachingFormId);
                        return `${formatNumber(component.swsAmount)} SWS ${teachingForm}`.trim();
                    })
                    .filter(Boolean)
                    .join(" + ")
                : "";

            if (workload.presenceHours !== null && workload.presenceHours !== undefined) {
                const componentPart = components ? ` (${components})` : "";
                const selfStudyPart = workload.selfStudyHours !== null && workload.selfStudyHours !== undefined
                    ? `, ${formatNumber(workload.selfStudyHours)} Stunden Selbststudium`
                    : "";
                return `${formatNumber(workload.presenceHours)} Stunden Präsenz${componentPart}${selfStudyPart}`;
            }

            if (workload.selfStudyHours !== null && workload.selfStudyHours !== undefined) {
                return `${formatNumber(workload.selfStudyHours)} Stunden Selbststudium`;
            }

            return workload.rawText || components;
        }

        function formatNumber(value) {
            if (value === null || value === undefined || value === "") {
                return "";
            }

            const number = Number(value);
            return Number.isInteger(number) ? String(number) : String(value);
        }

        function formatModuleSnapshotFieldHtml(label, value) {
            const text = String(value ?? "");
            if (!["Lernziele / Kompetenzen", "Prüfungsform", "Inhalte", "Literatur"].includes(label)) {
                return escapeHtml(text);
            }

            return escapeHtml(text);
        }

        function teachingFormLabelsForJsonValue(value) {
            const parsed = parseJsonValue(value);
            const ids = Array.isArray(parsed) ? parsed : [];
            return teachingFormLabelsForIds(ids);
        }

        function teachingFormLabelsForIds(ids) {
            return normalizedTeachingFormIds(ids)
                .map(id => {
                    return teachingFormLabelForId(id);
                })
                .join(", ");
        }

        function teachingFormLabelForId(id) {
            const teachingForm = teachingForms.find(option => Number(option.id) === Number(id));
            return teachingForm ? teachingFormLabel(teachingForm) : `Teaching form ${id}`;
        }

        function parseJsonValue(value) {
            if (value === null || value === undefined) {
                return null;
            }

            try {
                return JSON.parse(value);
            } catch (error) {
                return value;
            }
        }

        function isJsonNull(value) {
            return value === null || value === undefined || value === "null";
        }

        function normalizedTeachingFormIds(ids) {
            return (ids || [])
                .map(Number)
                .filter(Number.isFinite)
                .sort((left, right) => left - right);
        }

        function teachingFormLabel(teachingForm) {
            const label = teachingForm.labelDe || teachingForm.labelEn || "";
            return label ? `${teachingForm.code} - ${label}` : teachingForm.code;
        }

        function readablePath(path) {
            if (path === "module.created") {
                return "created module";
            }
            if (path === "module.deleted") {
                return "deleted module";
            }

            return String(path || "")
                .replace(/^module\./, "")
                .replaceAll(".", " / ");
        }

        function formatDate(value) {
            if (!value) {
                return "";
            }

            return new Date(value).toLocaleString();
        }

        function formatDateOnly(value) {
            if (!value) {
                return "";
            }

            return new Date(`${value}T00:00:00`).toLocaleDateString("de-DE");
        }

        function modulebookLabel(program) {
            const suffix = degreeTypeShortLabel(program?.degreeType);
            const name = program?.studyProgramName || program?.name || "";
            return suffix ? `${name} (${suffix})` : name;
        }

        function degreeTypeShortLabel(degreeType) {
            if (degreeType === "BACHELOR") {
                return "B.Sc.";
            }
            if (degreeType === "MASTER") {
                return "M.Sc.";
            }
            return "";
        }

        function parseSnapshot(version) {
            try {
                return JSON.parse(version.snapshotJson);
            } catch (error) {
                return null;
            }
        }

        function setStatus(message) {
            document.getElementById("status").textContent = message;
        }

        document.addEventListener("click", async event => {
            const button = event.target.closest("[data-restore-before]");
            if (button) {
                const changeSetId = button.getAttribute("data-restore-before");
                await handleRestoreBefore(changeSetId);
                return;
            }

            const resetButton = event.target.closest("[data-reset-to-initial-import]");
            if (resetButton) {
                const changeSetId = resetButton.getAttribute("data-reset-to-initial-import");
                await handleResetToInitialImport(changeSetId);
                return;
            }

            const restoreVersionButton = event.target.closest("[data-restore-modulebook-version]");
            if (restoreVersionButton) {
                const versionId = restoreVersionButton.getAttribute("data-restore-modulebook-version");
                await handleRestoreModulebookVersion(versionId);
                return;
            }

            const deleteVersionButton = event.target.closest("[data-delete-modulebook-version]");
            if (deleteVersionButton) {
                const versionId = deleteVersionButton.getAttribute("data-delete-modulebook-version");
                await handleDeleteModulebookVersion(versionId);
            }
        });

        async function handleRestoreBefore(changeSetId) {
            const confirmed = window.confirm(
                "This will reset the study program to before this change set. Later changes will be discarded and cannot be restored. Continue?"
            );
            if (!confirmed) {
                return;
            }

            try {
                setStatus(`Restoring to before change set ${changeSetId}...`);
                await restoreBeforeChangeSet(changeSetId, false);
                window.location.href = `/modulebook-history.html?id=${encodeURIComponent(modulebookId)}`;
            } catch (error) {
                const force = window.confirm(
                    `${error.message}\n\nContinue anyway? Created modules listed above will be deleted.`
                );
                if (!force) {
                    setStatus("Restore cancelled.");
                    return;
                }

                try {
                    setStatus(`Restoring to before change set ${changeSetId} with confirmation...`);
                    await restoreBeforeChangeSet(changeSetId, true);
                    window.location.href = `/modulebook-history.html?id=${encodeURIComponent(modulebookId)}`;
                } catch (forceError) {
                    setStatus("Restore failed: " + forceError.message);
                }
            }
        }

        async function handleResetToInitialImport(changeSetId) {
            const confirmed = window.confirm(
                "This will reset the study program to the initial PDF import and permanently delete all later change logs and modulebook versions. Continue?"
            );
            if (!confirmed) {
                return;
            }

            try {
                setStatus("Resetting to initial PDF import and cleaning history...");
                await resetToInitialImport(changeSetId);
                window.location.href = `/modulebook-history.html?id=${encodeURIComponent(modulebookId)}`;
            } catch (error) {
                setStatus("Reset to initial import failed: " + error.message);
            }
        }

        async function handleRestoreModulebookVersion(versionId) {
            const confirmed = window.confirm(
                "This will change the current study program back to this modulebook version. The version itself will stay saved. Continue?"
            );
            if (!confirmed) {
                return;
            }

            try {
                setStatus(`Restoring modulebook version ${versionId}...`);
                await restoreModulebookVersion(versionId);
                window.location.href = `/modulebook-history.html?id=${encodeURIComponent(modulebookId)}`;
            } catch (error) {
                setStatus("Back to this version failed: " + error.message);
            }
        }

        async function handleDeleteModulebookVersion(versionId) {
            const confirmed = window.confirm(
                "This will delete this saved modulebook version. The current study program will not change. Continue?"
            );
            if (!confirmed) {
                return;
            }

            try {
                setStatus(`Deleting modulebook version ${versionId}...`);
                await deleteModulebookVersion(versionId);
                window.location.href = `/modulebook-history.html?id=${encodeURIComponent(modulebookId)}`;
            } catch (error) {
                setStatus("Delete this version failed: " + error.message);
            }
        }

        init();
    </script>
</body>
