<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title id="documentTitle">View Modulebook</title>
    <link rel="stylesheet" href="/app.css?v=modulebook-view">
</head>
<body class="modulebook-view-body">
    <nav class="screen-only">
        <a href="/index.html">Modulebooks</a>
    </nav>

    <section class="screen-only">
        <div id="status" class="status">Loading modulebook...</div>
        <div class="form-actions">
            <a id="backLink" href="/index.html">Back to study program</a>
            <button id="versionButton" type="button" onclick="showVersionPanel()">Save current version</button>
            <button type="button" onclick="window.print()">Print</button>
        </div>

        <section id="versionPanel" class="commit-message-panel" hidden>
            <label>
                Version message
                <textarea id="versionMessage" rows="3" maxlength="500"></textarea>
            </label>
            <label>
                Modulebook release date
                <input id="versionModulebookReleaseDate" type="date">
            </label>
            <label>
                Study and Examination Regulations
                <input id="versionStudyExaminationRegulationsDate" type="date">
            </label>
            <div class="form-actions">
                <button type="button" onclick="saveModulebookVersion()">Save version</button>
                <button type="button" onclick="hideVersionPanel()">Cancel</button>
            </div>
        </section>
    </section>

    <aside id="floatingToc" class="modulebook-floating-toc screen-only" hidden></aside>

    <main id="modulebook" class="modulebook-document" hidden></main>

    <script src="/api.js?v=modulebook-versions"></script>
    <script>
        const params = new URLSearchParams(window.location.search);
        const modulebookId = params.get("modulebookId");
        const versionId = params.get("versionId") || params.get("tagId");
        let studyProgram = null;
        let activeModules = [];
        let currentVersion = null;

        const moduleRows = [
            ["Modulnummer", module => module.moduleNumber],
            ["Titel", module => module.title],
            ["Koordinator/in", module => module.coordinator],
            ["Leistungspunkte", module => creditsText(module.credits)],
            ["Workload", module => workloadText(module.workload)],
            ["Verwendbarkeit", module => module.applicability],
            ["Lerngebiet", module => module.learningArea],
            ["Lernziele / Kompetenzen", module => module.learningObjectives],
            ["Voraussetzungen", module => module.prerequisites],
            ["Niveaustufe", module => module.level],
            ["Lernform", module => teachingFormsText(module.teachingForms)],
            ["Status", module => module.moduleStatus],
            ["Häufigkeit des Angebotes", module => module.frequency],
            ["Prüfungsform", module => module.examinationForm],
            ["Inhalte", module => module.contents],
            ["Literatur", module => module.literature],
            ["Weitere Hinweise", module => module.additionalNotes],
            ["Modulgewicht", module => module.moduleWeight]
        ];

        async function init() {
            if (!modulebookId && !versionId) {
                setStatus("Missing modulebook id or version id in URL. Example: /modulebook-view.html?modulebookId=19");
                return;
            }

            try {
                if (versionId) {
                    await loadSavedModulebookVersion();
                } else {
                    await loadCurrentModulebook();
                }

                renderModulebook();
                setStatus(statusText());
            } catch (error) {
                setStatus("Could not load modulebook: " + error.message);
            }
        }

        async function loadCurrentModulebook() {
            document.getElementById("backLink").href =
                `/index.html?modulebookId=${encodeURIComponent(modulebookId)}`;

            const [modulebooks, modules] = await Promise.all([
                loadModulebooks(),
                loadModulesForModulebook(modulebookId)
            ]);

            studyProgram = modulebooks.find(program =>
                String(program.id) === String(modulebookId)
            );

            if (!studyProgram) {
                throw new Error(`Could not find study program ${modulebookId}.`);
            }

            activeModules = modules
                .filter(module => isActiveModule(module))
                .sort(compareModules);
        }

        async function loadSavedModulebookVersion() {
            currentVersion = await loadModulebookVersion(versionId);
            const snapshot = JSON.parse(currentVersion.snapshotJson);
            studyProgram = snapshot.modulebook || snapshot.studyProgram;
            activeModules = snapshot.modules || [];
            document.getElementById("versionButton").hidden = true;
            document.getElementById("backLink").href =
                `/modulebook-history.html?id=${encodeURIComponent(currentVersion.modulebookId)}`;
        }

        function renderModulebook() {
            const documentTitle = `Modulebook - ${modulebookLabel(studyProgram)}`.trim();
            document.getElementById("documentTitle").textContent = documentTitle;

            const container = document.getElementById("modulebook");
            container.innerHTML = `
                ${renderCover()}
                ${currentVersion ? renderVersionPage() : ""}
                ${renderTableOfContents()}
                ${activeModules.map(renderModulePage).join("")}
            `;
            container.hidden = false;
            renderFloatingTableOfContents();
        }

        function renderCover() {
            const programName = modulebookName(studyProgram) || "Study program";

            return `
                <article id="modulebook-cover" class="modulebook-page modulebook-cover">
                    <header class="modulebook-page-header">
                        <div>Study program ${escapeHtml(programName)}</div>
                        <div>Modulebook</div>
                    </header>

                    <div class="modulebook-cover-title">
                        <h1>Modulhandbuch</h1>
                        <p>für den</p>
                        <h2>${escapeHtml(programName)}</h2>
                        <p>an der Berliner Hochschule für Technik</p>
                    </div>

                    <div class="modulebook-cover-meta">
                        <p>Studiengang: ${escapeHtml(modulebookLabel(studyProgram))}</p>
                    </div>
                </article>
            `;
        }

        function renderVersionPage() {
            return `
                <article class="modulebook-page modulebook-version-page">
                    <header class="modulebook-page-header">
                        <div>${escapeHtml(modulebookName(studyProgram))}</div>
                        <div>Saved modulebook version</div>
                    </header>

                    <div class="modulebook-version-summary">
                        <h1>Modulebook version</h1>
                        <p><strong>Version message:</strong></p>
                        <p>${escapeHtml(currentVersion.versionMessage || "")}</p>
                        <p><strong>Created:</strong> ${escapeHtml(formatDate(currentVersion.createdAt))}</p>
                        ${currentVersion.modulebookReleaseDate ? `<p><strong>Modulebook release date:</strong> ${escapeHtml(formatDateOnly(currentVersion.modulebookReleaseDate))}</p>` : ""}
                        ${currentVersion.studyExaminationRegulationsDate ? `<p><strong>Study and Examination Regulations:</strong> ${escapeHtml(formatDateOnly(currentVersion.studyExaminationRegulationsDate))}</p>` : ""}
                    </div>
                </article>
            `;
        }

        function renderTableOfContents() {
            return `
                <article id="modulebook-toc" class="modulebook-page modulebook-toc-page">
                    <header class="modulebook-page-header">
                        <div>${escapeHtml(modulebookName(studyProgram))}</div>
                        <div>Anlage 3 | Seite ${tableOfContentsPageNumber()}</div>
                    </header>

                    <h1>Inhaltsverzeichnis</h1>
                    <table class="modulebook-toc-table">
                        <thead>
                            <tr>
                                <th>Modul</th>
                                <th>Titel</th>
                                <th>Seite</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${activeModules.map((module, index) => `
                                <tr>
                                    <td>${escapeHtml(module.moduleNumber || "")}</td>
                                    <td>
                                        <a href="#${moduleAnchorId(module, index)}">${escapeHtml(module.title || "Untitled module")}</a>
                                    </td>
                                    <td>${modulePageNumber(index)}</td>
                                </tr>
                            `).join("")}
                        </tbody>
                    </table>
                </article>
            `;
        }

        function renderFloatingTableOfContents() {
            const container = document.getElementById("floatingToc");

            container.innerHTML = `
                <div class="modulebook-floating-toc-shortcuts">
                    <a href="#modulebook-cover">Back to cover</a>
                    <a href="#modulebook-toc">Back to contents</a>
                </div>
            `;
            container.hidden = false;
        }

        function renderModulePage(module, index) {
            const pageNumber = modulePageNumber(index);

            return `
                <article id="${moduleAnchorId(module, index)}" class="modulebook-page modulebook-module-page">
                    <header class="modulebook-page-header">
                        <div>${escapeHtml(modulebookName(studyProgram))}</div>
                        <div>Anlage 3 | Seite ${pageNumber}</div>
                    </header>

                    <table class="modulebook-module-table">
                        <thead>
                            <tr>
                                <th>Datenfeld</th>
                                <th>Erklärung</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${moduleRows.map(([label, valueReader]) =>
                                renderModuleRow(label, valueReader(module))
                            ).join("")}
                        </tbody>
                    </table>
                </article>
            `;
        }

        function tableOfContentsPageNumber() {
            return currentVersion ? 3 : 2;
        }

        function modulePageNumber(index) {
            return tableOfContentsPageNumber() + index + 1;
        }

        function moduleAnchorId(module, index) {
            return `module-${module.id || index + 1}`;
        }

        function renderModuleRow(label, value) {
            const formattedValue = formatValue(value);

            if (!formattedValue) {
                return "";
            }

            return `
                <tr>
                    <td>${escapeHtml(label)}</td>
                    <td>${formatFieldHtml(label, formattedValue)}</td>
                </tr>
            `;
        }

        function formatFieldHtml(label, value) {
            const text = formatValue(value);
            if (!["Lernziele / Kompetenzen", "Prüfungsform", "Inhalte", "Literatur"].includes(label)) {
                return escapeHtml(text);
            }

            const bulletHtml = formatBulletListHtml(text);
            if (bulletHtml) {
                return bulletHtml;
            }

            return escapeHtml(formatReadableText(text));
        }

        function formatBulletListHtml(text) {
            const normalizedText = text
                .replace(/\r\n/g, "\n")
                .replace(/\r/g, "\n")
                .replace(/[ \t]+/g, " ")
                .trim();

            if (!normalizedText.includes(" - ")) {
                return "";
            }

            const parts = normalizedText
                .replace(/^-\s*/, "")
                .split(/\s+-\s+/)
                .map(part => part.trim())
                .filter(Boolean);

            if (parts.length < 2) {
                return "";
            }

            let html = '<ul class="readable-list">';
            let sectionOpen = false;

            parts.forEach((part, index) => {
                const startsNewSection = index === 0 || isTopLevelBullet(part);

                if (startsNewSection) {
                    if (sectionOpen) {
                        html += "</ul></li>";
                        sectionOpen = false;
                    }

                    if (part.endsWith(":")) {
                        html += `<li>${escapeHtml(part)}<ul>`;
                        sectionOpen = true;
                    } else {
                        html += `<li>${escapeHtml(part)}</li>`;
                    }
                    return;
                }

                html += `<li>${escapeHtml(part)}</li>`;
            });

            if (sectionOpen) {
                html += "</ul></li>";
            }

            return `${html}</ul>`;
        }

        function isTopLevelBullet(part) {
            return part.endsWith(":")
                || /^(Grundlagen|Kompositorische|Fächerübergreifende)\b/.test(part);
        }

        function formatReadableText(text) {
            if (!text.trim()) {
                return "";
            }

            return text
                .replace(/\r\n/g, "\n")
                .replace(/\r/g, "\n")
                .replace(/[ \t]+/g, " ")
                .replace(/\s*;\s*/g, ";\n")
                .replace(/([.!?])\s+(?=[A-ZÄÖÜ0-9])/g, "$1\n")
                .replace(/\s+(\d+[.)]\s+)/g, "\n$1")
                .replace(/\n{3,}/g, "\n\n")
                .trim();
        }

        function isActiveModule(module) {
            return String(module.moduleStatus || "").toUpperCase() === "ACTIVE";
        }

        function compareModules(left, right) {
            return String(left.moduleNumber || "").localeCompare(
                String(right.moduleNumber || ""),
                undefined,
                { numeric: true, sensitivity: "base" }
            );
        }

        function creditsText(credits) {
            return credits === null || credits === undefined ? "" : `${credits} Cr`;
        }

        function teachingFormsText(teachingForms) {
            if (!teachingForms || teachingForms.length === 0) {
                return "";
            }

            return teachingForms
                .map(teachingForm => {
                    const label = teachingForm.labelDe || teachingForm.labelEn || "";
                    return label || teachingForm.code || "";
                })
                .filter(Boolean)
                .join("\n");
        }

        function workloadText(workload) {
            if (!workload) {
                return "";
            }

            const components = (workload.components || [])
                .map(component => `${formatValue(component.swsAmount)} SWS ${component.teachingFormCode || ""}`.trim())
                .filter(Boolean)
                .join(" + ");

            const parts = [];

            if (workload.presenceHours !== null && workload.presenceHours !== undefined) {
                parts.push(`${workload.presenceHours} Stunden Präsenz${components ? ` (${components})` : ""}`);
            }

            if (workload.selfStudyHours !== null && workload.selfStudyHours !== undefined) {
                parts.push(`${workload.selfStudyHours} Stunden Selbststudium`);
            }

            if (parts.length > 0) {
                return parts.join(",\n");
            }

            return workload.rawText || "";
        }

        function showVersionPanel() {
            document.getElementById("versionPanel").hidden = false;
            document.getElementById("versionMessage").focus();
        }

        function hideVersionPanel() {
            document.getElementById("versionPanel").hidden = true;
            document.getElementById("versionMessage").value = "";
            document.getElementById("versionModulebookReleaseDate").value = "";
            document.getElementById("versionStudyExaminationRegulationsDate").value = "";
        }

        async function saveModulebookVersion() {
            const message = document.getElementById("versionMessage").value.trim();

            if (!message) {
                setStatus("Version message is required.");
                document.getElementById("versionMessage").focus();
                return;
            }

            setStatus("Saving modulebook version...");

            try {
                const version = await createModulebookVersion(modulebookId, {
                    versionMessage: message,
                    modulebookReleaseDate: document.getElementById("versionModulebookReleaseDate").value || null,
                    studyExaminationRegulationsDate:
                        document.getElementById("versionStudyExaminationRegulationsDate").value || null
                });
                window.location.href = `/modulebook-history.html?id=${encodeURIComponent(modulebookId)}&modulebookVersionId=${encodeURIComponent(version.id)}`;
            } catch (error) {
                setStatus("Could not save modulebook version: " + error.message);
            }
        }

        function statusText() {
            if (currentVersion) {
                return `Loaded modulebook version ${currentVersion.id} with ${activeModules.length} active modules.`;
            }

            return `Loaded ${activeModules.length} active modules.`;
        }

        function formatDate(value) {
            if (!value) {
                return "";
            }

            return new Date(value).toLocaleString();
        }

        function formatDateOnly(value) {
            if (!value) {
                return "";
            }

            return new Date(`${value}T00:00:00`).toLocaleDateString("de-DE");
        }

        function modulebookLabel(program) {
            const suffix = degreeTypeShortLabel(program?.degreeType);
            const name = modulebookName(program);
            return suffix ? `${name} (${suffix})` : name;
        }

        function modulebookName(program) {
            return program?.studyProgramName || program?.name || "";
        }

        function degreeTypeShortLabel(degreeType) {
            if (degreeType === "BACHELOR") {
                return "B.Sc.";
            }
            if (degreeType === "MASTER") {
                return "M.Sc.";
            }
            return "";
        }

        function formatValue(value) {
            if (value === null || value === undefined) {
                return "";
            }

            return String(value).trim();
        }

        function setStatus(message) {
            document.getElementById("status").textContent = message;
        }

        init();
    </script>
</body>
</html>
