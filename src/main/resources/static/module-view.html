<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title id="documentTitle">View Module</title>
    <link rel="stylesheet" href="/app.css?v=module-view">
</head>
<body>
    <nav>
        <a href="/index.html">Modulebooks</a>
    </nav>

    <h1 id="pageTitle">View Module</h1>

    <section>
        <div id="status" class="status">Loading module...</div>
        <div class="form-actions">
            <a id="editLink" href="/index.html">Edit module</a>
            <a id="versionsLink" href="/index.html">History</a>
        </div>
    </section>

    <section>
        <div id="moduleDetails" class="module-view-details" hidden></div>
    </section>

    <script src="/api.js?v=module-view"></script>
    <script>
        const params = new URLSearchParams(window.location.search);
        const moduleId = params.get("id");
        let currentModule = null;
        let modulebooks = [];

        const moduleFields = [
            ["Modulnummer", module => module.moduleNumber],
            ["Titel", module => module.title],
            ["Koordinator/in", module => module.coordinator],
            ["Leistungspunkte", module => creditsText(module.credits)],
            ["Workload", module => workloadText(module.workload)],
            ["Verwendbarkeit", module => module.applicability],
            ["Lerngebiet", module => module.learningArea],
            ["Lernziele / Kompetenzen", module => module.learningObjectives],
            ["Voraussetzungen", module => module.prerequisites],
            ["Niveaustufe", module => module.level],
            ["Lernform", module => teachingFormsText(module.teachingForms)],
            ["Module Status", module => module.moduleStatus],
            ["Häufigkeit des Angebotes", module => module.frequency],
            ["Prüfungsform", module => module.examinationForm],
            ["Inhalte", module => module.contents],
            ["Literatur", module => module.literature],
            ["Weitere Hinweise", module => module.additionalNotes],
            ["Modulgewicht", module => module.moduleWeight]
        ];

        async function init() {
            if (!moduleId) {
                setStatus("Missing module id in URL. Example: /module-view.html?id=12");
                return;
            }

            document.getElementById("editLink").href = `/module-edit.html?id=${encodeURIComponent(moduleId)}`;
            document.getElementById("versionsLink").href = `/module-versions.html?id=${encodeURIComponent(moduleId)}`;

            try {
                [currentModule, modulebooks] = await Promise.all([
                    loadModule(moduleId),
                    loadModulebooks()
                ]);
                renderTitle();
                renderModuleDetails();
                setStatus(`Loaded module ${currentModule.id}.`);
            } catch (error) {
                setStatus("Could not load module: " + error.message);
            }
        }

        function renderTitle() {
            const number = currentModule.moduleNumber || currentModule.id;
            const name = currentModule.title || "Untitled module";
            const title = `${number} - ${name}`;
            document.getElementById("pageTitle").textContent = title;
            document.getElementById("documentTitle").textContent = title;
        }

        function renderModuleDetails() {
            const container = document.getElementById("moduleDetails");
            container.innerHTML = `
                <table class="modulebook-module-table">
                    <thead>
                        <tr>
                            <th>Datenfeld</th>
                            <th>Erklärung</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${moduleFields.map(([label, valueReader]) =>
                            renderModuleRow(label, valueReader(currentModule))
                        ).join("")}
                    </tbody>
                </table>
            `;
            container.hidden = false;
        }

        function renderModuleRow(label, value) {
            const formattedValue = formatValue(value);

            if (!formattedValue) {
                return "";
            }

            return `
                <tr>
                    <td>${escapeHtml(label)}</td>
                    <td>${formatFieldHtml(label, value)}</td>
                </tr>
            `;
        }

        function modulebookLabel(modulebookId) {
            const selectedProgram = modulebooks.find(program =>
                String(program.id) === String(modulebookId)
            );

            return selectedProgram
                ? studyProgramDisplayLabel(selectedProgram)
                : `Modulebook ${modulebookId}`;
        }

        function studyProgramDisplayLabel(program) {
            const suffix = degreeTypeShortLabel(program.degreeType);
            const name = program?.studyProgramName || program?.name || "";
            return suffix ? `${name} (${suffix})` : name;
        }

        function degreeTypeShortLabel(degreeType) {
            if (degreeType === "BACHELOR") {
                return "B.Sc.";
            }
            if (degreeType === "MASTER") {
                return "M.Sc.";
            }
            return "";
        }

        function teachingFormsText(teachingForms) {
            if (!teachingForms || teachingForms.length === 0) {
                return "";
            }

            return teachingForms
                .map(teachingForm => {
                    const label = teachingForm.labelDe || teachingForm.labelEn || "";
                    return label || teachingForm.code || "";
                })
                .filter(Boolean)
                .join("\n");
        }

        function creditsText(credits) {
            return credits === null || credits === undefined ? "" : `${credits} Cr`;
        }

        function workloadText(workload) {
            if (!workload) {
                return "";
            }

            const components = workload.components && workload.components.length > 0
                ? workload.components
                    .map(component => {
                        const teachingForm = component.teachingFormCode || component.teachingFormLabel || component.teachingFormId;
                        return `${formatNumber(component.swsAmount)} SWS ${teachingForm ?? ""}`.trim();
                    })
                    .filter(Boolean)
                    .join(" + ")
                : "";

            if (workload.presenceHours !== null && workload.presenceHours !== undefined) {
                const componentPart = components ? ` (${components})` : "";
                const selfStudyPart = workload.selfStudyHours !== null && workload.selfStudyHours !== undefined
                    ? `, ${formatNumber(workload.selfStudyHours)} Stunden Selbststudium`
                    : "";
                return `${formatNumber(workload.presenceHours)} Stunden Präsenz${componentPart}${selfStudyPart}`;
            }

            if (workload.selfStudyHours !== null && workload.selfStudyHours !== undefined) {
                return `${formatNumber(workload.selfStudyHours)} Stunden Selbststudium`;
            }

            return workload.rawText || components;
        }

        function formatNumber(value) {
            if (value === null || value === undefined || value === "") {
                return "";
            }
            const number = Number(value);
            return Number.isInteger(number) ? String(number) : String(number);
        }

        function formatValue(value) {
            if (value === null || value === undefined) {
                return "";
            }

            return String(value);
        }

        function formatFieldHtml(label, value) {
            const text = formatValue(value);
            if (!["Lernziele / Kompetenzen", "Prüfungsform", "Inhalte", "Literatur"].includes(label)) {
                return escapeHtml(text);
            }

            const bulletHtml = formatBulletListHtml(text);
            if (bulletHtml) {
                return bulletHtml;
            }

            return escapeHtml(formatReadableText(text));
        }

        function formatBulletListHtml(text) {
            const normalizedText = text
                .replace(/\r\n/g, "\n")
                .replace(/\r/g, "\n")
                .replace(/[ \t]+/g, " ")
                .trim();

            if (!normalizedText.includes(" - ")) {
                return "";
            }

            const parts = normalizedText
                .replace(/^-\s*/, "")
                .split(/\s+-\s+/)
                .map(part => part.trim())
                .filter(Boolean);

            if (parts.length < 2) {
                return "";
            }

            let html = '<ul class="readable-list">';
            let sectionOpen = false;

            parts.forEach((part, index) => {
                const startsNewSection = index === 0 || isTopLevelBullet(part);

                if (startsNewSection) {
                    if (sectionOpen) {
                        html += "</ul></li>";
                        sectionOpen = false;
                    }

                    if (part.endsWith(":")) {
                        html += `<li>${escapeHtml(part)}<ul>`;
                        sectionOpen = true;
                    } else {
                        html += `<li>${escapeHtml(part)}</li>`;
                    }
                    return;
                }

                if (sectionOpen) {
                    html += `<li>${escapeHtml(part)}</li>`;
                } else {
                    html += `<li>${escapeHtml(part)}</li>`;
                }
            });

            if (sectionOpen) {
                html += "</ul></li>";
            }

            return `${html}</ul>`;
        }

        function isTopLevelBullet(part) {
            return part.endsWith(":")
                || /^(Grundlagen|Kompositorische|Fächerübergreifende)\b/.test(part);
        }

        function formatReadableText(text) {
            if (!text.trim()) {
                return "";
            }

            return text
                .replace(/\r\n/g, "\n")
                .replace(/\r/g, "\n")
                .replace(/[ \t]+/g, " ")
                .replace(/\s*;\s*/g, ";\n")
                .replace(/([.!?])\s+(?=[A-ZÄÖÜ0-9])/g, "$1\n")
                .replace(/\s+(\d+[.)]\s+)/g, "\n$1")
                .replace(/\n{3,}/g, "\n\n")
                .trim();
        }

        function setStatus(message) {
            document.getElementById("status").textContent = message;
        }

        init();
    </script>
</body>
</html>
