<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Compare Modulebook Versions</title>
    <link rel="stylesheet" href="/app.css">
</head>
<body>
    <nav>
        <a href="/index.html">Modulebooks</a>
    </nav>

    <h1>Compare Modulebook Versions</h1>

    <section>
        <div id="status" class="status">Loading versions...</div>
        <div class="form-actions">
            <a id="historyLink" href="/index.html">Back to change log</a>
        </div>
    </section>

    <section>
        <h2 id="studyProgramTitle">Modulebook</h2>
        <div class="compare-controls">
            <label>
                From version
                <select id="fromVersion"></select>
            </label>

            <label>
                To version
                <select id="toVersion"></select>
            </label>

            <button type="button" onclick="runCompare()">Compare</button>
        </div>
    </section>

    <section>
        <h2>Differences</h2>
        <div id="diffResult">Choose two versions to compare.</div>
    </section>

    <script src="/api.js?v=modulebook-version-compare"></script>
    <script>
        const params = new URLSearchParams(window.location.search);
        const modulebookId = params.get("id");
        const initialFrom = params.get("from");
        const initialTo = params.get("to");

        let studyProgram = null;
        let modules = [];
        let teachingForms = [];
        let changeSets = [];
        let modulebookVersions = [];
        let changesByChangeSetId = new Map();
        let versionPoints = [];

        async function init() {
            if (!modulebookId) {
                setStatus("Missing modulebook id in URL. Example: /modulebook-version-compare.html?id=3");
                return;
            }

            document.getElementById("historyLink").href =
                `/modulebook-history.html?id=${encodeURIComponent(modulebookId)}`;

            try {
                const modulebooks = await loadModulebooks();
                studyProgram = modulebooks.find(program => String(program.id) === String(modulebookId));
                [modules, changeSets, modulebookVersions, teachingForms] = await Promise.all([
                    loadModulesForModulebook(modulebookId),
                    loadModulebookChangeSets(modulebookId),
                    loadModulebookVersions(modulebookId),
                    loadTeachingForms()
                ]);
                await loadAllFieldChanges();
                buildVersionPoints();
                renderTitle();
                renderVersionSelects();
                setStatus(`Loaded ${versionPoints.length} versions.`);

                if (versionPoints.length >= 2) {
                    runCompare();
                }
            } catch (error) {
                setStatus("Could not load version compare page: " + error.message);
            }
        }

        async function loadAllFieldChanges() {
            const entries = await Promise.all(changeSets.map(async changeSet => [
                Number(changeSet.id),
                await loadChangeSetFieldChanges(changeSet.id)
            ]));

            changesByChangeSetId = new Map(entries);
        }

        function buildVersionPoints() {
            const versionBeforeChangeSetId = new Map();
            const versionByModulebookVersionId = new Map();
            const events = historyEvents();
            const latestPointByVersion = new Map();
            let major = 1;
            let minor = 0;
            let hasVersion = false;

            versionPoints = [];

            events.forEach((event, index) => {
                if (event.type === "modulebookVersion") {
                    if (isInitialImportVersion(event.value)) {
                        hasVersion = true;
                    } else if (hasVersion) {
                        major += 1;
                        minor = 0;
                    } else {
                        hasVersion = true;
                    }

                    const version = formatVersion(major, minor);
                    versionByModulebookVersionId.set(Number(event.value.id), version);
                    latestPointByVersion.set(version, {
                        key: `tag:${event.value.id}`,
                        index,
                        version,
                        label: `Version ${event.value.id}`,
                        detail: event.value.versionMessage || "",
                        createdAt: event.value.createdAt
                    });
                    return;
                }

                const changeSet = event.value;
                const changeSetId = Number(changeSet.id);
                versionBeforeChangeSetId.set(changeSetId, hasVersion ? formatVersion(major, minor) : formatVersion(1, 0));

                if (changeSet.sourceType === "RESTORE_BEFORE") {
                    const targetChangeSetId = restoreTargetChangeSetId(changeSet);
                    const restoredVersion = versionBeforeChangeSetId.get(targetChangeSetId)
                        || (hasVersion ? formatVersion(major, minor) : formatVersion(1, 0));
                    const parsedVersion = parseVersion(restoredVersion);
                    major = parsedVersion.major;
                    minor = parsedVersion.minor;
                    hasVersion = true;
                    latestPointByVersion.set(restoredVersion, changeSetVersionPoint(changeSet, index, restoredVersion));
                    return;
                }

                if (changeSet.sourceType === "RESTORE_TAG") {
                    const targetVersionId = restoreTargetModulebookVersionId(changeSet);
                    const restoredVersion = versionByModulebookVersionId.get(targetVersionId)
                        || (hasVersion ? formatVersion(major, minor) : formatVersion(1, 0));
                    const parsedVersion = parseVersion(restoredVersion);
                    major = parsedVersion.major;
                    minor = parsedVersion.minor;
                    hasVersion = true;
                    latestPointByVersion.set(restoredVersion, changeSetVersionPoint(changeSet, index, restoredVersion));
                    return;
                }

                if (!hasVersion) {
                    hasVersion = true;
                } else {
                    minor += 1;
                }

                if (!changeSet.discardedAt) {
                    const version = formatVersion(major, minor);
                    latestPointByVersion.set(version, changeSetVersionPoint(changeSet, index, version));
                }
            });

            versionPoints = Array.from(latestPointByVersion.values())
                .sort((left, right) => compareVersions(left.version, right.version) || left.index - right.index);
        }

        function changeSetVersionPoint(changeSet, index, version) {
            return {
                key: `changeSet:${changeSet.id}`,
                index,
                version,
                label: `Change set ${changeSet.id}`,
                detail: changeSet.reason || changeSet.sourceType || "",
                createdAt: changeSet.createdAt
            };
        }

        function renderTitle() {
            if (!studyProgram) {
                document.getElementById("studyProgramTitle").textContent =
                    `Modulebook ${modulebookId}`;
                return;
            }

            document.getElementById("studyProgramTitle").textContent =
                modulebookLabel(studyProgram);
        }

        function modulebookLabel(program) {
            const suffix = degreeTypeShortLabel(program?.degreeType);
            const name = program?.studyProgramName || program?.name || "";
            return suffix ? `${name} (${suffix})` : name;
        }

        function degreeTypeShortLabel(degreeType) {
            if (degreeType === "BACHELOR") {
                return "B.Sc.";
            }
            if (degreeType === "MASTER") {
                return "M.Sc.";
            }
            return "";
        }

        function renderVersionSelects() {
            const fromSelect = document.getElementById("fromVersion");
            const toSelect = document.getElementById("toVersion");

            if (versionPoints.length < 2) {
                fromSelect.innerHTML = "";
                toSelect.innerHTML = "";
                document.getElementById("diffResult").textContent =
                    "At least two versions are needed for comparison.";
                return;
            }

            const options = versionPoints.map(point => `
                <option value="${escapeHtml(point.key)}">
                    ${escapeHtml(versionPointLabel(point))}
                </option>
            `).join("");

            fromSelect.innerHTML = options;
            toSelect.innerHTML = options;
            fromSelect.value = selectableVersionKey(initialFrom, versionPoints[0].key);
            toSelect.value = selectableVersionKey(initialTo, versionPoints[versionPoints.length - 1].key);
        }

        function selectableVersionKey(requestedKey, fallbackKey) {
            return versionPoints.some(point => point.key === requestedKey) ? requestedKey : fallbackKey;
        }

        function versionPointLabel(point) {
            const detail = point.detail ? ` - ${point.detail}` : "";
            return `${point.version} - ${point.label} - ${formatDate(point.createdAt)}${detail}`;
        }

        function runCompare() {
            const fromKey = document.getElementById("fromVersion").value;
            const toKey = document.getElementById("toVersion").value;

            if (!fromKey || !toKey) {
                return;
            }

            const fromPoint = versionPoints.find(point => point.key === fromKey);
            const toPoint = versionPoints.find(point => point.key === toKey);
            const diff = compareVersionPoints(fromPoint, toPoint);
            renderDiff(diff, fromPoint, toPoint);
            setStatus(`Found ${diff.length} changed fields.`);
        }

        function compareVersionPoints(fromPoint, toPoint) {
            if (!fromPoint || !toPoint || fromPoint.key === toPoint.key) {
                return [];
            }

            const reverse = fromPoint.index > toPoint.index;
            const startIndex = Math.min(fromPoint.index, toPoint.index);
            const endIndex = Math.max(fromPoint.index, toPoint.index);
            const selectedChanges = historyEvents()
                .filter(event => event.type === "changeSet" && event.index > startIndex && event.index <= endIndex)
                .flatMap(event => changesByChangeSetId.get(Number(event.value.id)) || [])
                .sort(compareFieldChanges);
            const byField = new Map();

            selectedChanges.forEach(change => {
                const changePath = changePathOf(change);
                const fieldKey = `${change.moduleId || "studyProgram"}:${changePath}`;
                const existing = byField.get(fieldKey);
                if (!existing) {
                    byField.set(fieldKey, {
                        moduleId: change.moduleId,
                        path: changePath,
                        oldValue: change.oldValue,
                        newValue: change.newValue,
                        detailChangeSetId: change.changeSetId,
                        detailChangeId: change.id
                    });
                    return;
                }
                existing.newValue = change.newValue;
                existing.detailChangeSetId = change.changeSetId;
                existing.detailChangeId = change.id;
            });

            return Array.from(byField.values())
                .map(change => reverse ? {
                    moduleId: change.moduleId,
                    path: change.path,
                    oldValue: change.newValue,
                    newValue: change.oldValue,
                    detailChangeSetId: change.detailChangeSetId,
                    detailChangeId: change.detailChangeId
                } : change)
                .filter(change => !valuesEqual(change.oldValue, change.newValue))
                .sort((left, right) =>
                    moduleLabel(moduleById(left.moduleId), left.moduleId).localeCompare(
                        moduleLabel(moduleById(right.moduleId), right.moduleId)
                    ) || String(left.path || "").localeCompare(String(right.path || ""))
                );
        }

        function renderDiff(changes, fromPoint, toPoint) {
            const container = document.getElementById("diffResult");

            if (changes.length === 0) {
                container.textContent = "No differences found.";
                return;
            }

            container.innerHTML = `
                <table>
                    <thead>
                        <tr>
                            <th>Module</th>
                            <th>Change</th>
                            <th>${escapeHtml(fromPoint.version)}</th>
                            <th>${escapeHtml(toPoint.version)}</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${changes.map(change => {
                            const oldValue = formatFieldChangeValue(change.path, change.oldValue);
                            const newValue = formatFieldChangeValue(change.path, change.newValue);
                            return `
                                <tr>
                                    <td>${escapeHtml(compareModuleLabel(change))}</td>
                                    <td>${escapeHtml(readablePath(change.path))}</td>
                                    <td class="diff-old">${renderCompareValue(change.path, change.oldValue, oldValue, newValue, "old")}</td>
                                    <td class="diff-new">${renderCompareValue(change.path, change.newValue, oldValue, newValue, "new")}</td>
                                    <td class="row-actions">
                                        <a href="${fieldChangeDetailUrl(change)}">Change details</a>
                                    </td>
                                </tr>
                            `;
                        }).join("")}
                    </tbody>
                </table>
            `;
        }

        function historyEvents() {
            return [
                ...changeSets.map(changeSet => ({
                    type: "changeSet",
                    createdAt: changeSet.createdAt,
                    id: Number(changeSet.id),
                    value: changeSet
                })),
                ...modulebookVersions.map(tag => ({
                    type: "modulebookVersion",
                    createdAt: tag.createdAt,
                    id: Number(tag.id),
                    value: tag
                }))
            ].sort(compareHistoryEvents).map((event, index) => ({ ...event, index }));
        }

        function compareHistoryEvents(left, right) {
            const timeComparison = eventTime(left) - eventTime(right);
            if (timeComparison !== 0) {
                return timeComparison;
            }

            if (left.type !== right.type) {
                return left.type === "changeSet" ? -1 : 1;
            }

            return left.id - right.id;
        }

        function compareFieldChanges(left, right) {
            return new Date(left.createdAt || 0) - new Date(right.createdAt || 0)
                || Number(left.changeSetId) - Number(right.changeSetId)
                || Number(left.id) - Number(right.id);
        }

        function eventTime(event) {
            const timestamp = new Date(event.createdAt).getTime();
            return Number.isFinite(timestamp) ? timestamp : 0;
        }

        function moduleById(moduleId) {
            return modules.find(module => Number(module.id) === Number(moduleId));
        }

        function moduleLabel(module, moduleId) {
            if (!moduleId) {
                return "Modulebook";
            }

            if (!module) {
                return `Module ${moduleId}`;
            }

            return `${module.moduleNumber || module.id} ${module.title || ""}`.trim();
        }

        function restoreTargetChangeSetId(changeSet) {
            const match = String(changeSet.reason || "").match(/change set\s+(\d+)/i);
            return match ? Number(match[1]) : null;
        }

        function restoreTargetModulebookVersionId(changeSet) {
            const match = String(changeSet.reason || "").match(/modulebook (?:tag|version)\s+(\d+)/i);
            return match ? Number(match[1]) : null;
        }

        function isInitialImportVersion(tag) {
            return tag.sourceType === "INITIAL_IMPORT";
        }

        function formatVersion(major, minor) {
            return `${major}.${minor}`;
        }

        function parseVersion(version) {
            const [major, minor] = String(version || "1.0").split(".").map(Number);
            return {
                major: Number.isFinite(major) ? major : 1,
                minor: Number.isFinite(minor) ? minor : 0
            };
        }

        function compareVersions(left, right) {
            const leftVersion = parseVersion(left);
            const rightVersion = parseVersion(right);
            return leftVersion.major - rightVersion.major || leftVersion.minor - rightVersion.minor;
        }

        function valuesEqual(left, right) {
            return JSON.stringify(parseJsonValue(left)) === JSON.stringify(parseJsonValue(right));
        }

        function formatJsonValue(value) {
            const parsed = parseJsonValue(value);
            if (parsed === null || parsed === undefined) {
                return "";
            }
            if (typeof parsed === "string" || typeof parsed === "number" || typeof parsed === "boolean") {
                return String(parsed);
            }
            return JSON.stringify(parsed, null, 2);
        }

        function formatFieldChangeValue(fieldPath, value) {
            if (fieldPath === "teachingFormIds") {
                return teachingFormLabelsForJsonValue(value);
            }
            if (fieldPath === "module.created") {
                if (isJsonNull(value)) {
                    return "--";
                }
                return `created module "${lifecycleSnapshotLabelFromValue(value)}"`;
            }
            if (fieldPath === "module.deleted") {
                if (isJsonNull(value)) {
                    return "--";
                }
                return `deleted module "${lifecycleSnapshotLabelFromValue(value)}"`;
            }

            return formatJsonValue(value);
        }

        function renderCompareValue(fieldPath, rawValue, oldValue, newValue, side) {
            if (fieldPath === "module.created" || fieldPath === "module.deleted") {
                if (isJsonNull(rawValue)) {
                    return "--";
                }
                const snapshot = parseLifecycleSnapshot(rawValue);
                return snapshot
                    ? renderModuleSnapshotTable(snapshot, fieldPath === "module.deleted")
                    : escapeHtml(formatJsonValue(rawValue));
            }

            return side === "old"
                ? highlightOldValue(oldValue, newValue)
                : highlightNewValue(oldValue, newValue);
        }

        function fieldChangeDetailUrl(change) {
            return `/modulebook-history.html?id=${encodeURIComponent(modulebookId)}&changeSetId=${encodeURIComponent(change.detailChangeSetId)}&changeId=${encodeURIComponent(change.detailChangeId)}&source=versionControl`;
        }

        function compareModuleLabel(change) {
            if (change.path === "module.created") {
                return lifecycleSnapshotLabelFromValue(change.newValue) || moduleLabel(moduleById(change.moduleId), change.moduleId);
            }
            if (change.path === "module.deleted") {
                return lifecycleSnapshotLabelFromValue(change.oldValue) || moduleLabel(moduleById(change.moduleId), change.moduleId);
            }

            return moduleLabel(moduleById(change.moduleId), change.moduleId);
        }

        function lifecycleSnapshotLabelFromValue(value) {
            const snapshot = parseLifecycleSnapshot(value);
            if (!snapshot) {
                return "";
            }

            return moduleSnapshotLabel(snapshot.module || snapshot);
        }

        function parseLifecycleSnapshot(value) {
            const parsed = parseJsonValue(value);
            if (!parsed || typeof parsed !== "object") {
                return null;
            }

            return parsed;
        }

        function moduleSnapshotLabel(module) {
            if (!module || typeof module !== "object") {
                return "Module";
            }

            const moduleNumber = module.moduleNumber || "";
            const title = module.title || module.name || "";
            const label = `${moduleNumber} ${title}`.trim();
            return label || (module.id ? `Module ${module.id}` : "Module");
        }

        function renderModuleSnapshotTable(snapshot, deleted) {
            const module = snapshot.module || snapshot;
            const workload = snapshot.workload || null;
            const teachingFormIds = snapshot.teachingFormIds || [];
            const tableClass = deleted
                ? "modulebook-module-table compare-module-snapshot-table deleted-module-snapshot"
                : "modulebook-module-table compare-module-snapshot-table";

            return `
                <table class="${tableClass}">
                    <thead>
                        <tr>
                            <th>Datenfeld</th>
                            <th>Erklärung</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${moduleSnapshotRows(module, workload, teachingFormIds)}
                    </tbody>
                </table>
            `;
        }

        function moduleSnapshotRows(module, workload, teachingFormIds) {
            const rows = [
                ["Modulnummer", module.moduleNumber],
                ["Titel", module.title],
                ["Koordinator/in", module.coordinator],
                ["Leistungspunkte", creditsText(module.credits)],
                ["Workload", workloadText(workload)],
                ["Verwendbarkeit", module.applicability],
                ["Lerngebiet", module.learningArea],
                ["Lernziele / Kompetenzen", module.learningObjectives],
                ["Voraussetzungen", module.prerequisites],
                ["Niveaustufe", module.level],
                ["Lernform", teachingFormLabelsForIds(teachingFormIds)],
                ["Status", module.moduleStatus],
                ["Häufigkeit des Angebotes", module.frequency],
                ["Prüfungsform", module.examinationForm],
                ["Inhalte", module.contents],
                ["Literatur", module.literature],
                ["Weitere Hinweise", module.additionalNotes],
                ["Modulgewicht", module.moduleWeight]
            ];

            return rows.map(([label, value]) => `
                <tr>
                    <td>${escapeHtml(label)}</td>
                    <td>${escapeHtml(String(value ?? ""))}</td>
                </tr>
            `).join("");
        }

        function creditsText(credits) {
            return credits === null || credits === undefined || credits === "" ? "" : `${credits} Cr`;
        }

        function workloadText(workload) {
            if (!workload) {
                return "";
            }

            const components = workload.components && workload.components.length > 0
                ? workload.components
                    .map(component => {
                        const teachingForm = teachingFormLabelForId(component.teachingFormId);
                        return `${formatNumber(component.swsAmount)} SWS ${teachingForm}`.trim();
                    })
                    .filter(Boolean)
                    .join(" + ")
                : "";

            if (workload.presenceHours !== null && workload.presenceHours !== undefined) {
                const componentPart = components ? ` (${components})` : "";
                const selfStudyPart = workload.selfStudyHours !== null && workload.selfStudyHours !== undefined
                    ? `, ${formatNumber(workload.selfStudyHours)} Stunden Selbststudium`
                    : "";
                return `${formatNumber(workload.presenceHours)} Stunden Präsenz${componentPart}${selfStudyPart}`;
            }

            if (workload.selfStudyHours !== null && workload.selfStudyHours !== undefined) {
                return `${formatNumber(workload.selfStudyHours)} Stunden Selbststudium`;
            }

            return workload.rawText || components;
        }

        function formatNumber(value) {
            if (value === null || value === undefined || value === "") {
                return "";
            }

            const number = Number(value);
            return Number.isInteger(number) ? String(number) : String(value);
        }

        function teachingFormLabelsForJsonValue(value) {
            const parsed = parseJsonValue(value);
            const ids = Array.isArray(parsed) ? parsed : [];
            return teachingFormLabelsForIds(ids);
        }

        function teachingFormLabelsForIds(ids) {
            return normalizedTeachingFormIds(ids)
                .map(id => {
                    return teachingFormLabelForId(id);
                })
                .join(", ");
        }

        function teachingFormLabelForId(id) {
            const teachingForm = teachingForms.find(option => Number(option.id) === Number(id));
            return teachingForm ? teachingFormLabel(teachingForm) : `Teaching form ${id}`;
        }

        function parseJsonValue(value) {
            if (value === null || value === undefined) {
                return null;
            }

            try {
                return JSON.parse(value);
            } catch (error) {
                return value;
            }
        }

        function isJsonNull(value) {
            return value === null || value === undefined || value === "null";
        }

        function normalizedTeachingFormIds(ids) {
            return (ids || [])
                .map(Number)
                .filter(Number.isFinite)
                .sort((left, right) => left - right);
        }

        function teachingFormLabel(teachingForm) {
            const label = teachingForm.labelDe || teachingForm.labelEn || "";
            return label ? `${teachingForm.code} - ${label}` : teachingForm.code;
        }

        function highlightOldValue(oldValue, newValue) {
            const diffParts = diffText(String(oldValue ?? ""), String(newValue ?? ""));
            return diffParts
                .filter(part => part.type !== "added")
                .map(part => part.type === "removed"
                    ? `<mark class="diff-removed">${escapeHtml(part.text)}</mark>`
                    : escapeHtml(part.text)
                )
                .join("");
        }

        function highlightNewValue(oldValue, newValue) {
            const diffParts = diffText(String(oldValue ?? ""), String(newValue ?? ""));
            return diffParts
                .filter(part => part.type !== "removed")
                .map(part => part.type === "added"
                    ? `<mark class="diff-added">${escapeHtml(part.text)}</mark>`
                    : escapeHtml(part.text)
                )
                .join("");
        }

        function diffText(oldText, newText) {
            if (oldText === newText) {
                return [{ type: "same", text: oldText }];
            }

            const oldTokens = tokenize(oldText);
            const newTokens = tokenize(newText);
            const table = buildLcsTable(oldTokens, newTokens);
            const parts = [];
            let oldIndex = 0;
            let newIndex = 0;

            while (oldIndex < oldTokens.length && newIndex < newTokens.length) {
                if (oldTokens[oldIndex] === newTokens[newIndex]) {
                    parts.push({ type: "same", text: oldTokens[oldIndex] });
                    oldIndex++;
                    newIndex++;
                } else if (table[oldIndex + 1][newIndex] >= table[oldIndex][newIndex + 1]) {
                    parts.push({ type: "removed", text: oldTokens[oldIndex] });
                    oldIndex++;
                } else {
                    parts.push({ type: "added", text: newTokens[newIndex] });
                    newIndex++;
                }
            }

            while (oldIndex < oldTokens.length) {
                parts.push({ type: "removed", text: oldTokens[oldIndex] });
                oldIndex++;
            }

            while (newIndex < newTokens.length) {
                parts.push({ type: "added", text: newTokens[newIndex] });
                newIndex++;
            }

            return mergeAdjacentParts(parts);
        }

        function tokenize(text) {
            return text.match(/(\s+|[A-Za-z0-9_]+|[^\sA-Za-z0-9_])/g) || [];
        }

        function buildLcsTable(oldTokens, newTokens) {
            const table = Array.from(
                { length: oldTokens.length + 1 },
                () => Array(newTokens.length + 1).fill(0)
            );

            for (let oldIndex = oldTokens.length - 1; oldIndex >= 0; oldIndex--) {
                for (let newIndex = newTokens.length - 1; newIndex >= 0; newIndex--) {
                    table[oldIndex][newIndex] = oldTokens[oldIndex] === newTokens[newIndex]
                        ? table[oldIndex + 1][newIndex + 1] + 1
                        : Math.max(table[oldIndex + 1][newIndex], table[oldIndex][newIndex + 1]);
                }
            }

            return table;
        }

        function mergeAdjacentParts(parts) {
            return parts.reduce((merged, part) => {
                const previous = merged[merged.length - 1];
                if (previous && previous.type === part.type) {
                    previous.text += part.text;
                } else {
                    merged.push({ ...part });
                }
                return merged;
            }, []);
        }

        function readablePath(path) {
            if (path === "module.created") {
                return "created all fields";
            }
            if (path === "module.deleted") {
                return "deleted all fields";
            }

            return String(path || "")
                .replace(/^module\./, "")
                .replaceAll(".", " / ");
        }

        function formatDate(value) {
            if (!value) {
                return "";
            }

            return new Date(value).toLocaleString();
        }

        function setStatus(message) {
            document.getElementById("status").textContent = message;
        }

        init();
    </script>
</body>
</html>
