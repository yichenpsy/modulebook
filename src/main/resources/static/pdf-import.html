<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PDF Import</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 24px;
            color: #222;
        }

        label {
            display: block;
            margin-bottom: 12px;
        }

        input,
        textarea,
        button {
            font: inherit;
        }

        input,
        textarea {
            box-sizing: border-box;
            width: 100%;
            max-width: 720px;
            padding: 8px;
            margin-top: 4px;
        }

        button {
            padding: 8px 12px;
            margin: 4px 8px 4px 0;
            cursor: pointer;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 12px;
        }

        th,
        td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
            vertical-align: top;
        }

        th {
            background: #f5f5f5;
        }

        .status {
            margin: 12px 0;
            padding: 10px;
            background: #f5f5f5;
        }

        .summary {
            margin: 12px 0;
            padding: 12px;
            border: 1px solid #ddd;
            max-width: 720px;
        }

        .module-card {
            border: 1px solid #ddd;
            padding: 12px;
            margin: 12px 0;
            max-width: 980px;
        }

        .module-grid {
            display: grid;
            grid-template-columns: 140px minmax(220px, 1fr) 120px;
            gap: 12px;
        }

        .module-card textarea {
            max-width: 100%;
            min-height: 90px;
        }

        @media (max-width: 720px) {
            .module-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <h1>PDF Import</h1>

    <section>
        <h2>Upload</h2>

        <label>
            Studiengang
            <input id="studyProgram" value="Architektur">
        </label>

        <label>
            Year
            <input id="year" type="number" value="2021">
        </label>

        <label>
            PDF
            <input type="file" id="pdfFile" accept="application/pdf">
        </label>

        <button type="button" onclick="uploadPdf()">Upload PDF</button>
        <button type="button" onclick="saveImportedModules()">Save imported modules</button>
        <button type="button" onclick="loadSavedModules()">Refresh saved modules</button>

        <div id="status" class="status">Ready.</div>
    </section>

    <section>
        <h2>Import Report</h2>
        <div id="reportSummary" class="summary">No import yet.</div>
    </section>

    <section>
        <h2>Imported Modules To Review</h2>
        <div id="importedModules">No imported modules yet.</div>
    </section>

    <section>
        <h2>Saved Modules</h2>
        <div id="savedModules">Not loaded yet.</div>
    </section>

    <script>
        let importedModules = [];

        async function uploadPdf() {
            const studyProgram = document.getElementById("studyProgram").value.trim();
            const year = document.getElementById("year").value;
            const fileInput = document.getElementById("pdfFile");

            if (!studyProgram) {
                setStatus("Please enter a Studiengang.");
                return;
            }

            if (!year) {
                setStatus("Please enter a year.");
                return;
            }

            if (fileInput.files.length === 0) {
                setStatus("Please choose a PDF file first.");
                return;
            }

            const formData = new FormData();
            formData.append("studyProgram", studyProgram);
            formData.append("year", year);
            formData.append("file", fileInput.files[0]);

            setStatus("Uploading and processing PDF...");
            document.getElementById("reportSummary").textContent = "Processing...";
            document.getElementById("importedModules").textContent = "Processing...";

            try {
                const response = await fetch("/api/pdf-import/normalize", {
                    method: "POST",
                    body: formData
                });

                const text = await response.text();

                if (!response.ok) {
                    setStatus("Import failed.");
                    document.getElementById("reportSummary").textContent = text;
                    return;
                }

                const json = JSON.parse(text);
                importedModules = Array.isArray(json.normalizedModules) ? json.normalizedModules : [];

                setStatus(`Import finished. ${importedModules.length} modules found.`);
                renderReport(json);
                renderImportedModules();
            } catch (error) {
                setStatus("Request failed: " + error);
            }
        }

        async function saveImportedModules() {
            if (importedModules.length === 0) {
                setStatus("No imported modules to save.");
                return;
            }

            syncImportedModulesFromForm();

            const request = {
                studyProgram: document.getElementById("studyProgram").value.trim(),
                year: Number(document.getElementById("year").value),
                modules: importedModules
            };

            setStatus("Saving imported modules...");

            try {
                const response = await fetch("/api/pdf-import/modules", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(request)
                });

                const text = await response.text();

                if (!response.ok) {
                    setStatus("Save failed: " + text);
                    return;
                }

                const json = JSON.parse(text);
                setStatus(
                    `Save finished. Created: ${json.createdCount}, errors: ${json.errorCount}.`
                );

                if (json.errors && json.errors.length > 0) {
                    alert(json.errors.map(error =>
                        `Row ${error.index + 1} (${error.moduleNumber || "no code"}): ${error.message}`
                    ).join("\n"));
                }

                await loadSavedModules();
            } catch (error) {
                setStatus("Save request failed: " + error);
            }
        }

        async function loadSavedModules() {
            setStatus("Loading saved modules...");

            try {
                const response = await fetch("/api/modules");
                const text = await response.text();

                if (!response.ok) {
                    setStatus("Could not load saved modules: " + text);
                    return;
                }

                const modules = JSON.parse(text);
                renderSavedModules(modules);
                setStatus(`Loaded ${modules.length} saved modules.`);
            } catch (error) {
                setStatus("Load request failed: " + error);
            }
        }

        function renderReport(importResponse) {
            const report = importResponse.report || {};
            const summary = document.getElementById("reportSummary");

            summary.innerHTML = `
                <div><strong>Studiengang:</strong> ${escapeHtml(importResponse.studyProgram || "")}</div>
                <div><strong>Year:</strong> ${escapeHtml(String(importResponse.year || ""))}</div>
                <div><strong>Status:</strong> ${escapeHtml(report.status || "unknown")}</div>
                <div><strong>Detected modules:</strong> ${escapeHtml(String(report.detected_module_count || importedModules.length))}</div>
                <div><strong>Required modules:</strong> ${escapeHtml(String(report.required_module_count || ""))}</div>
                <div><strong>All required fields:</strong> ${escapeHtml(String(report.has_all_required_fields ?? ""))}</div>
            `;
        }

        function renderImportedModules() {
            const container = document.getElementById("importedModules");

            if (importedModules.length === 0) {
                container.textContent = "No imported modules found.";
                return;
            }

            container.innerHTML = importedModules.map((module, index) => `
                <div class="module-card" data-index="${index}">
                    <div class="module-grid">
                        <label>
                            Code
                            <input data-field="module_number" value="${escapeHtml(module.module_number || "")}">
                        </label>

                        <label>
                            Title
                            <input data-field="title" value="${escapeHtml(module.title || "")}">
                        </label>

                        <label>
                            Credits
                            <input data-field="credits" type="number" step="0.5" value="${escapeHtml(String(module.credits ?? ""))}">
                        </label>
                    </div>

                    <label>
                        Contents
                        <textarea data-field="contents">${escapeHtml(module.contents || "")}</textarea>
                    </label>

                    <label>
                        Learning objectives
                        <textarea data-field="learning_objectives">${escapeHtml(module.learning_objectives || "")}</textarea>
                    </label>

                    <button type="button" onclick="removeImportedModule(${index})">Remove</button>
                </div>
            `).join("");
        }

        function renderSavedModules(modules) {
            const container = document.getElementById("savedModules");

            if (!modules || modules.length === 0) {
                container.textContent = "No saved modules yet.";
                return;
            }

            container.innerHTML = `
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Code</th>
                            <th>Name</th>
                            <th>Credits</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${modules.map(module => `
                            <tr>
                                <td>${escapeHtml(String(module.id))}</td>
                                <td>${escapeHtml(module.code || "")}</td>
                                <td>${escapeHtml(module.name || "")}</td>
                                <td>${escapeHtml(String(module.credits ?? ""))}</td>
                            </tr>
                        `).join("")}
                    </tbody>
                </table>
            `;
        }

        function syncImportedModulesFromForm() {
            document.querySelectorAll(".module-card").forEach(card => {
                const index = Number(card.dataset.index);
                const module = importedModules[index];

                card.querySelectorAll("[data-field]").forEach(input => {
                    const field = input.dataset.field;
                    module[field] = field === "credits" ? Number(input.value) : input.value;
                });
            });
        }

        function removeImportedModule(index) {
            syncImportedModulesFromForm();
            importedModules.splice(index, 1);
            renderImportedModules();
            setStatus(`Removed module row ${index + 1}.`);
        }

        function setStatus(message) {
            document.getElementById("status").textContent = message;
        }

        function escapeHtml(value) {
            return String(value)
                .replaceAll("&", "&amp;")
                .replaceAll("<", "&lt;")
                .replaceAll(">", "&gt;")
                .replaceAll('"', "&quot;")
                .replaceAll("'", "&#039;");
        }

        loadSavedModules();
    </script>
</body>
</html>
