<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Module Change Log</title>
    <link rel="stylesheet" href="/app.css">
</head>
<body>
    <nav>
        <a href="/index.html">Modulebooks</a>
    </nav>

    <h1>Module Change Log</h1>

    <section>
        <div id="status" class="status">Loading change log...</div>
    </section>

    <section>
        <h2 id="moduleTitle">History</h2>
        <div id="changes">Loading...</div>
    </section>

    <script src="/api.js?v=module-change-log"></script>
    <script>
        const params = new URLSearchParams(window.location.search);
        const moduleId = params.get("id");
        let currentModule = null;
        let teachingForms = [];
        let changeSets = [];
        let fieldChanges = [];
        let changeGroups = [];

        async function init() {
            if (!moduleId) {
                setStatus("Missing module id in URL. Example: /module-versions.html?id=12");
                return;
            }
            try {
                currentModule = await loadModule(moduleId);
                [changeSets, fieldChanges, teachingForms] = await Promise.all([
                    loadModulebookChangeSets(currentModule.modulebookId),
                    loadModuleFieldChanges(moduleId),
                    loadTeachingForms()
                ]);
                buildChangeGroups();
                renderTitle();
                renderChanges();
                setStatus(`Loaded ${changeGroups.length} change sets.`);
            } catch (error) {
                setStatus("Could not load change log: " + error.message);
            }
        }

        function buildChangeGroups() {
            const changeSetById = new Map(changeSets.map(changeSet => [Number(changeSet.id), changeSet]));
            const groupsById = new Map();

            fieldChanges.forEach(change => {
                const changeSetId = Number(change.changeSetId);
                const changeSet = changeSetById.get(changeSetId) || {
                    id: changeSetId,
                    sourceType: "UNKNOWN",
                    reason: "",
                    createdAt: change.createdAt
                };

                if (!groupsById.has(changeSetId)) {
                    groupsById.set(changeSetId, {
                        changeSet,
                        changes: []
                    });
                }
                groupsById.get(changeSetId).changes.push(change);
            });

            changeGroups = Array.from(groupsById.values()).sort((left, right) =>
                new Date(right.changeSet.createdAt || 0) - new Date(left.changeSet.createdAt || 0)
            );
        }

        function renderTitle() {
            const number = currentModule.moduleNumber || currentModule.id;
            const name = currentModule.title || "Untitled module";
            document.getElementById("moduleTitle").textContent = `${number} - ${name}`;
        }

        function renderChanges() {
            const container = document.getElementById("changes");

            if (changeGroups.length === 0) {
                container.textContent = "No module changes saved yet.";
                return;
            }

            container.innerHTML = `
                <table>
                    <thead>
                        <tr>
                            <th>Created</th>
                            <th>Change set id</th>
                            <th>Source</th>
                            <th>Reason</th>
                            <th>Change</th>
                            <th>Old value</th>
                            <th>New value</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${changeGroups.flatMap(group =>
                            group.changes.map(change => {
                                const changePath = changePathOf(change);
                                return `
                                <tr>
                                    <td>${escapeHtml(formatDate(group.changeSet.createdAt))}</td>
                                    <td>${escapeHtml(String(group.changeSet.id))}</td>
                                    <td>${escapeHtml(group.changeSet.sourceType || "")}</td>
                                    <td>${escapeHtml(changeSetReasonText(group.changeSet, group.changes))}</td>
                                    <td>${escapeHtml(readablePath(changePath))}</td>
                                    <td class="diff-old">${escapeHtml(formatFieldChangeValue(changePath, change.oldValue))}</td>
                                    <td class="diff-new">${escapeHtml(formatFieldChangeValue(changePath, change.newValue))}</td>
                                    <td class="row-actions">
                                        <a href="${fieldChangeDetailUrl(group.changeSet.id, change.id)}">Change details</a>
                                    </td>
                                </tr>
                            `;
                            })
                        ).join("")}
                    </tbody>
                </table>
            `;
        }

        function formatJsonValue(value) {
            if (value === null || value === undefined) {
                return "";
            }

            try {
                const parsed = JSON.parse(value);
                if (parsed === null) {
                    return "";
                }
                if (typeof parsed === "string" || typeof parsed === "number" || typeof parsed === "boolean") {
                    return String(parsed);
                }
                return JSON.stringify(parsed, null, 2);
            } catch (error) {
                return String(value);
            }
        }

        function changeSetReasonText(changeSet, changes) {
            const reason = changeSet.reason || "";
            if (!shouldRegenerateReadableReason(reason, changes)) {
                return reason;
            }

            return generatedChangeMessage(changes) || reason;
        }

        function shouldRegenerateReadableReason(reason, changes) {
            return reason.includes("changed workload from")
                && reason.includes("{")
                && changes.some(change => changePathOf(change) === "workload");
        }

        function generatedChangeMessage(changes) {
            return changes
                .map(change => {
                    const changePath = changePathOf(change);
                    if (changePath === "module.created" || changePath === "module.deleted") {
                        return "";
                    }

                    const oldText = formatFieldChangeValue(changePath, change.oldValue);
                    const newText = formatFieldChangeValue(changePath, change.newValue);
                    if (oldText === newText) {
                        return "";
                    }

                    return `changed ${changeMessageLabel(changePath)} from ${displayValue(oldText)} to ${displayValue(newText)}`;
                })
                .filter(Boolean)
                .join("; ");
        }

        function changeMessageLabel(changePath) {
            const labels = {
                "module.moduleNumber": "module number",
                "module.title": "title",
                "module.credits": "credits",
                "module.moduleType": "module type",
                "module.coordinator": "coordinator",
                "module.applicability": "applicability",
                "module.learningArea": "learning area",
                "module.learningObjectives": "learning objectives",
                "module.prerequisites": "prerequisites",
                "module.level": "level",
                "module.moduleStatus": "Module Status",
                "module.moduleComments": "module comments",
                "module.frequency": "frequency",
                "module.examinationForm": "examination form",
                "module.contents": "contents",
                "module.literature": "literature",
                "module.additionalNotes": "additional notes",
                "module.moduleWeight": "module weight",
                "teachingFormIds": "teaching forms",
                "workload": "workload"
            };

            return labels[changePath] || readablePath(changePath);
        }

        function displayValue(value) {
            if (!value) {
                return "\"\"";
            }

            const text = String(value);
            const shortValue = text.length > 180 ? `${text.slice(0, 177)}...` : text;
            return `"${shortValue}"`;
        }

        function formatFieldChangeValue(fieldPath, value) {
            if (fieldPath === "teachingFormIds") {
                return teachingFormLabelsForJsonValue(value);
            }
            if (fieldPath === "workload") {
                return workloadText(parseJsonValue(value));
            }
            if (fieldPath === "module.created") {
                if (isJsonNull(value)) {
                    return "--";
                }
                return `created module "${lifecycleSnapshotLabelFromValue(value)}"`;
            }
            if (fieldPath === "module.deleted") {
                return lifecycleSnapshotLabelFromValue(value);
            }

            return formatJsonValue(value);
        }

        function fieldChangeDetailUrl(changeSetId, changeId) {
            return `/modulebook-history.html?id=${encodeURIComponent(currentModule.modulebookId)}&changeSetId=${encodeURIComponent(changeSetId)}&changeId=${encodeURIComponent(changeId)}&moduleLogId=${encodeURIComponent(moduleId)}`;
        }

        function lifecycleSnapshotLabelFromValue(value) {
            const parsed = parseJsonValue(value);
            if (!parsed || typeof parsed !== "object") {
                return "";
            }

            const module = parsed.module || parsed;
            const moduleNumber = module.moduleNumber || "";
            const title = module.title || module.name || "";
            const label = `${moduleNumber} ${title}`.trim();
            return label || (module.id ? `Module ${module.id}` : "Module");
        }

        function teachingFormLabelsForJsonValue(value) {
            const parsed = parseJsonValue(value);
            const ids = Array.isArray(parsed) ? parsed : [];
            return normalizedTeachingFormIds(ids)
                .map(id => {
                    const teachingForm = teachingForms.find(option => Number(option.id) === id);
                    return teachingForm ? teachingFormLabel(teachingForm) : `Teaching form ${id}`;
                })
                .join(", ");
        }

        function workloadText(workload) {
            if (!workload) {
                return "";
            }

            const components = (workload.components || [])
                .map(component => {
                    const sws = formatNumber(component.swsAmount);
                    const teachingForm = workloadTeachingFormCode(component);
                    return `${sws ? `${sws} SWS` : ""} ${teachingForm}`.trim();
                })
                .filter(Boolean)
                .join(" + ");

            if (workload.presenceHours !== null && workload.presenceHours !== undefined) {
                const componentPart = components ? ` (${components})` : "";
                const selfStudyPart = workload.selfStudyHours !== null && workload.selfStudyHours !== undefined
                    ? `, ${formatNumber(workload.selfStudyHours)} Stunden Selbststudium`
                    : "";
                return `${formatNumber(workload.presenceHours)} Stunden Präsenz${componentPart}${selfStudyPart}`;
            }

            if (workload.selfStudyHours !== null && workload.selfStudyHours !== undefined) {
                return `${formatNumber(workload.selfStudyHours)} Stunden Selbststudium`;
            }

            return workload.rawText || components;
        }

        function workloadTeachingFormCode(component) {
            if (component.teachingFormCode) {
                return component.teachingFormCode;
            }

            const teachingForm = teachingForms.find(option => Number(option.id) === Number(component.teachingFormId));
            return teachingForm?.code || component.teachingFormId || "";
        }

        function formatNumber(value) {
            if (value === null || value === undefined || value === "") {
                return "";
            }

            const number = Number(value);
            if (!Number.isFinite(number)) {
                return String(value);
            }
            return Number.isInteger(number) ? String(number) : String(Number(number.toFixed(2)));
        }

        function parseJsonValue(value) {
            if (value === null || value === undefined) {
                return null;
            }

            try {
                return JSON.parse(value);
            } catch (error) {
                return value;
            }
        }

        function isJsonNull(value) {
            return value === null || value === undefined || value === "null";
        }

        function normalizedTeachingFormIds(ids) {
            return (ids || [])
                .map(Number)
                .filter(Number.isFinite)
                .sort((left, right) => left - right);
        }

        function teachingFormLabel(teachingForm) {
            const label = teachingForm.labelDe || teachingForm.labelEn || "";
            return label ? `${teachingForm.code} - ${label}` : teachingForm.code;
        }

        function readablePath(path) {
            if (path === "module.created") {
                return "created module";
            }
            if (path === "module.deleted") {
                return "deleted module";
            }
            if (path === "module.moduleStatus") {
                return "Module Status";
            }

            return String(path || "")
                .replace(/^module\./, "")
                .replaceAll(".", " / ");
        }

        function formatDate(value) {
            if (!value) {
                return "";
            }

            return new Date(value).toLocaleString();
        }

        function setStatus(message) {
            document.getElementById("status").textContent = message;
        }

        init();
    </script>
</body>
</html>
