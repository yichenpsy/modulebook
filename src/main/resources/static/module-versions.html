<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Module Change Log</title>
    <link rel="stylesheet" href="/app.css">
</head>
<body>
    <nav>
        <a href="/index.html">Study programs</a>
        <a href="/study-program-import.html">Import PDF</a>
    </nav>

    <h1>Module Change Log</h1>

    <section>
        <div id="status" class="status">Loading change log...</div>
        <div class="form-actions">
            <a id="editLink" href="/index.html">Back to module</a>
            <a id="studyProgramsLink" href="/index.html">Back to study programs</a>
            <a id="compareLink" href="/index.html" hidden>Compare changes</a>
        </div>
    </section>

    <section>
        <h2 id="moduleTitle">History</h2>
        <div id="changes">Loading...</div>
    </section>

    <script src="/api.js?v=module-change-log"></script>
    <script>
        const params = new URLSearchParams(window.location.search);
        const moduleId = params.get("id");
        let currentModule = null;
        let changeSets = [];
        let fieldChanges = [];
        let changeGroups = [];

        async function init() {
            if (!moduleId) {
                setStatus("Missing module id in URL. Example: /module-versions.html?id=12");
                return;
            }

            document.getElementById("editLink").href = `/module-edit.html?id=${moduleId}`;
            document.getElementById("compareLink").href = `/module-version-compare.html?id=${moduleId}`;

            try {
                currentModule = await loadModule(moduleId);
                document.getElementById("studyProgramsLink").href =
                    `/index.html?studyProgramId=${encodeURIComponent(currentModule.studyProgramId)}`;
                [changeSets, fieldChanges] = await Promise.all([
                    loadStudyProgramChangeSets(currentModule.studyProgramId),
                    loadModuleFieldChanges(moduleId)
                ]);
                buildChangeGroups();
                renderTitle();
                renderChanges();
                document.getElementById("compareLink").hidden = changeGroups.length < 2;
                setStatus(`Loaded ${changeGroups.length} change sets.`);
            } catch (error) {
                setStatus("Could not load change log: " + error.message);
            }
        }

        function buildChangeGroups() {
            const changeSetById = new Map(changeSets.map(changeSet => [Number(changeSet.id), changeSet]));
            const groupsById = new Map();

            fieldChanges.forEach(change => {
                const changeSetId = Number(change.changeSetId);
                const changeSet = changeSetById.get(changeSetId) || {
                    id: changeSetId,
                    sourceType: "UNKNOWN",
                    reason: "",
                    createdAt: change.createdAt
                };

                if (!groupsById.has(changeSetId)) {
                    groupsById.set(changeSetId, {
                        changeSet,
                        changes: []
                    });
                }
                groupsById.get(changeSetId).changes.push(change);
            });

            changeGroups = Array.from(groupsById.values()).sort((left, right) =>
                new Date(right.changeSet.createdAt || 0) - new Date(left.changeSet.createdAt || 0)
            );
        }

        function renderTitle() {
            const number = currentModule.moduleNumber || currentModule.id;
            const name = currentModule.name || "Untitled module";
            document.getElementById("moduleTitle").textContent = `${number} - ${name}`;
        }

        function renderChanges() {
            const container = document.getElementById("changes");

            if (changeGroups.length === 0) {
                container.textContent = "No field changes saved yet.";
                return;
            }

            container.innerHTML = `
                <table>
                    <thead>
                        <tr>
                            <th>Created</th>
                            <th>Change set</th>
                            <th>Source</th>
                            <th>Reason</th>
                            <th>Field changes</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${changeGroups.map(group => `
                            <tr>
                                <td>${escapeHtml(formatDate(group.changeSet.createdAt))}</td>
                                <td>${escapeHtml(String(group.changeSet.id))}</td>
                                <td>${escapeHtml(group.changeSet.sourceType || "")}</td>
                                <td>${escapeHtml(group.changeSet.reason || "")}</td>
                                <td>${renderFieldChangeList(group.changes)}</td>
                            </tr>
                        `).join("")}
                    </tbody>
                </table>
            `;
        }

        function renderFieldChangeList(changes) {
            return `
                <table>
                    <thead>
                        <tr>
                            <th>Field</th>
                            <th>Old value</th>
                            <th>New value</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${changes.map(change => `
                            <tr>
                                <td>${escapeHtml(readablePath(change.fieldPath))}</td>
                                <td class="diff-old">${escapeHtml(formatJsonValue(change.oldValue))}</td>
                                <td class="diff-new">${escapeHtml(formatJsonValue(change.newValue))}</td>
                            </tr>
                        `).join("")}
                    </tbody>
                </table>
            `;
        }

        function formatJsonValue(value) {
            if (value === null || value === undefined) {
                return "";
            }

            try {
                const parsed = JSON.parse(value);
                if (parsed === null) {
                    return "";
                }
                if (typeof parsed === "string" || typeof parsed === "number" || typeof parsed === "boolean") {
                    return String(parsed);
                }
                return JSON.stringify(parsed, null, 2);
            } catch (error) {
                return String(value);
            }
        }

        function readablePath(path) {
            return String(path || "")
                .replace(/^module\./, "")
                .replaceAll(".", " / ");
        }

        function formatDate(value) {
            if (!value) {
                return "";
            }

            return new Date(value).toLocaleString();
        }

        function setStatus(message) {
            document.getElementById("status").textContent = message;
        }

        init();
    </script>
</body>
</html>
