<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Study Program History</title>
    <link rel="stylesheet" href="/app.css">
</head>
<body>
    <nav>
        <a href="/index.html">Study programs</a>
        <a href="/study-program-import.html">Import PDF</a>
    </nav>

    <h1>Study Program History</h1>

    <section>
        <div id="status" class="status">Loading history...</div>
        <div class="form-actions">
            <a id="backLink" href="/index.html">Back to study program</a>
        </div>
    </section>

    <section>
        <h2 id="studyProgramTitle">History</h2>
        <div id="history">Loading...</div>
    </section>

    <script src="/api.js?v=study-program-history-v2"></script>
    <script>
        const params = new URLSearchParams(window.location.search);
        const studyProgramId = params.get("id");
        const selectedGroupKey = params.get("group");
        const selectedCreatedAt = params.get("createdAt");
        let studyProgram = null;
        let modules = [];
        let historyRows = [];
        let historyGroups = [];

        async function init() {
            if (!studyProgramId) {
                setStatus("Missing study program id in URL. Example: /study-program-history.html?id=3");
                return;
            }

            document.getElementById("backLink").href = `/index.html?studyProgramId=${studyProgramId}`;

            try {
                const studyPrograms = await loadStudyPrograms();
                studyProgram = studyPrograms.find(program => String(program.id) === String(studyProgramId));
                await loadHistoryRows();
                buildHistoryGroups();
                renderTitle();
                renderHistory();
                setStatus(`Loaded ${historyGroups.length} history changes.`);
            } catch (error) {
                setStatus("Could not load study program history: " + error.message);
            }
        }

        async function loadHistoryRows() {
            historyRows = await loadStudyProgramHistory(studyProgramId);

            historyRows.sort((left, right) =>
                new Date(right.version.createdAt || 0) - new Date(left.version.createdAt || 0)
            );
        }

        function buildHistoryGroups() {
            const groupsByKey = new Map();

            historyRows.forEach(row => {
                const createdSecond = createdAtSecond(row.version.createdAt);
                const groupKey = row.version.changeSetId
                    ? `change-set-${row.version.changeSetId}`
                    : `created-at-${createdSecond}`;

                if (!groupsByKey.has(groupKey)) {
                    groupsByKey.set(groupKey, {
                        key: groupKey,
                        changeSetId: row.version.changeSetId || null,
                        createdAt: createdSecond,
                        rows: []
                    });
                }
                groupsByKey.get(groupKey).rows.push(row);
            });

            historyGroups = Array.from(groupsByKey.values()).sort((left, right) =>
                new Date(right.createdAt || 0) - new Date(left.createdAt || 0)
            );
        }

        function renderTitle() {
            if (!studyProgram) {
                document.getElementById("studyProgramTitle").textContent =
                    `Study program ${studyProgramId}`;
                return;
            }

            document.getElementById("studyProgramTitle").textContent =
                `${studyProgram.name} (${studyProgram.year})`;
        }

        function renderHistory() {
            const container = document.getElementById("history");

            if (historyRows.length === 0) {
                container.textContent = "No module history exists for this study program yet.";
                return;
            }

            if (selectedGroupKey || selectedCreatedAt) {
                renderHistoryGroupDetail(container);
                return;
            }

            renderHistoryGroups(container);
        }

        function renderHistoryGroups(container) {
            container.innerHTML = `
                <table>
                    <thead>
                        <tr>
                            <th>Created</th>
                            <th>Change set</th>
                            <th>Changed modules</th>
                            <th>Reasons</th>
                            <th>Modules</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${historyGroups.map(group => `
                            <tr>
                                <td>${escapeHtml(formatDate(group.createdAt))}</td>
                                <td>${escapeHtml(group.changeSetId ? String(group.changeSetId) : "legacy")}</td>
                                <td>${escapeHtml(String(group.rows.length))}</td>
                                <td>${escapeHtml(uniqueReasons(group).join(", "))}</td>
                                <td>${escapeHtml(moduleSummary(group))}</td>
                                <td class="row-actions">
                                    <a href="/study-program-history.html?id=${escapeHtml(String(studyProgramId))}&group=${encodeURIComponent(group.key)}">Details</a>
                                </td>
                            </tr>
                        `).join("")}
                    </tbody>
                </table>
            `;
        }

        function renderHistoryGroupDetail(container) {
            const group = selectedGroupKey
                ? historyGroups.find(item => item.key === selectedGroupKey)
                : historyGroups.find(item => item.createdAt === selectedCreatedAt);

            if (!group) {
                container.textContent = "No history entries found for this created time.";
                return;
            }

            const backUrl = `/study-program-history.html?id=${encodeURIComponent(studyProgramId)}`;

            container.innerHTML = `
                <div class="form-actions">
                    <a href="${backUrl}">Back to program history</a>
                </div>
                <h3>${escapeHtml(formatDate(group.createdAt))}</h3>
                ${group.changeSetId ? `<p class="muted">Change set ${escapeHtml(String(group.changeSetId))}</p>` : ""}
                <table>
                    <thead>
                        <tr>
                            <th>Module</th>
                            <th>Version</th>
                            <th>Reason</th>
                            <th>Snapshot</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${group.rows.map(row => {
                            const snapshot = parseSnapshot(row.version.snapshotJson);
                            const moduleSnapshot = snapshot.module || snapshot;
                            return `
                                <tr>
                                    <td>
                                        <strong>${escapeHtml(row.module.moduleNumber || "")}</strong>
                                        ${escapeHtml(row.module.name || "")}
                                        ${row.moduleDeleted ? "<span class=\"muted\">deleted</span>" : ""}
                                    </td>
                                    <td>${escapeHtml(String(row.version.versionNumber))}</td>
                                    <td>${escapeHtml(row.version.reason || "")}</td>
                                    <td>
                                        <strong>${escapeHtml(moduleSnapshot.moduleNumber || "")}</strong>
                                        ${escapeHtml(moduleSnapshot.name || "")}
                                    </td>
                                    <td class="row-actions">
                                        ${row.moduleDeleted ? "" : `
                                            <a href="/module-versions.html?id=${escapeHtml(String(row.module.id))}">Module history</a>
                                            <a href="/module-edit.html?id=${escapeHtml(String(row.module.id))}">Edit</a>
                                        `}
                                    </td>
                                </tr>
                            `;
                        }).join("")}
                    </tbody>
                </table>
            `;
        }

        function uniqueReasons(group) {
            return Array.from(new Set(
                group.rows
                    .map(row => row.version.reason || "")
                    .filter(reason => reason.trim() !== "")
            ));
        }

        function moduleSummary(group) {
            return group.rows
                .map(row => `${row.module.moduleNumber || row.module.id} ${row.module.name || ""}`.trim())
                .join(", ");
        }

        function parseSnapshot(snapshotJson) {
            try {
                return JSON.parse(snapshotJson);
            } catch (error) {
                return {};
            }
        }

        function formatDate(value) {
            if (!value) {
                return "";
            }

            return new Date(value).toLocaleString();
        }

        function createdAtSecond(value) {
            if (!value) {
                return "";
            }

            const date = new Date(value);
            date.setMilliseconds(0);
            return date.toISOString();
        }

        function setStatus(message) {
            document.getElementById("status").textContent = message;
        }

        init();
    </script>
</body>
</html>
