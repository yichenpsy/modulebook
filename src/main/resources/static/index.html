<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Study Programs</title>
    <link rel="stylesheet" href="/app.css?v=actions-gap">
</head>
<body>
    <nav>
        <a href="/index.html">Study programs</a>
        <a href="#createStudyProgramPanel" onclick="showCreateStudyProgramPanel()">Create new study program</a>
    </nav>

    <h1>Study Programs</h1>

    <section id="createStudyProgramPanel" class="commit-message-panel" hidden>
        <h2>Create new study program</h2>
        <label>
            Study program name
            <input id="newStudyProgramName">
        </label>
        <label>
            Degree type
            <select id="newDegreeType">
                <option value="BACHELOR">Bachelor</option>
                <option value="MASTER">Master</option>
            </select>
        </label>
        <div class="form-actions">
            <button type="button" onclick="createNewStudyProgram()">Create</button>
            <button type="button" onclick="hideCreateStudyProgramPanel()">Cancel</button>
        </div>
    </section>

    <section>
        <div id="status" class="status">Loading study programs...</div>
        <div id="studyPrograms">Loading...</div>
    </section>

    <section>
        <h2 id="modulesTitle">Modules</h2>
        <div id="modules">Open a study program to see its modules.</div>
    </section>

    <script src="/api.js"></script>
    <script>
        const params = new URLSearchParams(window.location.search);
        const initialStudyProgramId = params.get("studyProgramId");
        let selectedStudyProgramId = initialStudyProgramId;
        let studyPrograms = [];
        let modules = [];

        async function init() {
            try {
                studyPrograms = await loadStudyPrograms();
                renderStudyPrograms();
                if (selectInitialStudyProgram()) {
                    await loadSelectedStudyProgramModules(initialStudyProgramId);
                } else {
                    setStatus(`Loaded ${studyPrograms.length} study programs.`);
                }
            } catch (error) {
                setStatus("Could not load study programs: " + error.message);
            }
        }

        function renderStudyPrograms() {
            const container = document.getElementById("studyPrograms");

            if (studyPrograms.length === 0) {
                container.textContent = "No study programs saved yet.";
                return;
            }

            container.innerHTML = `
                <table>
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Degree</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${studyPrograms.map(program => `
                            <tr>
                                <td>${escapeHtml(studyProgramLabel(program))}</td>
                                <td>${escapeHtml(degreeTypeLabel(program.degreeType))}</td>
                                <td class="row-actions">
                                    <a href="/study-program-import.html?studyProgramId=${escapeHtml(String(program.id))}">Import PDF</a>
                                    <a href="/index.html?studyProgramId=${escapeHtml(String(program.id))}">Modules</a>
                                    <a href="/module-edit.html?studyProgramId=${escapeHtml(String(program.id))}">Add module</a>
                                    <button class="link-button" type="button" onclick="confirmDeleteStudyProgram(${program.id})">Delete</button>
                                    <a href="/study-program-history.html?id=${escapeHtml(String(program.id))}">History</a>
                                    <a href="/modulebook-view.html?studyProgramId=${escapeHtml(String(program.id))}">View/ Export/ Tag modulebook</a>
                                </td>
                            </tr>
                        `).join("")}
                    </tbody> 
                </table>
            `;
        }

        async function confirmDeleteStudyProgram(programId) {
            const program = studyPrograms.find(item => Number(item.id) === Number(programId));
            const label = program ? studyProgramLabel(program) : `study program ${programId}`;
            const confirmed = confirm(
                `Delete ${label}?\n\nThis will delete the study program and all related records, including modules and history.`
            );

            if (!confirmed) {
                return;
            }

            setStatus(`Deleting ${label}...`);

            try {
                await deleteStudyProgram(programId);
                studyPrograms = studyPrograms.filter(item => Number(item.id) !== Number(programId));
                renderStudyPrograms();
                studyPrograms = await loadStudyPrograms();
                modules = [];
                renderStudyPrograms();
                document.getElementById("modulesTitle").textContent = "Modules";
                document.getElementById("modules").textContent = "Open a study program to see its modules.";
                setStatus(`Deleted ${label}. Loaded ${studyPrograms.length} study programs.`);
            } catch (error) {
                setStatus("Could not delete study program: " + error.message);
            }
        }

        function selectInitialStudyProgram() {
            if (!initialStudyProgramId) {
                return false;
            }

            return studyPrograms.some(program => String(program.id) === initialStudyProgramId);
        }

        async function loadSelectedStudyProgramModules(programId) {
            const selectedProgram = studyPrograms.find(program => String(program.id) === String(programId));

            if (!selectedProgram) {
                selectedStudyProgramId = null;
                modules = [];
                document.getElementById("modulesTitle").textContent = "Modules";
                document.getElementById("modules").textContent = "Open a study program to see its modules.";
                return;
            }

            selectedStudyProgramId = String(programId);
            document.getElementById("modulesTitle").textContent =
                `${studyProgramLabel(selectedProgram)} modules`;
            setStatus("Loading modules...");

            try {
                modules = await loadModulesForStudyProgram(programId);
                renderModules();
                setStatus(`Loaded ${modules.length} modules.`);
            } catch (error) {
                setStatus("Could not load modules: " + error.message);
            }
        }

        function renderModules() {
            const container = document.getElementById("modules");

            if (modules.length === 0) {
                container.textContent = "No modules saved for this study program.";
                return;
            }

            container.innerHTML = `
                <table>
                    <thead>
                        <tr>
                            <th>Module number</th>
                            <th>Name</th>
                            <th>Credits</th>
                            <th>Module status</th>
                            <th>Actions</th>
                            <th>Module note</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${modules.map(module => `
                            <tr>
                                <td>${escapeHtml(module.moduleNumber || "")}</td>
                                <td>${escapeHtml(module.name || "")}</td>
                                <td>${escapeHtml(String(module.credits ?? ""))}</td>
                                <td>${escapeHtml(module.moduleStatus || "")}</td>
                                <td class="row-actions">
                                    <a href="/module-view.html?id=${escapeHtml(String(module.id))}">View</a>
                                    <a href="/module-edit.html?id=${escapeHtml(String(module.id))}">Edit</a>
                                    <a href="/module-versions.html?id=${escapeHtml(String(module.id))}">History</a>
                                    <button class="link-button" type="button" onclick="toggleModuleActive(${module.id})">${escapeHtml(moduleStatusActionLabel(module))}</button>
                                    <button class="link-button" type="button" onclick="confirmDeleteModule(${module.id})">Delete</button>
                                </td>
                                <td>${escapeHtml(module.moduleNote || "")}</td>
                            </tr>
                        `).join("")}
                    </tbody>
                </table>
            `;
        }

        function moduleStatusActionLabel(module) {
            return isActiveModule(module) ? "Deactivate" : "Activate";
        }

        function nextModuleStatus(module) {
            return isActiveModule(module) ? "DEACTIVE" : "ACTIVE";
        }

        function isActiveModule(module) {
            return String(module.moduleStatus || "").toUpperCase() === "ACTIVE";
        }

        async function toggleModuleActive(moduleId) {
            const module = modules.find(item => Number(item.id) === Number(moduleId));
            const targetStatus = nextModuleStatus(module || {});
            const label = module
                ? `${module.moduleNumber || ""} ${module.name || ""}`.trim()
                : `module ${moduleId}`;

            setStatus(`${moduleStatusActionLabel(module || {})} ${label}...`);

            try {
                await updateModuleStatus(moduleId, targetStatus);
                modules = await loadModulesForStudyProgram(selectedStudyProgramId);
                renderModules();
                setStatus(`${label} is now ${targetStatus}.`);
            } catch (error) {
                setStatus("Could not update module status: " + error.message);
            }
        }

        async function confirmDeleteModule(moduleId) {
            const module = modules.find(item => Number(item.id) === Number(moduleId));
            const label = module
                ? `${module.moduleNumber || ""} ${module.name || ""}`.trim()
                : `module ${moduleId}`;
            const confirmed = confirm(
                `Permanently delete ${label}?\n\nThis will delete the module and all related records, including history. This cannot be undone.`
            );

            if (!confirmed) {
                return;
            }

            setStatus(`Deleting ${label}...`);

            try {
                await deleteModule(moduleId);
                modules = await loadModulesForStudyProgram(selectedStudyProgramId);
                renderModules();
                setStatus(`Deleted ${label}. Loaded ${modules.length} modules.`);
            } catch (error) {
                setStatus("Could not delete module: " + error.message);
            }
        }

        function setStatus(message) {
            document.getElementById("status").textContent = message;
        }

        function showCreateStudyProgramPanel() {
            document.getElementById("createStudyProgramPanel").hidden = false;
            document.getElementById("newStudyProgramName").focus();
        }

        function hideCreateStudyProgramPanel() {
            document.getElementById("createStudyProgramPanel").hidden = true;
            document.getElementById("newStudyProgramName").value = "";
            document.getElementById("newDegreeType").value = "BACHELOR";
        }

        async function createNewStudyProgram() {
            const request = {
                name: document.getElementById("newStudyProgramName").value.trim(),
                degreeType: document.getElementById("newDegreeType").value
            };

            if (!request.name) {
                setStatus("Please enter a study program name.");
                document.getElementById("newStudyProgramName").focus();
                return;
            }

            setStatus("Creating study program...");

            try {
                const created = await createStudyProgram(request);
                studyPrograms = await loadStudyPrograms();
                renderStudyPrograms();
                hideCreateStudyProgramPanel();
                setStatus(`Created ${studyProgramLabel(created)}.`);
                window.history.replaceState(null, "", `/index.html?studyProgramId=${encodeURIComponent(created.id)}`);
                await loadSelectedStudyProgramModules(created.id);
            } catch (error) {
                setStatus("Could not create study program: " + error.message);
            }
        }

        function studyProgramLabel(program) {
            const suffix = degreeTypeShortLabel(program.degreeType);
            return suffix ? `${program.name || ""} (${suffix})` : (program.name || "");
        }

        function degreeTypeShortLabel(degreeType) {
            if (degreeType === "BACHELOR") {
                return "B.Sc.";
            }
            if (degreeType === "MASTER") {
                return "M.Sc.";
            }
            return "";
        }

        function degreeTypeLabel(degreeType) {
            if (degreeType === "BACHELOR") {
                return "Bachelor";
            }
            if (degreeType === "MASTER") {
                return "Master";
            }
            return degreeType || "";
        }

        init();
    </script>
</body>
</html>
