<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Modulebooks</title>
    <link rel="stylesheet" href="/app.css?v=actions-gap">
</head>
<body>
    <nav>
        <a href="/index.html">Modulebooks</a>
        <a href="#createModulebookPanel" onclick="showCreateModulebookPanel()">Create new modulebook</a>
    </nav>

    <h1>Modulebooks</h1>

    <section id="createModulebookPanel" class="commit-message-panel" hidden>
        <h2>Create new modulebook</h2>
        <label>
            Study program name
            <input id="newStudyProgramName">
        </label>
        <label>
            Degree type
            <select id="newDegreeType">
                <option value="BACHELOR">Bachelor</option>
                <option value="MASTER">Master</option>
            </select>
        </label>
        <div class="form-actions">
            <button type="button" onclick="createNewModulebook()">Create</button>
            <button type="button" onclick="hideCreateModulebookPanel()">Cancel</button>
        </div>
    </section>

    <section>
        <div id="status" class="status">Loading modulebooks...</div>
        <div id="modulebooks">Loading...</div>
    </section>

    <section>
        <h2 id="modulesTitle">Modules</h2>
        <div id="modules">Open a modulebook to see its modules.</div>
    </section>

    <script src="/api.js"></script>
    <script>
        const params = new URLSearchParams(window.location.search);
        const initialModulebookId = params.get("modulebookId");
        let selectedModulebookId = initialModulebookId;
        let modulebooks = [];
        let modules = [];

        async function init() {
            try {
                modulebooks = await loadModulebooks();
                renderModulebooks();
                if (selectInitialModulebook()) {
                    await loadSelectedModulebookModules(initialModulebookId);
                } else {
                    setStatus(`Loaded ${modulebooks.length} modulebooks.`);
                }
            } catch (error) {
                setStatus("Could not load modulebooks: " + error.message);
            }
        }

        function renderModulebooks() {
            const container = document.getElementById("modulebooks");

            if (modulebooks.length === 0) {
                container.textContent = "No modulebooks saved yet.";
                return;
            }

            container.innerHTML = `
                <table>
                    <thead>
                        <tr>
                            <th>Modulebook</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${modulebooks.map(program => `
                            <tr>
                                <td>${escapeHtml(modulebookLabel(program))}</td>
                                <td class="row-actions">
                                    <a href="/modulebook-import.html?modulebookId=${escapeHtml(String(program.id))}">Import PDF</a>
                                    <a href="/index.html?modulebookId=${escapeHtml(String(program.id))}">Show Modules</a>
                                    <a href="/module-edit.html?modulebookId=${escapeHtml(String(program.id))}">Add module</a>
                                    <button class="link-button" type="button" onclick="confirmDeleteModulebook(${program.id})">Delete</button>
                                    <a href="/modulebook-history.html?id=${escapeHtml(String(program.id))}">History & Version</a>
                                    <a href="/modulebook-view.html?modulebookId=${escapeHtml(String(program.id))}">View, Export & Save version</a>
                                </td>
                            </tr>
                        `).join("")}
                    </tbody> 
                </table>
            `;
        }

        async function confirmDeleteModulebook(modulebookId) {
            const modulebook = modulebooks.find(item => Number(item.id) === Number(modulebookId));
            const label = modulebook ? modulebookLabel(modulebook) : `modulebook ${modulebookId}`;
            const confirmed = confirm(
                `Delete ${label}?\n\nThis will delete the modulebook and all related records, including modules and history.`
            );

            if (!confirmed) {
                return;
            }

            setStatus(`Deleting ${label}...`);

            try {
                await deleteModulebook(modulebookId);
                modulebooks = modulebooks.filter(item => Number(item.id) !== Number(modulebookId));
                renderModulebooks();
                modulebooks = await loadModulebooks();
                modules = [];
                renderModulebooks();
                document.getElementById("modulesTitle").textContent = "Modules";
                document.getElementById("modules").textContent = "Open a modulebook to see its modules.";
                setStatus(`Deleted ${label}. Loaded ${modulebooks.length} modulebooks.`);
            } catch (error) {
                setStatus("Could not delete modulebook: " + error.message);
            }
        }

        function selectInitialModulebook() {
            if (!initialModulebookId) {
                return false;
            }

            return modulebooks.some(program => String(program.id) === initialModulebookId);
        }

        async function loadSelectedModulebookModules(modulebookId) {
            const selectedModulebook = modulebooks.find(modulebook => String(modulebook.id) === String(modulebookId));

            if (!selectedModulebook) {
                selectedModulebookId = null;
                modules = [];
                document.getElementById("modulesTitle").textContent = "Modules";
                document.getElementById("modules").textContent = "Open a modulebook to see its modules.";
                return;
            }

            selectedModulebookId = String(modulebookId);
            document.getElementById("modulesTitle").textContent =
                `${modulebookLabel(selectedModulebook)} modules`;
            setStatus("Loading modules...");

            try {
                modules = await loadModulesForModulebook(modulebookId);
                renderModules();
                setStatus(`Loaded ${modules.length} modules.`);
            } catch (error) {
                setStatus("Could not load modules: " + error.message);
            }
        }

        function renderModules() {
            const container = document.getElementById("modules");

            if (modules.length === 0) {
                container.textContent = "No modules saved for this modulebook.";
                return;
            }

            container.innerHTML = `
                <table>
                    <thead>
                        <tr>
                            <th>Module number</th>
                            <th>Name</th>
                            <th>Credits</th>
                            <th>Module status</th>
                            <th>Actions</th>
	                            <th>Module comments</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${modules.map(module => `
                            <tr>
                                <td>${escapeHtml(module.moduleNumber || "")}</td>
                                <td>${escapeHtml(module.name || "")}</td>
                                <td>${escapeHtml(String(module.credits ?? ""))}</td>
                                <td>${escapeHtml(module.moduleStatus || "")}</td>
                                <td class="row-actions">
                                    <a href="/module-view.html?id=${escapeHtml(String(module.id))}">View</a>
                                    <a href="/module-edit.html?id=${escapeHtml(String(module.id))}">Edit</a>
                                    <a href="/module-versions.html?id=${escapeHtml(String(module.id))}">History</a>
                                    <button class="link-button" type="button" onclick="toggleModuleActive(${module.id})">${escapeHtml(moduleStatusActionLabel(module))}</button>
                                    <button class="link-button" type="button" onclick="confirmDeleteModule(${module.id})">Delete</button>
                                </td>
                                <td>${escapeHtml(module.moduleComments || "")}</td>
                            </tr>
                        `).join("")}
                    </tbody>
                </table>
            `;
        }

        function moduleStatusActionLabel(module) {
            return isActiveModule(module) ? "Deactivate" : "Activate";
        }

        function nextModuleStatus(module) {
            return isActiveModule(module) ? "DEACTIVE" : "ACTIVE";
        }

        function isActiveModule(module) {
            return String(module.moduleStatus || "").toUpperCase() === "ACTIVE";
        }

        async function toggleModuleActive(moduleId) {
            const module = modules.find(item => Number(item.id) === Number(moduleId));
            const targetStatus = nextModuleStatus(module || {});
            const label = module
                ? `${module.moduleNumber || ""} ${module.name || ""}`.trim()
                : `module ${moduleId}`;

            setStatus(`${moduleStatusActionLabel(module || {})} ${label}...`);

            try {
                await updateModuleStatus(moduleId, targetStatus);
                modules = await loadModulesForModulebook(selectedModulebookId);
                renderModules();
                setStatus(`${label} is now ${targetStatus}.`);
            } catch (error) {
                setStatus("Could not update module status: " + error.message);
            }
        }

        async function confirmDeleteModule(moduleId) {
            const module = modules.find(item => Number(item.id) === Number(moduleId));
            const label = module
                ? `${module.moduleNumber || ""} ${module.name || ""}`.trim()
                : `module ${moduleId}`;
            const confirmation = prompt(
                `Permanently delete ${label}?\n\nThis cannot be restored from the change log. If a saved modulebook version contains this module, restoring that version can recreate it.\n\nType DELETE to confirm.`
            );

            if (confirmation !== "DELETE") {
                setStatus("Delete cancelled. Type DELETE exactly to delete a module.");
                return;
            }

            setStatus(`Deleting ${label}...`);

            try {
                await deleteModule(moduleId, confirmation);
                modules = await loadModulesForModulebook(selectedModulebookId);
                renderModules();
                setStatus(`Deleted ${label}. Loaded ${modules.length} modules.`);
            } catch (error) {
                setStatus("Could not delete module: " + error.message);
            }
        }

        function setStatus(message) {
            document.getElementById("status").textContent = message;
        }

        function showCreateModulebookPanel() {
            document.getElementById("createModulebookPanel").hidden = false;
            document.getElementById("newStudyProgramName").focus();
        }

        function hideCreateModulebookPanel() {
            document.getElementById("createModulebookPanel").hidden = true;
            document.getElementById("newStudyProgramName").value = "";
            document.getElementById("newDegreeType").value = "BACHELOR";
        }

        async function createNewModulebook() {
            const request = {
                studyProgramName: document.getElementById("newStudyProgramName").value.trim(),
                degreeType: document.getElementById("newDegreeType").value
            };

            if (!request.studyProgramName) {
                setStatus("Please enter a study program name.");
                document.getElementById("newStudyProgramName").focus();
                return;
            }

            setStatus("Creating modulebook...");

            try {
                const created = await createModulebook(request);
                modulebooks = await loadModulebooks();
                renderModulebooks();
                hideCreateModulebookPanel();
                const createdModulebook = modulebooks.find(program => Number(program.id) === Number(created.id));
                setStatus(`Created ${createdModulebook ? modulebookLabel(createdModulebook) : created.studyProgramName}.`);
                window.history.replaceState(null, "", `/index.html?modulebookId=${encodeURIComponent(created.id)}`);
                await loadSelectedModulebookModules(created.id);
            } catch (error) {
                setStatus("Could not create modulebook: " + error.message);
            }
        }

        function modulebookLabel(program) {
            const suffix = degreeTypeShortLabel(program.degreeType);
            const name = program.studyProgramName || program.name || "";
            return suffix ? `${name} (${suffix})` : name;
        }

        function degreeTypeShortLabel(degreeType) {
            if (degreeType === "BACHELOR") {
                return "B.Sc.";
            }
            if (degreeType === "MASTER") {
                return "M.Sc.";
            }
            return "";
        }

        function degreeTypeLabel(degreeType) {
            if (degreeType === "BACHELOR") {
                return "Bachelor";
            }
            if (degreeType === "MASTER") {
                return "Master";
            }
            return degreeType || "";
        }

        init();
    </script>
</body>
</html>
