<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Compare Module Changes</title>
    <link rel="stylesheet" href="/app.css">
</head>
<body>
    <nav>
        <a href="/index.html">Study programs</a>
    </nav>

    <h1>Compare Module Changes</h1>

    <section>
        <div id="status" class="status">Loading changes...</div>
        <div class="form-actions">
            <a id="historyLink" href="/index.html">Back to history</a>
            <a id="editLink" href="/index.html">Edit module</a>
        </div>
    </section>

    <section>
        <h2 id="moduleTitle">Module</h2>
        <div class="compare-controls">
            <label>
                From change set
                <select id="fromChangeSet"></select>
            </label>

            <label>
                To change set
                <select id="toChangeSet"></select>
            </label>

            <button type="button" onclick="runCompare()">Compare</button>
        </div>
    </section>

    <section>
        <h2>Differences</h2>
        <div id="diffResult">Choose two change sets to compare.</div>
    </section>

    <script src="/api.js?v=module-change-compare"></script>
    <script>
        const params = new URLSearchParams(window.location.search);
        const moduleId = params.get("id");
        const initialFrom = params.get("from");
        const initialTo = params.get("to");
        let currentModule = null;
        let teachingForms = [];
        let changeSets = [];
        let fieldChanges = [];
        let changeGroups = [];

        async function init() {
            if (!moduleId) {
                setStatus("Missing module id in URL. Example: /module-version-compare.html?id=12");
                return;
            }

            document.getElementById("historyLink").href = `/module-versions.html?id=${moduleId}`;
            document.getElementById("editLink").href = `/module-edit.html?id=${moduleId}`;

            try {
                currentModule = await loadModule(moduleId);
                [changeSets, teachingForms] = await Promise.all([
                    loadStudyProgramChangeSets(currentModule.studyProgramId),
                    loadTeachingForms()
                ]);
                fieldChanges = await loadCurrentModuleFieldChangesFromChangeSets();
                buildChangeGroups();
                renderTitle();
                renderChangeSetSelects();
                setStatus(`Loaded ${changeGroups.length} change sets.`);

                if (changeGroups.length >= 2) {
                    runCompare();
                }
            } catch (error) {
                setStatus("Could not load compare page: " + error.message);
            }
        }

        async function loadCurrentModuleFieldChangesFromChangeSets() {
            const allChanges = await Promise.all(
                changeSets.map(changeSet => loadChangeSetFieldChanges(changeSet.id))
            );

            return allChanges
                .flat()
                .filter(change => String(change.moduleId) === String(moduleId));
        }

        function buildChangeGroups() {
            const changeSetById = new Map(changeSets.map(changeSet => [Number(changeSet.id), changeSet]));
            const groupsById = new Map();

            fieldChanges.forEach(change => {
                const changeSetId = Number(change.changeSetId);
                const changeSet = changeSetById.get(changeSetId) || {
                    id: changeSetId,
                    sourceType: "UNKNOWN",
                    reason: "",
                    createdAt: change.createdAt
                };

                if (!groupsById.has(changeSetId)) {
                    groupsById.set(changeSetId, {
                        changeSet,
                        changes: []
                    });
                }
                groupsById.get(changeSetId).changes.push(change);
            });

            changeGroups = Array.from(groupsById.values()).sort((left, right) =>
                new Date(left.changeSet.createdAt || 0) - new Date(right.changeSet.createdAt || 0)
            );
        }

        function renderTitle() {
            const number = currentModule.moduleNumber || currentModule.id;
            const name = currentModule.name || "Untitled module";
            document.getElementById("moduleTitle").textContent = `${number} - ${name}`;
        }

        function renderChangeSetSelects() {
            const fromSelect = document.getElementById("fromChangeSet");
            const toSelect = document.getElementById("toChangeSet");

            if (changeGroups.length < 2) {
                fromSelect.innerHTML = "";
                toSelect.innerHTML = "";
                document.getElementById("diffResult").textContent =
                    "At least two change sets are needed for comparison.";
                return;
            }

            const options = changeGroups.map(group => {
                const changeSet = group.changeSet;
                return `
                    <option value="${escapeHtml(String(changeSet.id))}">
                        ${escapeHtml(String(changeSet.id))} - ${escapeHtml(formatDate(changeSet.createdAt))}
                    </option>
                `;
            }).join("");

            fromSelect.innerHTML = options;
            toSelect.innerHTML = options;

            fromSelect.value = initialFrom || String(changeGroups[0].changeSet.id);
            toSelect.value = initialTo || String(changeGroups[changeGroups.length - 1].changeSet.id);
        }

        function runCompare() {
            const fromChangeSetId = document.getElementById("fromChangeSet").value;
            const toChangeSetId = document.getElementById("toChangeSet").value;

            if (!fromChangeSetId || !toChangeSetId) {
                return;
            }

            const diff = compareChangeRange(fromChangeSetId, toChangeSetId);
            renderDiff(diff, fromChangeSetId, toChangeSetId);
            setStatus(`Found ${diff.length} changed fields.`);
        }

        function compareChangeRange(fromChangeSetId, toChangeSetId) {
            const fromIndex = changeGroups.findIndex(group => String(group.changeSet.id) === String(fromChangeSetId));
            const toIndex = changeGroups.findIndex(group => String(group.changeSet.id) === String(toChangeSetId));

            if (fromIndex < 0 || toIndex < 0) {
                return [];
            }

            const start = Math.min(fromIndex, toIndex);
            const end = Math.max(fromIndex, toIndex);
            const selectedChanges = changeGroups
                .slice(start, end + 1)
                .flatMap(group => group.changes)
                .sort((left, right) =>
                    new Date(left.createdAt || 0) - new Date(right.createdAt || 0)
                    || Number(left.id) - Number(right.id)
                );
            const byField = new Map();

            selectedChanges.forEach(change => {
                const existing = byField.get(change.fieldPath);
                if (!existing) {
                    byField.set(change.fieldPath, {
                        path: change.fieldPath,
                        oldValue: change.oldValue,
                        newValue: change.newValue
                    });
                    return;
                }
                existing.newValue = change.newValue;
            });

            return Array.from(byField.values()).sort((left, right) =>
                left.path.localeCompare(right.path)
            );
        }

        function renderDiff(changes, fromChangeSetId, toChangeSetId) {
            const container = document.getElementById("diffResult");

            if (changes.length === 0) {
                container.textContent = "No differences found.";
                return;
            }

            container.innerHTML = `
                <table>
                    <thead>
                        <tr>
                            <th>Field</th>
                            <th>Change set ${escapeHtml(String(fromChangeSetId))}</th>
                            <th>Change set ${escapeHtml(String(toChangeSetId))}</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${changes.map(change => `
                            <tr>
                                <td>${escapeHtml(readablePath(change.path))}</td>
                                <td class="diff-old">${highlightOldValue(formatFieldChangeValue(change.path, change.oldValue), formatFieldChangeValue(change.path, change.newValue))}</td>
                                <td class="diff-new">${highlightNewValue(formatFieldChangeValue(change.path, change.oldValue), formatFieldChangeValue(change.path, change.newValue))}</td>
                            </tr>
                        `).join("")}
                    </tbody>
                </table>
            `;
        }

        function formatJsonValue(value) {
            if (value === null || value === undefined) {
                return "";
            }

            try {
                const parsed = JSON.parse(value);
                if (parsed === null) {
                    return "";
                }
                if (typeof parsed === "string" || typeof parsed === "number" || typeof parsed === "boolean") {
                    return String(parsed);
                }
                return JSON.stringify(parsed, null, 2);
            } catch (error) {
                return String(value);
            }
        }

        function formatFieldChangeValue(fieldPath, value) {
            if (fieldPath === "teachingFormIds") {
                return teachingFormLabelsForJsonValue(value);
            }

            return formatJsonValue(value);
        }

        function teachingFormLabelsForJsonValue(value) {
            const parsed = parseJsonValue(value);
            const ids = Array.isArray(parsed) ? parsed : [];
            return normalizedTeachingFormIds(ids)
                .map(id => {
                    const teachingForm = teachingForms.find(option => Number(option.id) === id);
                    return teachingForm ? teachingFormLabel(teachingForm) : `Teaching form ${id}`;
                })
                .join(", ");
        }

        function parseJsonValue(value) {
            if (value === null || value === undefined) {
                return null;
            }

            try {
                return JSON.parse(value);
            } catch (error) {
                return value;
            }
        }

        function normalizedTeachingFormIds(ids) {
            return (ids || [])
                .map(Number)
                .filter(Number.isFinite)
                .sort((left, right) => left - right);
        }

        function teachingFormLabel(teachingForm) {
            const label = teachingForm.labelDe || teachingForm.labelEn || "";
            return label ? `${teachingForm.code} - ${label}` : teachingForm.code;
        }

        function highlightOldValue(oldValue, newValue) {
            const diffParts = diffText(String(oldValue ?? ""), String(newValue ?? ""));
            return diffParts
                .filter(part => part.type !== "added")
                .map(part => part.type === "removed"
                    ? `<mark class="diff-removed">${escapeHtml(part.text)}</mark>`
                    : escapeHtml(part.text)
                )
                .join("");
        }

        function highlightNewValue(oldValue, newValue) {
            const diffParts = diffText(String(oldValue ?? ""), String(newValue ?? ""));
            return diffParts
                .filter(part => part.type !== "removed")
                .map(part => part.type === "added"
                    ? `<mark class="diff-added">${escapeHtml(part.text)}</mark>`
                    : escapeHtml(part.text)
                )
                .join("");
        }

        function diffText(oldText, newText) {
            if (oldText === newText) {
                return [{ type: "same", text: oldText }];
            }

            const oldTokens = tokenize(oldText);
            const newTokens = tokenize(newText);
            const table = buildLcsTable(oldTokens, newTokens);
            const parts = [];
            let oldIndex = 0;
            let newIndex = 0;

            while (oldIndex < oldTokens.length && newIndex < newTokens.length) {
                if (oldTokens[oldIndex] === newTokens[newIndex]) {
                    parts.push({ type: "same", text: oldTokens[oldIndex] });
                    oldIndex++;
                    newIndex++;
                } else if (table[oldIndex + 1][newIndex] >= table[oldIndex][newIndex + 1]) {
                    parts.push({ type: "removed", text: oldTokens[oldIndex] });
                    oldIndex++;
                } else {
                    parts.push({ type: "added", text: newTokens[newIndex] });
                    newIndex++;
                }
            }

            while (oldIndex < oldTokens.length) {
                parts.push({ type: "removed", text: oldTokens[oldIndex] });
                oldIndex++;
            }

            while (newIndex < newTokens.length) {
                parts.push({ type: "added", text: newTokens[newIndex] });
                newIndex++;
            }

            return mergeAdjacentParts(parts);
        }

        function tokenize(text) {
            return text.match(/(\s+|[A-Za-z0-9_ÄÖÜäöüß]+|[^\sA-Za-z0-9_ÄÖÜäöüß])/g) || [];
        }

        function buildLcsTable(oldTokens, newTokens) {
            const table = Array.from(
                { length: oldTokens.length + 1 },
                () => Array(newTokens.length + 1).fill(0)
            );

            for (let oldIndex = oldTokens.length - 1; oldIndex >= 0; oldIndex--) {
                for (let newIndex = newTokens.length - 1; newIndex >= 0; newIndex--) {
                    table[oldIndex][newIndex] = oldTokens[oldIndex] === newTokens[newIndex]
                        ? table[oldIndex + 1][newIndex + 1] + 1
                        : Math.max(table[oldIndex + 1][newIndex], table[oldIndex][newIndex + 1]);
                }
            }

            return table;
        }

        function mergeAdjacentParts(parts) {
            return parts.reduce((merged, part) => {
                const previous = merged[merged.length - 1];
                if (previous && previous.type === part.type) {
                    previous.text += part.text;
                } else {
                    merged.push({ ...part });
                }
                return merged;
            }, []);
        }

        function readablePath(path) {
            return String(path || "")
                .replace(/^module\./, "")
                .replaceAll(".", " / ");
        }

        function formatDate(value) {
            if (!value) {
                return "";
            }

            return new Date(value).toLocaleString();
        }

        function setStatus(message) {
            document.getElementById("status").textContent = message;
        }

        init();
    </script>
</body>
</html>
