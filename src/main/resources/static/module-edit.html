<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title id="documentTitle">Edit Module</title>
    <link rel="stylesheet" href="/app.css?v=module-field-table">
</head>
<body>
    <nav>
        <a href="/index.html">Study programs</a>
    </nav>

    <h1 id="pageTitle">Edit Module</h1>

    <section>
        <div id="status" class="status">Loading module...</div>

        <form id="moduleForm" onsubmit="saveModule(event)" hidden>
            <div class="form-actions">
                <button type="submit">Save</button>
                <button id="deleteButton" type="button" onclick="deleteCurrentModule()">Delete</button>
                <a id="versionsLink" href="/index.html">History</a>
                <a id="backLink" href="/index.html">Back to study program</a>
            </div>

            <section id="commitMessagePanel" class="commit-message-panel" hidden>
                <label>
                    Commit message
                    <textarea id="versionReason" rows="3" maxlength="500"></textarea>
                </label>
                <div class="form-actions">
                    <button type="button" onclick="confirmSaveModule()">Confirm save</button>
                    <button type="button" onclick="cancelSaveModule()">Cancel</button>
                </div>
            </section>

            <div class="module-field-table">
                <div class="module-field-row">
                    <div class="module-field-label">Study program</div>
                    <div class="module-field-control">
                        <div id="studyProgramDisplay" class="readonly-value">Loading...</div>
                        <input id="studyProgramId" type="hidden">
                    </div>
                </div>

                <div class="module-field-row">
                    <div class="module-field-label">Module id (debug)</div>
                    <div class="module-field-control">
                        <div id="moduleIdDisplay" class="readonly-value">Loading...</div>
                        <input id="modulebookId" type="hidden">
                    </div>
                </div>

                <div class="module-field-row">
                    <label class="module-field-label" for="moduleNumber">Module number</label>
                    <div class="module-field-control">
                        <input id="moduleNumber" required maxlength="50" placeholder="B01" oninput="updateModuleNumberWarning()">
                        <span id="moduleNumberWarning" class="field-warning" hidden>
                            Usually only uppercase letters and numbers, for example B01.
                        </span>
                    </div>
                </div>

                <div class="module-field-row">
                    <label class="module-field-label" for="name">Title</label>
                    <div class="module-field-control">
                        <input id="name" required maxlength="255" placeholder="Einführung in die Informatik">
                    </div>
                </div>

                <div class="module-field-row">
                    <label class="module-field-label" for="credits">Credits</label>
                    <div class="module-field-control">
                        <input id="credits" type="number" step="0.5" required oninput="updateWorkloadPreview()">
                    </div>
                </div>

                <div class="module-field-row">
                    <div class="module-field-label">Workload</div>
                    <div class="module-field-control">
                        <section class="workload-editor">
                            <div id="workloadComponents"></div>
                            <button type="button" onclick="addWorkloadRow()">+ Lehrveranstaltung hinzufügen</button>

                            <div class="workload-summary">
                                <label>
                                    Präsenzstunden
                                    <input id="workloadPresenceHours" type="number" step="1" oninput="updateWorkloadPreview()">
                                    <span id="workloadPresenceHint" class="field-hint"></span>
                                </label>

                                <label>
                                    Selbststudium
                                    <input id="workloadSelfStudyHours" type="number" step="1" oninput="updateWorkloadPreview()">
                                    <span id="workloadSelfStudyHint" class="field-hint"></span>
                                </label>
                            </div>

                            <div id="workloadPreview" class="workload-preview"></div>
                        </section>
                    </div>
                </div>

                <div class="module-field-row">
                    <div class="module-field-label">Teaching forms</div>
                    <div class="module-field-control">
                        <section class="module-teaching-forms">
                            <div id="moduleTeachingForms" class="checkbox-list"></div>
                        </section>
                    </div>
                </div>

                <div class="module-field-row">
                    <label class="module-field-label" for="moduleType">Module type</label>
                    <div class="module-field-control">
                        <input id="moduleType">
                    </div>
                </div>

                <div class="module-field-row">
                    <label class="module-field-label" for="coordinator">Coordinator</label>
                    <div class="module-field-control">
                        <input id="coordinator">
                    </div>
                </div>

                <div class="module-field-row">
                    <label class="module-field-label" for="applicability">Applicability</label>
                    <div class="module-field-control">
                        <textarea id="applicability" rows="4"></textarea>
                    </div>
                </div>

                <div class="module-field-row">
                    <label class="module-field-label" for="learningArea">Learning area</label>
                    <div class="module-field-control">
                        <input id="learningArea">
                    </div>
                </div>

                <div class="module-field-row">
                    <label class="module-field-label" for="learningObjectives">Learning objectives</label>
                    <div class="module-field-control">
                        <textarea id="learningObjectives" rows="6"></textarea>
                    </div>
                </div>

                <div class="module-field-row">
                    <label class="module-field-label" for="prerequisites">Prerequisites</label>
                    <div class="module-field-control">
                        <textarea id="prerequisites" rows="4"></textarea>
                    </div>
                </div>

                <div class="module-field-row">
                    <label class="module-field-label" for="level">Level</label>
                    <div class="module-field-control">
                        <input id="level">
                    </div>
                </div>

                <div class="module-field-row">
                    <label class="module-field-label" for="moduleStatus">Module status (debug)</label>
                    <div class="module-field-control">
                        <input id="moduleStatus">
                    </div>
                </div>

                <div class="module-field-row">
                    <label class="module-field-label" for="frequency">Frequency</label>
                    <div class="module-field-control">
                        <input id="frequency">
                    </div>
                </div>

                <div class="module-field-row">
                    <label class="module-field-label" for="examinationForm">Examination form</label>
                    <div class="module-field-control">
                        <textarea id="examinationForm" rows="5"></textarea>
                    </div>
                </div>

                <div class="module-field-row">
                    <label class="module-field-label" for="contents">Contents</label>
                    <div class="module-field-control">
                        <textarea id="contents" rows="8"></textarea>
                    </div>
                </div>

                <div class="module-field-row">
                    <label class="module-field-label" for="literature">Literature</label>
                    <div class="module-field-control">
                        <textarea id="literature" rows="6"></textarea>
                    </div>
                </div>

                <div class="module-field-row">
                    <label class="module-field-label" for="additionalNotes">Additional notes</label>
                    <div class="module-field-control">
                        <textarea id="additionalNotes" rows="4"></textarea>
                    </div>
                </div>

                <div class="module-field-row">
                    <label class="module-field-label" for="moduleWeight">Module weight</label>
                    <div class="module-field-control">
                        <input id="moduleWeight" type="number" step="0.01">
                    </div>
                </div>

            </div>
        </form>
    </section>

    <script src="/api.js?v=add-module"></script>
    <script>
        const params = new URLSearchParams(window.location.search);
        const moduleId = params.get("id");
        const studyProgramId = params.get("studyProgramId");
        const isCreateMode = !moduleId;
        const weeksPerSemester = 17;
        const hoursPerCredit = 30;
        let currentModule = null;
        let studyPrograms = [];
        let teachingForms = [];
        let extraTeachingFormIds = new Set();
        let excludedWorkloadTeachingFormIds = new Set();
        let pendingModuleRequest = null;

        async function init() {
            if (isCreateMode && !studyProgramId) {
                setStatus("Missing study program id in URL. Example: /module-edit.html?studyProgramId=3");
                return;
            }

            try {
                [studyPrograms, teachingForms] = await Promise.all([
                    loadStudyPrograms(),
                    loadTeachingForms()
                ]);

                if (isCreateMode) {
                    prepareCreateForm();
                } else {
                    currentModule = await loadModule(moduleId);
                    fillForm(currentModule);
                }

                document.getElementById("moduleForm").hidden = false;
            } catch (error) {
                setStatus("Could not load page data: " + error.message);
            }
        }

        function prepareCreateForm() {
            document.getElementById("pageTitle").textContent = "Add New Module";
            document.getElementById("documentTitle").textContent = "Add New Module";
            document.getElementById("deleteButton").hidden = true;
            document.getElementById("versionsLink").hidden = true;
            document.getElementById("studyProgramId").value = studyProgramId;
            renderStudyProgramDisplay(studyProgramId);
            renderModuleIdDisplay(null);
            document.getElementById("backLink").href = `/index.html?studyProgramId=${studyProgramId}`;
            fillWorkloadRows([]);
            renderModuleTeachingForms();
            updateWorkloadPreview();
            document.getElementById("moduleStatus").value = "ACTIVE";
            setStatus("Creating a new module.");
        }

        function fillForm(module) {
            document.getElementById("pageTitle").textContent = "Edit Module";
            document.getElementById("documentTitle").textContent = "Edit Module";
            document.getElementById("studyProgramId").value = module.studyProgramId ?? "";
            renderStudyProgramDisplay(module.studyProgramId);
            renderModuleIdDisplay(module.id);
            document.getElementById("modulebookId").value = module.modulebookId ?? "";
            document.getElementById("moduleNumber").value = module.moduleNumber || "";
            document.getElementById("name").value = module.name || "";
            document.getElementById("credits").value = module.credits ?? "";
            document.getElementById("workloadPresenceHours").value = module.workload?.presenceHours ?? "";
            document.getElementById("workloadSelfStudyHours").value = module.workload?.selfStudyHours ?? "";
            fillWorkloadRows(module.workload?.components || []);
            setExtraTeachingForms(module);
            renderModuleTeachingForms();
            updateWorkloadPreview();
            document.getElementById("moduleType").value = module.moduleType || "";
            document.getElementById("coordinator").value = module.coordinator || "";
            document.getElementById("applicability").value = module.applicability || "";
            document.getElementById("learningArea").value = module.learningArea || "";
            document.getElementById("learningObjectives").value = module.learningObjectives || "";
            document.getElementById("prerequisites").value = module.prerequisites || "";
            document.getElementById("level").value = module.level || "";
            document.getElementById("moduleStatus").value = module.moduleStatus || "";
            document.getElementById("frequency").value = module.frequency || "";
            document.getElementById("examinationForm").value = module.examinationForm || "";
            document.getElementById("contents").value = module.contents || "";
            document.getElementById("literature").value = module.literature || "";
            document.getElementById("additionalNotes").value = module.additionalNotes || "";
            document.getElementById("moduleWeight").value = module.moduleWeight ?? "";

            if (module.studyProgramId) {
                document.getElementById("backLink").href = `/index.html?studyProgramId=${module.studyProgramId}`;
            }
            document.getElementById("versionsLink").href = `/module-versions.html?id=${module.id}`;
            setStatus(`Loaded module ${module.id}.`);
        }

        function renderStudyProgramDisplay(selectedStudyProgramId) {
            const selectedProgram = studyPrograms.find(program =>
                String(program.id) === String(selectedStudyProgramId)
            );

            document.getElementById("studyProgramDisplay").textContent = selectedProgram
                ? studyProgramLabel(selectedProgram)
                : `Study program ${selectedStudyProgramId}`;
        }

        function studyProgramLabel(program) {
            const suffix = degreeTypeShortLabel(program.degreeType);
            return suffix ? `${program.name || ""} (${suffix})` : (program.name || "");
        }

        function degreeTypeShortLabel(degreeType) {
            if (degreeType === "BACHELOR") {
                return "B.Sc.";
            }
            if (degreeType === "MASTER") {
                return "M.Sc.";
            }
            return "";
        }

        function renderModuleIdDisplay(id) {
            document.getElementById("moduleIdDisplay").textContent = id ?? "New module";
        }

        function fillWorkloadRows(components) {
            const container = document.getElementById("workloadComponents");
            container.innerHTML = "";

            if (components.length === 0) {
                addWorkloadRow();
                return;
            }

            components.forEach(component => {
                addWorkloadRow(component.teachingFormId, component.swsAmount);
            });
        }

        function setExtraTeachingForms(module) {
            const workloadTeachingFormIds = new Set(
                (module.workload?.components || [])
                    .map(component => Number(component.teachingFormId))
                    .filter(Number.isFinite)
            );

            extraTeachingFormIds = new Set(
                (module.teachingForms || [])
                    .map(teachingForm => Number(teachingForm.id))
                    .filter(id => Number.isFinite(id) && !workloadTeachingFormIds.has(id))
            );
            excludedWorkloadTeachingFormIds = new Set();
        }

        function addWorkloadRow(teachingFormId = "", swsAmount = "") {
            const container = document.getElementById("workloadComponents");
            const row = document.createElement("div");
            row.className = "workload-row";
            row.innerHTML = `
                <label>
                    Typ
                    <select class="workloadTeachingForm" onchange="onWorkloadChanged()">
                        <option value="">Bitte wählen</option>
                        ${teachingForms.map(teachingForm => `
                            <option value="${teachingForm.id}">
                                ${escapeHtml(teachingFormLabel(teachingForm))}
                            </option>
                        `).join("")}
                    </select>
                </label>
                <label>
                    SWS
                    <input class="workloadSws" type="number" step="0.5" min="0" oninput="onWorkloadChanged()">
                </label>
                <button type="button" onclick="removeWorkloadRow(this)">Entfernen</button>
            `;

            container.appendChild(row);
            row.querySelector(".workloadTeachingForm").value = teachingFormId ?? "";
            row.querySelector(".workloadSws").value = swsAmount ?? "";
            onWorkloadChanged();
        }

        function removeWorkloadRow(button) {
            button.closest(".workload-row").remove();
            if (document.querySelectorAll(".workload-row").length === 0) {
                addWorkloadRow();
                return;
            }
            onWorkloadChanged();
        }

        function onWorkloadChanged() {
            renderModuleTeachingForms();
            updateWorkloadPreview();
        }

        function renderModuleTeachingForms() {
            const container = document.getElementById("moduleTeachingForms");
            const workloadTeachingFormIds = workloadTeachingFormIdsSet();

            container.innerHTML = teachingForms.map(teachingForm => {
                const id = Number(teachingForm.id);
                const requiredByWorkload = workloadTeachingFormIds.has(id);
                const checked = requiredByWorkload
                    ? !excludedWorkloadTeachingFormIds.has(id)
                    : extraTeachingFormIds.has(id);
                const checkedAttribute = checked ? "checked" : "";

                return `
                    <label>
                        <input
                            type="checkbox"
                            class="moduleTeachingForm"
                            value="${id}"
                            ${checkedAttribute}
                            onchange="onModuleTeachingFormChanged(this)"
                        >
                        ${escapeHtml(teachingFormLabel(teachingForm))}
                    </label>
                `;
            }).join("");
        }

        function onModuleTeachingFormChanged(checkbox) {
            const id = Number(checkbox.value);
            const requiredByWorkload = workloadTeachingFormIdsSet().has(id);

            if (requiredByWorkload) {
                if (checkbox.checked) {
                    excludedWorkloadTeachingFormIds.delete(id);
                } else {
                    excludedWorkloadTeachingFormIds.add(id);
                }
                return;
            }

            if (checkbox.checked) {
                extraTeachingFormIds.add(id);
            } else {
                extraTeachingFormIds.delete(id);
            }
        }

        function collectWorkloadComponents() {
            return Array.from(document.querySelectorAll(".workload-row"))
                .map(row => ({
                    teachingFormId: numberOrNull(row.querySelector(".workloadTeachingForm").value),
                    swsAmount: numberOrNull(row.querySelector(".workloadSws").value)
                }))
                .filter(component => component.teachingFormId !== null && component.swsAmount !== null);
        }

        function collectModuleTeachingFormIds() {
            return Array.from(document.querySelectorAll(".moduleTeachingForm"))
                .filter(checkbox => checkbox.checked)
                .map(checkbox => Number(checkbox.value));
        }

        function workloadTeachingFormIdsSet() {
            return new Set(
                collectWorkloadComponents()
                    .map(component => Number(component.teachingFormId))
                    .filter(Number.isFinite)
            );
        }

        function updateWorkloadPreview() {
            const credits = numberOrNull(document.getElementById("credits").value);
            const components = collectWorkloadComponents();
            const calculatedPresenceHours = components.reduce(
                (sum, component) => sum + component.swsAmount * weeksPerSemester,
                0
            );
            const presenceHours = numberOrNull(document.getElementById("workloadPresenceHours").value);
            const selfStudyHours = numberOrNull(document.getElementById("workloadSelfStudyHours").value);
            const totalWorkload = credits === null ? null : credits * hoursPerCredit;
            const calculatedSelfStudyHours = totalWorkload === null ? null : totalWorkload - calculatedPresenceHours;

            document.getElementById("workloadPresenceHint").textContent =
                `Hinweis: ${formatNumber(calculatedPresenceHours)} Stunden nach SWS`;
            document.getElementById("workloadSelfStudyHint").textContent =
                calculatedSelfStudyHours === null ? "" : `Hinweis: ${formatNumber(calculatedSelfStudyHours)} Stunden nach CP und Präsenz`;
            document.getElementById("workloadPreview").textContent = workloadPreviewText(
                components,
                presenceHours,
                selfStudyHours
            );
        }

        function workloadPreviewText(components, presenceHours, selfStudyHours) {
            const parts = components.map(component => {
                const teachingForm = teachingForms.find(option => Number(option.id) === Number(component.teachingFormId));
                return `${formatNumber(component.swsAmount)} SWS ${teachingForm?.code || ""}`.trim();
            });

            const workloadPart = parts.length > 0 ? ` (${parts.join(" + ")})` : "";
            const presencePart = presenceHours === null ? "" : `${formatNumber(presenceHours)} Stunden Präsenz`;
            const selfStudyPart = selfStudyHours === null ? "" : `, ${formatNumber(selfStudyHours)} Stunden Selbststudium`;
            return `${presencePart}${workloadPart}${selfStudyPart}`.trim();
        }

        function teachingFormLabel(teachingForm) {
            const label = teachingForm.labelDe || teachingForm.labelEn || "";
            return label ? `${teachingForm.code} - ${label}` : teachingForm.code;
        }

        async function saveModule(event) {
            event.preventDefault();
            pendingModuleRequest = buildModuleRequest();
            document.getElementById("versionReason").value = isCreateMode
                ? "created module manually"
                : buildChangeMessage(currentModule, pendingModuleRequest);
            document.getElementById("commitMessagePanel").hidden = false;
            document.getElementById("versionReason").focus();
            setStatus("Review the commit message, then confirm save.");
        }

        function buildModuleRequest() {

            const moduleNumber = document.getElementById("moduleNumber").value.trim();
            const name = document.getElementById("name").value.trim();
            const workloadRequest = buildWorkloadRequest();

            const request = {
                studyProgramId: numberOrNull(document.getElementById("studyProgramId").value),
                moduleNumber: moduleNumber,
                name: name,
                titleDe: currentModule?.titleDe || "",
                titleEn: currentModule?.titleEn || "",
                credits: numberOrNull(document.getElementById("credits").value),
                teachingFormIds: normalizedTeachingFormIds(collectModuleTeachingFormIds()),
                workload: workloadRequest,
                description: currentModule?.description || "",

                modulebookId: numberOrNull(document.getElementById("modulebookId").value),
                moduleType: document.getElementById("moduleType").value.trim(),
                coordinator: document.getElementById("coordinator").value.trim(),
                applicability: document.getElementById("applicability").value.trim(),
                learningArea: document.getElementById("learningArea").value.trim(),
                learningObjectives: document.getElementById("learningObjectives").value.trim(),
                prerequisites: document.getElementById("prerequisites").value.trim(),
                level: document.getElementById("level").value.trim(),
                moduleStatus: document.getElementById("moduleStatus").value.trim(),
                frequency: document.getElementById("frequency").value.trim(),
                examinationForm: document.getElementById("examinationForm").value.trim(),
                contents: document.getElementById("contents").value.trim(),
                literature: document.getElementById("literature").value.trim(),
                additionalNotes: document.getElementById("additionalNotes").value.trim(),
                moduleWeight: numberOrNull(document.getElementById("moduleWeight").value)
            };

            if (!isCreateMode) {
                request.changedFieldPaths = changedFieldPathsForRequest(request);
                if (!request.changedFieldPaths.includes("workload")) {
                    delete request.workload;
                }
                if (!request.changedFieldPaths.includes("teachingFormIds")) {
                    delete request.teachingFormIds;
                }
            }

            return request;
        }

        function buildWorkloadRequest() {
            return {
                components: collectWorkloadComponents(),
                presenceHours: numberOrNull(document.getElementById("workloadPresenceHours").value),
                selfStudyHours: numberOrNull(document.getElementById("workloadSelfStudyHours").value),
                rawText: currentModule?.workload?.rawText || ""
            };
        }

        function changedFieldPathsForRequest(request) {
            if (!currentModule) {
                return [];
            }

            const fieldMappings = [
                ["module.moduleNumber", currentModule.moduleNumber, request.moduleNumber],
                ["module.name", currentModule.name, request.name],
                ["module.credits", currentModule.credits, request.credits],
                ["module.moduleType", currentModule.moduleType, request.moduleType],
                ["module.titleDe", currentModule.titleDe, request.titleDe],
                ["module.titleEn", currentModule.titleEn, request.titleEn],
                ["module.coordinator", currentModule.coordinator, request.coordinator],
                ["module.applicability", currentModule.applicability, request.applicability],
                ["module.learningArea", currentModule.learningArea, request.learningArea],
                ["module.learningObjectives", currentModule.learningObjectives, request.learningObjectives],
                ["module.prerequisites", currentModule.prerequisites, request.prerequisites],
                ["module.level", currentModule.level, request.level],
                ["module.moduleStatus", currentModule.moduleStatus, request.moduleStatus],
                ["module.frequency", currentModule.frequency, request.frequency],
                ["module.examinationForm", currentModule.examinationForm, request.examinationForm],
                ["module.contents", currentModule.contents, request.contents],
                ["module.literature", currentModule.literature, request.literature],
                ["module.additionalNotes", currentModule.additionalNotes, request.additionalNotes],
                ["module.moduleWeight", currentModule.moduleWeight, request.moduleWeight]
            ];

            const changedPaths = fieldMappings
                .filter(([, oldValue, newValue]) => comparableText(oldValue) !== comparableText(newValue))
                .map(([fieldPath]) => fieldPath);

            if (comparableText(workloadComparableValue(currentModule.workload)) !== comparableText(workloadComparableValue(request.workload))) {
                changedPaths.push("workload");
            }

            if (comparableText(teachingFormIdsForModule(currentModule)) !== comparableText(normalizedTeachingFormIds(request.teachingFormIds))) {
                changedPaths.push("teachingFormIds");
            }

            return changedPaths;
        }

        async function confirmSaveModule() {
            if (!pendingModuleRequest) {
                return;
            }

            const versionReason = document.getElementById("versionReason").value.trim();
            if (!versionReason) {
                setStatus("Commit message is required.");
                document.getElementById("versionReason").focus();
                return;
            }

            const request = {
                ...pendingModuleRequest,
                versionReason: versionReason
            };

            setStatus(isCreateMode ? "Creating module..." : "Saving module...");

            try {
                currentModule = isCreateMode
                    ? await createModule(request)
                    : await updateModule(moduleId, request);
                window.location.href = `/module-versions.html?id=${currentModule.id}`;
            } catch (error) {
                setStatus((isCreateMode ? "Create" : "Save") + " failed: " + error.message);
            }
        }

        function cancelSaveModule() {
            pendingModuleRequest = null;
            document.getElementById("commitMessagePanel").hidden = true;
            setStatus(isCreateMode ? "Creating a new module." : `Loaded module ${currentModule.id}.`);
        }

        function buildChangeMessage(oldModule, request) {
            const changedPaths = new Set(request.changedFieldPaths || []);
            const changes = [
                changeMessagePart("module number", oldModule.moduleNumber, request.moduleNumber, "module.moduleNumber", changedPaths),
                changeMessagePart("title", oldModule.name, request.name, "module.name", changedPaths),
                changeMessagePart("credits", oldModule.credits, request.credits, "module.credits", changedPaths),
                changeMessagePart("module type", oldModule.moduleType, request.moduleType, "module.moduleType", changedPaths),
                changeMessagePart("coordinator", oldModule.coordinator, request.coordinator, "module.coordinator", changedPaths),
                changeMessagePart("applicability", oldModule.applicability, request.applicability, "module.applicability", changedPaths),
                changeMessagePart("learning area", oldModule.learningArea, request.learningArea, "module.learningArea", changedPaths),
                changeMessagePart("learning objectives", oldModule.learningObjectives, request.learningObjectives, "module.learningObjectives", changedPaths),
                changeMessagePart("prerequisites", oldModule.prerequisites, request.prerequisites, "module.prerequisites", changedPaths),
                changeMessagePart("level", oldModule.level, request.level, "module.level", changedPaths),
                changeMessagePart("module status", oldModule.moduleStatus, request.moduleStatus, "module.moduleStatus", changedPaths),
                changeMessagePart("frequency", oldModule.frequency, request.frequency, "module.frequency", changedPaths),
                changeMessagePart("examination form", oldModule.examinationForm, request.examinationForm, "module.examinationForm", changedPaths),
                changeMessagePart("contents", oldModule.contents, request.contents, "module.contents", changedPaths),
                changeMessagePart("literature", oldModule.literature, request.literature, "module.literature", changedPaths),
                changeMessagePart("additional notes", oldModule.additionalNotes, request.additionalNotes, "module.additionalNotes", changedPaths),
                changeMessagePart("module weight", oldModule.moduleWeight, request.moduleWeight, "module.moduleWeight", changedPaths),
                teachingFormsChangeMessagePart(
                    "teaching forms",
                    teachingFormIdsForModule(oldModule),
                    normalizedTeachingFormIds(request.teachingFormIds),
                    "teachingFormIds",
                    changedPaths
                ),
                changeMessagePart(
                    "workload",
                    workloadComparableValue(oldModule.workload),
                    workloadComparableValue(request.workload),
                    "workload",
                    changedPaths
                )
            ].filter(Boolean);

            return changes.length > 0 ? changes.join("; ") : "updated module without field changes";
        }

        function changeMessagePart(label, oldValue, newValue, fieldPath, changedPaths) {
            if (changedPaths && !changedPaths.has(fieldPath)) {
                return "";
            }

            const oldText = comparableText(oldValue);
            const newText = comparableText(newValue);

            if (oldText === newText) {
                return "";
            }

            return `changed ${label} from ${displayValue(oldText)} to ${displayValue(newText)}`;
        }

        function teachingFormsChangeMessagePart(label, oldIds, newIds, fieldPath, changedPaths) {
            if (changedPaths && !changedPaths.has(fieldPath)) {
                return "";
            }

            const normalizedOldIds = normalizedTeachingFormIds(oldIds);
            const normalizedNewIds = normalizedTeachingFormIds(newIds);

            if (comparableText(normalizedOldIds) === comparableText(normalizedNewIds)) {
                return "";
            }

            return `changed ${label} from ${displayValue(teachingFormLabelsForIds(normalizedOldIds))} to ${displayValue(teachingFormLabelsForIds(normalizedNewIds))}`;
        }

        function teachingFormIdsForModule(module) {
            return normalizedTeachingFormIds((module.teachingForms || [])
                .map(teachingForm => Number(teachingForm.id))
            );
        }

        function normalizedTeachingFormIds(ids) {
            return (ids || [])
                .map(Number)
                .filter(Number.isFinite)
                .sort((left, right) => left - right);
        }

        function teachingFormLabelsForIds(ids) {
            const labels = normalizedTeachingFormIds(ids).map(id => {
                const teachingForm = teachingForms.find(option => Number(option.id) === id);
                return teachingForm ? teachingFormLabel(teachingForm) : `Teaching form ${id}`;
            });
            return labels.join(", ");
        }

        function workloadComparableValue(workload) {
            if (!workload) {
                return [];
            }

            return (workload.components || [])
                .map(component => ({
                    teachingFormId: component.teachingFormId,
                    swsAmount: component.swsAmount
                }))
                .sort((left, right) => {
                    const leftId = Number(left.teachingFormId) || 0;
                    const rightId = Number(right.teachingFormId) || 0;
                    return leftId - rightId;
                });
        }

        function comparableText(value) {
            if (Array.isArray(value) || (value && typeof value === "object")) {
                return JSON.stringify(value);
            }

            return String(value ?? "").trim();
        }

        function displayValue(value) {
            if (!value) {
                return "\"\"";
            }

            const shortValue = value.length > 80 ? `${value.slice(0, 77)}...` : value;
            return `"${shortValue}"`;
        }

        async function deleteCurrentModule() {
            if (!currentModule) {
                return;
            }

            if (!confirm(`Permanently delete module ${currentModule.moduleNumber || currentModule.id}?\n\nThis will delete the module and all related records, including history. This cannot be undone.`)) {
                return;
            }

            setStatus("Deleting module permanently...");

            try {
                await deleteModule(moduleId);
                window.location.href = currentModule.studyProgramId
                    ? `/index.html?studyProgramId=${currentModule.studyProgramId}`
                    : "/index.html";
            } catch (error) {
                setStatus("Delete failed: " + error.message);
            }
        }

        function setStatus(message) {
            document.getElementById("status").textContent = message;
        }

        function updateModuleNumberWarning() {
            const value = document.getElementById("moduleNumber").value.trim();

            document.getElementById("moduleNumberWarning").hidden =
                value === "" || /^[A-Z0-9]+$/.test(value);
        }

        function formatNumber(value) {
            if (value === null || value === undefined || value === "") {
                return "";
            }
            return Number.isInteger(value) ? String(value) : String(Number(value.toFixed(2)));
        }

        init();
    </script>
</body>
</html>
