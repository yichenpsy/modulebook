<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Modulebook Import</title>
    <link rel="stylesheet" href="/app.css">
</head>
<body>
    <nav>
        <a href="/index.html">Modulebooks</a>
    </nav>

    <h1>Modulebook Import</h1>

    <section>
        <h2>Upload</h2>
        <p id="modulebookDisplay" class="muted">Loading modulebook...</p>

        <label>
            Datum des Modulhandbuchs
            <input id="modulebookReleaseDate" type="date">
        </label>

        <label>
            Studien- und Prüfungsordnung
            <input id="studyExaminationRegulationsDate" type="date">
        </label>

        <label>
            PDF
            <input type="file" id="pdfFile" accept="application/pdf">
        </label>

        <button type="button" onclick="uploadPdf()">Upload PDF</button>
        <button type="button" onclick="saveImportedModules()">Save imported modules</button>

        <div id="status" class="status">Ready.</div>
    </section>

    <section>
        <h2>Import Report</h2>
        <div id="reportSummary" class="summary">No import yet.</div>
    </section>

    <section>
        <h2>Imported Modules To Review</h2>
        <div id="importedModules">No imported modules yet.</div>
    </section>

    <script src="/api.js"></script>
    <script>
        let importedModules = [];
        let modulebook = null;
        const params = new URLSearchParams(window.location.search);
        const modulebookId = params.get("modulebookId");
        const importedModuleFieldDefinitions = [
            { key: "module_number", label: "Modulnummer", important: true, control: "input" },
            { key: "title", label: "Titel", important: true, control: "input" },
            { key: "credits", label: "Leistungspunkte", important: true, control: "number", step: "0.5" },
            { key: "workload", label: "Workload", important: true, control: "textarea", rows: 3 },
            { key: "teaching_form", label: "Lernform", important: true, control: "textarea", rows: 3 },
            { key: "status", label: "Modultyp", important: true, control: "input" },
            { key: "applicability", label: "Verwendbarkeit", control: "textarea", rows: 4 },
            { key: "learning_area", label: "Lerngebiet", control: "input" },
            { key: "learning_objectives", label: "Lernziele / Kompetenzen", control: "textarea", rows: 6 },
            { key: "prerequisites", label: "Voraussetzungen", control: "textarea", rows: 4 },
            { key: "level", label: "Niveaustufe", control: "input" },
            { key: "frequency", label: "Häufigkeit des Angebotes", control: "input" },
            { key: "exam_form", label: "Prüfungsform", control: "textarea", rows: 5 },
            { key: "contents", label: "Inhalte", control: "textarea", rows: 8 },
            { key: "literature", label: "Literatur", control: "textarea", rows: 6 },
            { key: "additional_notes", label: "Weitere Hinweise", control: "textarea", rows: 4 },
            { key: "module_grade", label: "Modulnote", control: "textarea", rows: 3 },
            { key: "recognized_modules", label: "Anerkannte Module", control: "textarea", rows: 3 },
            { key: "room_requirements", label: "Raumanforderungen", control: "input" },
            { key: "source_file", label: "Quelldatei", control: "input" },
            { key: "source_pages", label: "Quellseiten", control: "input" }
        ];

        async function init() {
            if (!modulebookId) {
                setStatus("Missing modulebook id. Open Import PDF from a modulebook row on the index page.");
                document.getElementById("modulebookDisplay").textContent = "No modulebook selected.";
                return;
            }

            try {
                const modulebooks = await loadModulebooks();
                modulebook = modulebooks.find(program => String(program.id) === String(modulebookId));
                if (!modulebook) {
                    setStatus(`Modulebook ${modulebookId} was not found.`);
                    document.getElementById("modulebookDisplay").textContent = "Modulebook not found.";
                    return;
                }

                document.getElementById("modulebookDisplay").textContent =
                    `Import PDF for ${modulebookLabel(modulebook)}`;
                setStatus("Ready.");
            } catch (error) {
                setStatus("Could not load modulebooks: " + error.message);
            }
        }

        async function uploadPdf() {
            const modulebookReleaseDate = document.getElementById("modulebookReleaseDate").value;
            const studyExaminationRegulationsDate = document.getElementById("studyExaminationRegulationsDate").value;
            const fileInput = document.getElementById("pdfFile");

            if (!modulebook) {
                setStatus("No modulebook selected.");
                return;
            }

            if (!modulebookReleaseDate) {
                setStatus("Please enter the modulebook release date.");
                return;
            }

            if (fileInput.files.length === 0) {
                setStatus("Please choose a PDF file first.");
                return;
            }

            const formData = new FormData();
            formData.append("modulebookId", modulebook.id);
            formData.append("modulebookReleaseDate", modulebookReleaseDate);
            if (studyExaminationRegulationsDate) {
                formData.append("studyExaminationRegulationsDate", studyExaminationRegulationsDate);
            }
            formData.append("file", fileInput.files[0]);

            setStatus("Uploading and processing PDF...");
            document.getElementById("reportSummary").textContent = "Processing...";
            document.getElementById("importedModules").textContent = "Processing...";

            try {
                const json = await normalizePdf(formData);
                importedModules = Array.isArray(json.normalizedModules) ? json.normalizedModules : [];

                setStatus(`Import finished. ${importedModules.length} modules found.`);
                renderReport(json);
                renderImportedModules();
            } catch (error) {
                setStatus("Import failed: " + error.message);
            }
        }

        async function saveImportedModules() {
            if (importedModules.length === 0) {
                setStatus("No imported modules to save.");
                return;
            }

            syncImportedModulesFromForm();

            const request = {
                modulebookId: Number(modulebookId),
                modulebookReleaseDate: document.getElementById("modulebookReleaseDate").value || null,
                studyExaminationRegulationsDate: document.getElementById("studyExaminationRegulationsDate").value || null,
                modules: importedModules
            };

            if (!modulebook) {
                setStatus("No modulebook selected.");
                return;
            }

            if (!request.modulebookReleaseDate) {
                setStatus("Please enter the modulebook release date.");
                return;
            }

            setStatus("Saving imported modules...");

            try {
                const json = await saveImportedModulesRequest(request);
                setStatus(`Save finished. Created: ${json.createdCount}, errors: ${json.errorCount}.`);

                if (json.errors && json.errors.length > 0) {
                    alert(json.errors.map(error =>
                        `Row ${error.index + 1} (${error.moduleNumber || "no module number"}): ${error.message}`
                    ).join("\n"));
                }

            } catch (error) {
                setStatus("Save failed: " + error.message);
            }
        }

        function renderReport(importResponse) {
            const report = importResponse.report || {};
            const summary = document.getElementById("reportSummary");

            summary.innerHTML = `
                <div><strong>Studiengang:</strong> ${escapeHtml(modulebookLabel(modulebook))}</div>
                <div><strong>Datum des Modulhandbuchs:</strong> ${escapeHtml(formatDateOnly(importResponse.modulebookReleaseDate))}</div>
                <div><strong>Studien- und Prüfungsordnung:</strong> ${escapeHtml(formatDateOnly(importResponse.studyExaminationRegulationsDate))}</div>
                <div><strong>Status:</strong> ${escapeHtml(report.status || "unknown")}</div>
                <div><strong>Detected modules:</strong> ${escapeHtml(String(report.detected_module_count || importedModules.length))}</div>
                <div><strong>Required modules:</strong> ${escapeHtml(String(report.required_module_count || ""))}</div>
                <div><strong>All required fields:</strong> ${escapeHtml(String(report.has_all_required_fields ?? ""))}</div>
                ${renderEmptyImportedFields()}
            `;
        }

        function renderEmptyImportedFields() {
            const modulesWithEmptyFields = importedModules
                .map(module => ({
                    moduleNumber: module.module_number,
                    sourcePages: module.source_pages,
                    emptyFields: emptyImportedFieldLabels(module)
                }))
                .filter(item => item.emptyFields.length > 0);

            if (modulesWithEmptyFields.length === 0) {
                return `
                    <div class="import-report-ok">
                        <strong>Empty fields:</strong> None
                    </div>
                `;
            }

            return `
                <div class="import-report-warning">
                    <strong>Empty fields:</strong>
                    <table>
                        <thead>
                            <tr>
                                <th>Module</th>
                                <th>Source pages</th>
                                <th>Empty fields</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${modulesWithEmptyFields.map(item => `
                                <tr>
                                    <td>${escapeHtml(item.moduleNumber || "No module number")}</td>
                                    <td>${escapeHtml(formatImportedFieldValue(item.sourcePages))}</td>
                                    <td>${escapeHtml(item.emptyFields.join(", "))}</td>
                                </tr>
                            `).join("")}
                        </tbody>
                    </table>
                </div>
            `;
        }

        function emptyImportedFieldLabels(module) {
            const fields = secondaryImportedFields(module).concat(importantImportedFields());
            const emptyFields = fields
                .filter(field => isEmptyImportedValue(module[field.key]))
                .map(field => field.label);
            const additionalFields = module.additional_fields || {};
            const emptyAdditionalFields = Object.keys(additionalFields)
                .filter(label => isEmptyImportedValue(additionalFields[label]));

            return emptyFields.concat(emptyAdditionalFields);
        }

        function isEmptyImportedValue(value) {
            if (value === null || value === undefined) {
                return true;
            }

            if (typeof value === "string") {
                return value.trim() === "";
            }

            if (Array.isArray(value)) {
                return value.length === 0;
            }

            if (typeof value === "object") {
                return Object.keys(value).length === 0;
            }

            return false;
        }

        function renderImportedModules() {
            const container = document.getElementById("importedModules");

            if (importedModules.length === 0) {
                container.textContent = "No imported modules found.";
                return;
            }

            container.innerHTML = importedModules.map((module, index) => `
                <div class="module-card" data-index="${index}">
                    <div class="module-field-table imported-module-field-table">
                        ${importantImportedFields().map(field => renderImportedFieldRow(field, module)).join("")}
                    </div>

                    <details class="imported-module-details">
                        <summary>Show all imported fields</summary>
                        <div class="module-field-table imported-module-field-table">
                            ${secondaryImportedFields(module).map(field => renderImportedFieldRow(field, module)).join("")}
                            ${renderAdditionalFieldsRows(module)}
                        </div>
                    </details>

                    <button type="button" onclick="removeImportedModule(${index})">Remove</button>
                </div>
            `).join("");
        }

        function importantImportedFields() {
            return importedModuleFieldDefinitions.filter(field => field.important);
        }

        function secondaryImportedFields(module) {
            const knownKeys = new Set(importedModuleFieldDefinitions.map(field => field.key));
            const configuredSecondaryFields = importedModuleFieldDefinitions.filter(field => !field.important);
            const extraTopLevelFields = Object.keys(module)
                .filter(key => !knownKeys.has(key) && key !== "additional_fields")
                .map(key => ({
                    key: key,
                    label: humanizeFieldName(key),
                    control: Array.isArray(module[key]) || typeof module[key] === "object" ? "textarea" : "input"
                }));

            return configuredSecondaryFields.concat(extraTopLevelFields);
        }

        function renderImportedFieldRow(field, module) {
            return `
                <div class="module-field-row">
                    <label class="module-field-label">${escapeHtml(field.label)}</label>
                    <div class="module-field-control">
                        ${renderImportedFieldControl(field, module)}
                    </div>
                </div>
            `;
        }

        function renderAdditionalFieldsRows(module) {
            const additionalFields = module.additional_fields || {};

            return Object.keys(additionalFields).map(label => `
                <div class="module-field-row">
                    <label class="module-field-label">${escapeHtml(label)}</label>
                    <div class="module-field-control">
                        <textarea data-additional-field="${escapeHtml(label)}" rows="3">${escapeHtml(formatImportedFieldValue(additionalFields[label]))}</textarea>
                    </div>
                </div>
            `).join("");
        }

        function renderImportedFieldControl(field, module) {
            const value = formatImportedFieldValue(module[field.key]);
            const rows = field.rows || 3;

            if (field.control === "textarea") {
                return `<textarea data-field="${escapeHtml(field.key)}" rows="${escapeHtml(String(rows))}">${escapeHtml(value)}</textarea>`;
            }

            if (field.control === "number") {
                const step = field.step || "1";
                return `<input data-field="${escapeHtml(field.key)}" type="number" step="${escapeHtml(step)}" value="${escapeHtml(value)}">`;
            }

            return `<input data-field="${escapeHtml(field.key)}" value="${escapeHtml(value)}">`;
        }

        function formatImportedFieldValue(value) {
            if (value === null || value === undefined) {
                return "";
            }

            if (Array.isArray(value)) {
                return value.join(", ");
            }

            if (typeof value === "object") {
                return JSON.stringify(value, null, 2);
            }

            return String(value);
        }

        function humanizeFieldName(key) {
            return key
                .replaceAll("_", " ")
                .replace(/\b\w/g, character => character.toUpperCase());
        }

        function syncImportedModulesFromForm() {
            document.querySelectorAll(".module-card").forEach(card => {
                const index = Number(card.dataset.index);
                const module = importedModules[index];

                card.querySelectorAll("[data-field]").forEach(input => {
                    const field = input.dataset.field;
                    module[field] = input.type === "number" ? numberOrNull(input.value) : input.value;
                });

                card.querySelectorAll("[data-additional-field]").forEach(input => {
                    if (!module.additional_fields) {
                        module.additional_fields = {};
                    }

                    module.additional_fields[input.dataset.additionalField] = input.value;
                });
            });
        }

        function removeImportedModule(index) {
            syncImportedModulesFromForm();
            importedModules.splice(index, 1);
            renderImportedModules();
            setStatus(`Removed module row ${index + 1}.`);
        }

        function modulebookLabel(program) {
            const suffix = degreeTypeShortLabel(program.degreeType);
            const name = program?.studyProgramName || program?.name || "";
            return suffix ? `${name} (${suffix})` : name;
        }

        function degreeTypeShortLabel(degreeType) {
            if (degreeType === "BACHELOR") {
                return "B.Sc.";
            }
            if (degreeType === "MASTER") {
                return "M.Sc.";
            }
            return "";
        }

        function formatDateOnly(value) {
            if (!value) {
                return "";
            }

            return new Date(`${value}T00:00:00`).toLocaleDateString("de-DE");
        }

        function setStatus(message) {
            document.getElementById("status").textContent = message;
        }

        init();
    </script>
</body>
</html>
