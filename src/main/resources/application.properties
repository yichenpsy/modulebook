# application.properties tells Spring how to connect.
# ModulebookApplication starts
# Spring Boot auto-configuration runs
# Spring Boot reads application.properties
# Spring Boot creates DataSource bean
# Spring Boot creates JdbcTemplate bean using DataSource
# ModuleRepository receives JdbcTemplate

spring.application.name=modulebook
server.port=8081

# Configure Database Connection：tells Spring Boot where the PostgreSQL database is.
# Use DATABASE_URL if it exists.
# If DATABASE_URL does not exist, use the local default:  jdbc:postgresql://localhost:5432/modulebook
# modulebook: database name
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5433/modulebook}
spring.datasource.username=${DATABASE_USERNAME:modulebook}
spring.datasource.password=${DATABASE_PASSWORD:modulebook}
spring.datasource.driver-class-name=org.postgresql.Driver

# Flyway uses DataSource to run database migrations.
spring.flyway.enabled=true

# Your local database already has an old modules table but no Flyway history table.
# baseline-on-migrate lets Flyway take over that existing schema, then run newer migrations.
spring.flyway.baseline-on-migrate=true

# If PDF_IMPORT_SERVICE_URL is set, the Spring app sends the PDF to that HTTP service.
# If it is empty, local development falls back to running the Python pipeline directly.
pdf-import.service-url=${PDF_IMPORT_SERVICE_URL:}
pdf-import.python-executable=/Users/yichenzhong/__repo/modulebook/.venv/bin/python
pdf-import.repo-root=/Users/yichenzhong/__repo/modulebook
pdf-import.job-root=/Users/yichenzhong/__repo/modulebook/tools/pdf_import/data/import_jobs
pdf-import.base-yaml=/Users/yichenzhong/__repo/modulebook/tools/pdf_import/configs/base.yaml
pdf-import.import-manifest=/Users/yichenzhong/__repo/modulebook/tools/pdf_import/configs/import_manifest.yaml
pdf-import.timeout-seconds=300

spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

logging.level.org.springframework.jdbc.core=DEBUG
logging.level.org.springframework.jdbc.core.JdbcTemplate=DEBUG
logging.level.org.springframework.jdbc.core.StatementCreatorUtils=TRACE