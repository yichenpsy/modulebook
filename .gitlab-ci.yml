stages:
  - test
  - docker
  - test-deploy
  - deploy

variables:
  IMAGE_NAME: "$CI_REGISTRY_IMAGE/hello-springboot"

build-and-test:
  stage: test
  tags:
    - modulebook
  image: maven:3.9-eclipse-temurin-21
  script:
    - mvn clean test

build-and-push-image:
  stage: docker
  tags:
    - modulebook
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  variables:
    DOCKER_CONFIG: /kaniko/.docker/
  script:
    - docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD"
    - docker buildx build --platform linux/amd64 -t "$IMAGE_NAME:$CI_COMMIT_SHORT_SHA" -t "$IMAGE_NAME:latest" --push .
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'


test-kubernetes-runner:
  stage: test-deploy
  tags:
    - modulebook
  image:
    name: bitnami/kubectl:latest
    entrypoint: [""]
  script:
    - kubectl config current-context
    - kubectl get pods -n yizh8704
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

# test

deploy-to-kubernetes:
  stage: deploy
  tags:
    - modulebook
  image:
    name: alpine/kubectl:latest
    entrypoint: [""]
  needs:
    - build-and-push-image
  script:
    - mkdir -p ~/.kube
    - echo "$KUBE_CONFIG" | base64 -d > ~/.kube/config
    - kubectl apply -f k8s/
    - kubectl set image deployment/hello-springboot hello-springboot="$IMAGE_NAME:$CI_COMMIT_SHORT_SHA"
    - kubectl rollout status deployment/hello-springboot
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
