stages:
  - test
  - docker
  - deploy

# image repository path
variables:
  IMAGE_NAME: "$CI_REGISTRY_IMAGE/modulebook-image"

build-and-test:
  stage: test
  tags:
    - modulebook
  image: maven:3.9-eclipse-temurin-21
  services:
    - name: postgres:16
      alias: postgres
  variables:
    POSTGRES_DB: modulebook
    POSTGRES_USER: modulebook
    POSTGRES_PASSWORD: modulebook
    DATABASE_URL: jdbc:postgresql://postgres:5432/modulebook
    DATABASE_USERNAME: modulebook
    DATABASE_PASSWORD: modulebook
  script:
    - mvn clean test

build-and-push-image:
  stage: docker
  tags:
    - modulebook
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  variables:
    DOCKER_CONFIG: /kaniko/.docker
  script:
    - mkdir -p /kaniko/.docker
    - printf '{"auths":{"%s":{"username":"%s","password":"%s"}}}' "$CI_REGISTRY" "$CI_REGISTRY_USER" "$CI_REGISTRY_PASSWORD" > "$DOCKER_CONFIG/config.json"
    - |
      /kaniko/executor \
        --context "$CI_PROJECT_DIR" \
        --dockerfile "$CI_PROJECT_DIR/Dockerfile" \
        --destination "$IMAGE_NAME:$CI_COMMIT_SHORT_SHA" \
        --destination "$IMAGE_NAME:latest"
  rules:
    - if: "$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH"
    - if: '$CI_COMMIT_BRANCH == "feature/pdf-import-pipeline"'

# test

deploy-to-kubernetes:
  stage: deploy
  tags:
    - modulebook
  image:
    name: alpine/kubectl:latest
    entrypoint: [""]
  needs:
    - build-and-push-image
  script:
    - kubectl apply -f k8s/postgres.yaml
    - kubectl apply -f k8s/deployment.yaml # apply: create or update the service in the file
    - kubectl apply -f k8s/service.yaml
    - kubectl apply -f k8s/ingress.yaml
    - kubectl set image deployment/modulebook-deployment modulebook-container="$IMAGE_NAME:$CI_COMMIT_SHORT_SHA"
    - kubectl rollout status deployment/modulebook-deployment
  rules:
    - if: "$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH"
    - if: '$CI_COMMIT_BRANCH == "feature/pdf-import-pipeline"'
