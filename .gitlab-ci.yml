stages:
  - test
  - docker

build-and-test:
  stage: test
  image: maven:3.9-eclipse-temurin-21
  script:
    - mvn clean test

build-and-push-image:
  stage: docker
  image: docker:26
  services:
    - docker:26-dind
  variables:
    DOCKER_TLS_CERTDIR: ""
  script:
    - docker login registry.bht-berlin.de -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD"
    - docker buildx build --platform linux/amd64 -t registry.bht-berlin.de/ris/modulebook/hello-springboot:latest --push .