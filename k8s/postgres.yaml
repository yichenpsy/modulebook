# This file creates a PostgreSQL database inside Kubernetes for the Modulebook app.
# It creates 4 Kubernetes resources:
# 1. Secret: database name, username, password
# 2. PersistentVolumeClaim: disk space for database data
# 3. Deployment: runs the PostgreSQL container
# 4. Service: gives PostgreSQL a stable internal address

apiVersion: v1
kind: Secret
metadata:
  name: modulebook-postgres-secret
type: Opaque
stringData:
  POSTGRES_DB: modulebook
  POSTGRES_USER: modulebook
  POSTGRES_PASSWORD: modulebook
---
# PersistentVolumeClaim asks Kubernetes for persistent disk storage.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: modulebook-postgres-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
# Deployment runs and keeps one PostgreSQL Pod alive.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: modulebook-postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: modulebook-postgres
  template:
    metadata:
      labels:
        app: modulebook-postgres
    spec:
      containers:
        - name: postgres
          # Official PostgreSQL Docker image, version 16.
          image: postgres:16
          ports:
            # PostgreSQL listens on port 5432 inside the container.
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: modulebook-postgres-secret
          env:
            - name: PGDATA
              # Store database files in a subfolder because PVC mount roots can contain lost+found.
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: postgres-data
              # This folder is the mounted persistent disk. PGDATA above chooses the real database subfolder.
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            # Uses the persistent disk requested above.
            claimName: modulebook-postgres-pvc
---
# Service gives PostgreSQL a stable internal DNS name:
# modulebook-postgres
#
# The Spring Boot app can connect with:
# jdbc:postgresql://modulebook-postgres:5432/modulebook
apiVersion: v1
kind: Service
metadata:
  # This name becomes the internal Kubernetes hostname for the database.
  name: modulebook-postgres
spec:
  selector:
    # Send traffic to Pods with this label.
    app: modulebook-postgres
  ports:
    # Other Pods use modulebook-postgres:5432 to reach PostgreSQL.
    - port: 5432
      # Forward traffic to the PostgreSQL container port.
      targetPort: 5432
