apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: modulebook-ingress
spec:
  ingressClassName: nginx
  rules:
    - host: "modulebook.project.ris.bht-berlin.de"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: modulebook-service
                port:
                  number: 80