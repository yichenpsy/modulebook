# A service provides a stable address for Pods
# Why? Pods are unstable, but other parts of the system need a stable address to reach your app.

apiVersion: v1 # Kubernetes API version
kind: Service
metadata:
  name: modulebook-service
spec: 
  selector:
    app: modulebook-app
  ports:
    - protocol: TCP #
      port: 80 # stable front door for service
      # Inside the Kubernetes cluster, this Service receives traffic on port 80. 
      # 80 = standard HTTP port
      targetPort: 8081 # Service forwards it to Pod/container port 8081. 
      # container/app listens on port 8081 inside the Pod network.