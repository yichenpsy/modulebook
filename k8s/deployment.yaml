apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-springboot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hello-springboot
  template:
    metadata:
      labels:
        app: hello-springboot
    spec:
      containers:
        - name: hello-springboot
          image: registry.bht-berlin.de/ris/modulebook/hello-springboot:latest
          ports:
            - containerPort: 8081