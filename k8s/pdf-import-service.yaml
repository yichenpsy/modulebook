# This deployment runs the Python PDF import pipeline in a separate container.
# The Spring app calls it with PDF_IMPORT_SERVICE_URL=http://pdf-import-service:8000/import.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: pdf-import-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pdf-import-service
  template:
    metadata:
      labels:
        app: pdf-import-service
    spec:
      containers:
        - name: pdf-import-service-container
          image: registry.bht-berlin.de/ris/modulebook/pdf-import-service-image:latest
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: pdf-import-service
spec:
  selector:
    app: pdf-import-service
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
